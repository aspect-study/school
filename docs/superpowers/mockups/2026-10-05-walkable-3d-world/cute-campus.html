<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cute campus preview</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe3f1;font-family:'Baloo 2',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  .hud{position:fixed;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  .pill{pointer-events:auto;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 18px;font-weight:800;color:#7a3e8e;box-shadow:0 4px 0 #f3b6d6;font-size:18px}
  .coins{color:#c98a00;box-shadow:0 4px 0 #ffd98a}
  .joy{position:fixed;left:28px;bottom:28px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.45);border:4px dashed rgba(255,255,255,.95)}
  .knob{position:absolute;left:36px;top:36px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffc2e2);box-shadow:0 5px 0 #f08cc0;display:grid;place-items:center;font-size:26px}
  .enter{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) scale(.5);opacity:0;transition:.3s cubic-bezier(.3,1.7,.5,1);
    background:linear-gradient(#ffe066,#ffb3d9);color:#6a2c70;border:4px solid #fff;border-radius:999px;padding:12px 32px;font:800 24px 'Baloo 2';
    box-shadow:0 6px 0 #e58fbf,0 12px 28px rgba(200,80,150,.3);pointer-events:none}
  .enter.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-6px) scale(1.03)}}
  .note{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(122,62,142,.85);color:#fff;padding:6px 14px;border-radius:12px;font-size:14px;white-space:nowrap}
  @media (max-width:600px){.note{font-size:11px}}
</style>
</head>
<body>
<div class="hud"><div class="pill">🌸 Campus</div><div class="pill coins">🪙 124</div></div>
<div class="note">Mockup · joystick or WASD to walk · drag the screen to look around</div>
<div class="joy" id="joy"><div class="knob" id="knob">🐾</div></div>
<button class="enter" id="enter"></button>

  var dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  var ix = joy.x + ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
  var iy = joy.y + ((keys.s || keys.arrowdown) ? 1 : 0) - ((keys.w || keys.arrowup) ? 1 : 0);
  var mag = Math.min(1, Math.hypot(ix, iy));
  if (mag > 0.08) {
    var fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    var mx = fx * -iy + rx * ix, mz = fz * -iy + rz * ix, ml = Math.hypot(mx, mz);
    mx /= ml; mz /= ml;
    var sp = 12 * mag * dt, nx = player.position.x + mx * sp, nz = player.position.z + mz * sp;
    if (!blocked(nx, player.position.z)) player.position.x = nx;
    if (!blocked(player.position.x, nz)) player.position.z = nz;
    var target = Math.atan2(mx, mz), diff = ((target - player.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    player.rotation.y += diff * Math.min(1, dt * 12);
    walkT += dt * 12 * mag;
  } else walkT *= 0.85;
  var sw = Math.sin(walkT) * 0.7 * Math.min(1, mag + 0.001), hop = Math.abs(Math.sin(walkT));
  legL.rotation.x = sw; legR.rotation.x = -sw; armL.rotation.x = -sw; armR.rotation.x = sw;
  armL.rotation.z = -0.25; armR.rotation.z = 0.25;
  body.position.y = hop * 0.25 * Math.min(1, mag * 2);
  body.scale.set(1 + (1 - hop) * 0.04 * mag, 1 - (1 - hop) * 0.05 * mag, 1);
  head.rotation.z = Math.sin(time * 1.6) * 0.05;
  head.position.y = 4.1 + Math.sin(time * 2.2) * 0.05;

  tmp.set(player.position.x - Math.sin(player.rotation.y) * 2.6 + 1.4, 0, player.position.z - Math.cos(player.rotation.y) * 2.6);
  pet.position.lerp(tmp, Math.min(1, dt * 4));
  petBody.position.y = 0.75 + Math.abs(Math.sin(time * 7)) * 0.35;
  pet.lookAt(player.position.x, pet.position.y, player.position.z);

  var dist = 15;
  camPos.set(player.position.x + Math.sin(yaw) * dist * Math.cos(pitch), 2.5 + Math.sin(pitch) * dist, player.position.z + Math.cos(yaw) * dist * Math.cos(pitch));
  camera.position.lerp(camPos, Math.min(1, dt * 6));
  camera.lookAt(player.position.x, 3.4, player.position.z);
  sun.position.set(player.position.x + 25, 45, player.position.z + 25); sun.target.position.copy(player.position);

  near = null;
  buildings.forEach(function (b) {
    var on = Math.hypot(player.position.x - b.door.x, player.position.z - b.door.z) < 4.5;
    if (on) near = b;
    b.mat.material.color.set(on ? '#ffe066' : '#ffffff');
    var s = 1 + Math.sin(time * 3) * 0.06 + (on ? 0.2 : 0); b.mat.scale.set(s, 1, s);
    b.sign.position.y = b.sign.userData.y || (b.sign.userData.y = b.sign.position.y);
    b.sign.position.y = b.sign.userData.y + Math.sin(time * 2 + b.z) * 0.25;
    b.spark.visible = on; b.spark.position.y = 1.8 + Math.sin(time * 5) * 0.3;
  });
  if (near) { if (!opening) enterBtn.textContent = near.emoji + ' Go to ' + near.name + '!'; enterBtn.classList.add('show'); }
  else { enterBtn.classList.remove('show'); opening = false; }
  clouds.forEach(function (c, i) { c.position.x += dt * (0.6 + i % 3 * 0.3); if (c.position.x > 90) c.position.x = -90; });
  butterflies.forEach(function (bf) {
    bf.s.position.set(bf.x + Math.sin(time * 0.7 + bf.o) * 4, 2.5 + Math.sin(time * 3 + bf.o) * 0.6, bf.z + Math.cos(time * 0.5 + bf.o) * 4);
  });
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize', function () { W = innerWidth; H = innerHeight; renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix(); });
loop();
</script>
</body>
</html>
