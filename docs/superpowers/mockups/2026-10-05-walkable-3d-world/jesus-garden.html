<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Garden preview</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff4e6;font-family:'Baloo 2',system-ui,sans-serif;touch-action:none}
  canvas{display:block}
  .bubble{position:fixed;left:50%;top:22px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));box-sizing:border-box;background:#fff;border-radius:28px;padding:16px 22px 18px;
    box-shadow:0 6px 0 #f6d2a8,0 14px 30px rgba(200,140,60,.25);color:#5b3a1a;text-align:center}
  .who{font-weight:800;color:#d4893a;font-size:15px;letter-spacing:.5px}
  .say{font-size:22px;font-weight:800;line-height:1.25;margin:4px 0}
  .verse{font-size:15px;color:#8a6a4a;font-weight:600}
  .row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .row button{font:800 17px 'Baloo 2';border:0;border-radius:999px;padding:8px 18px;cursor:pointer;background:#ffe8c7;color:#7a4a12;box-shadow:0 4px 0 #f0c48a}
  .row button.main{background:linear-gradient(#ffd6e7,#ffb3d1);color:#7a2550;box-shadow:0 4px 0 #e58fb5}
  .note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(91,58,26,.8);color:#fff;padding:6px 14px;border-radius:12px;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<div class="bubble">
  <div class="who">💛 JESUS</div>
  <div class="say" id="say">I am so happy you came to see Me today. I love you always, on easy days and hard days.</div>
  <div class="verse" id="verse">"I have loved you with an everlasting love." · Jeremiah 31:3</div>
  <div class="row"><button class="main" id="hug">🤗 Hug</button><button id="more">💬 Tell me more</button></div>
</div>
<div class="note">Mockup · a quiet garden at the edge of the map · drag to turn</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

var LINES = [
  ['I am so happy you came to see Me today. I love you always, on easy days and hard days.', '"I have loved you with an everlasting love." · Jeremiah 31:3'],
  ['Did a question feel hard? That is okay. I am with you, and you can try again.', '"I can do all things through Christ who strengthens me." · Philippians 4:13'],
  ['Be kind to your sister today. Love is patient and love is kind.', '"Love is patient, love is kind." · 1 Corinthians 13:4'],
  ['You do not have to be perfect for Me to love you. You are already Mine.', '"Fear not, for I am with you." · Isaiah 41:10']
];
var li = 0;
document.getElementById('more').onclick = function () {
  li = (li + 1) % LINES.length;
  document.getElementById('say').textContent = LINES[li][0];
  document.getElementById('verse').textContent = LINES[li][1];
};

var W = innerWidth, H = innerHeight;
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
var scene = new THREE.Scene();
(function () {
  var c = document.createElement('canvas'); c.width = 2; c.height = 256; var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#ffd9a8'); g.addColorStop(0.5, '#ffeccf'); g.addColorStop(1, '#fff6ea');
  x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
})();
scene.fog = new THREE.Fog('#fff1de', 30, 80);
var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
scene.add(new THREE.HemisphereLight('#fff8ee', '#cdeec0', 1.7));
var sun = new THREE.DirectionalLight('#ffe7c2', 2); sun.position.set(-10, 20, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 5; scene.add(sun);

var ramp = new THREE.DataTexture(new Uint8Array([160, 215, 255]), 3, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
var cache = {};
function toon(c, o) { var k = c + JSON.stringify(o || {}); return cache[k] || (cache[k] = new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: ramp }, o || {}))); }
function add(g, m, x, y, z, p) { var o = new THREE.Mesh(g, typeof m === 'string' ? toon(m) : m); o.position.set(x || 0, y || 0, z || 0); o.castShadow = o.receiveShadow = true; (p || scene).add(o); return o; }
function rbox(w, h, d, r) { return new RoundedBoxGeometry(w, h, d, 4, r); }
function ball(r) { return new THREE.SphereGeometry(r, 24, 16); }

var ground = add(new THREE.CircleGeometry(60, 48), '#b9e8a6'); ground.rotation.x = -Math.PI / 2;
var path = add(new THREE.CircleGeometry(5, 40), '#fff1d6', 0, 0.02, 0); path.rotation.x = -Math.PI / 2;
for (var f = 0; f < 90; f++) {
  var a = f * 2.4, r = 6 + (f * 7 % 14);
  add(ball(0.28), ['#ffffff', '#ffd1e8', '#fff3a0', '#d9c2ff'][f % 4], Math.cos(a) * r, 0.35, Math.sin(a) * r - 2).castShadow = false;
}
function tree(x, z, s, c) {
  add(new THREE.CylinderGeometry(0.4 * s, 0.6 * s, 3 * s, 12), '#c48a6a', x, 1.5 * s, z);
  add(ball(2.2 * s), c, x, 4.2 * s, z); add(ball(1.5 * s), c, x - 1.5 * s, 3.6 * s, z + 0.4); add(ball(1.4 * s), c, x + 1.4 * s, 3.8 * s, z);
}
tree(-8, -6, 1.2, '#ffc4dd'); tree(8.5, -7, 1.3, '#9be3a8'); tree(-13, 2, 1, '#9be3a8'); tree(13, 1, 1, '#ffc4dd');
var bench = add(rbox(5, 0.5, 1.6, 0.2), '#e7b58c', 0, 1.3, -1.6);
add(rbox(5, 1.4, 0.4, 0.2), '#e7b58c', 0, 2.2, -2.3);
[-2, 2].forEach(function (x) { add(rbox(0.4, 1.1, 1.4, 0.15), '#c98f62', x, 0.55, -1.6); });

function faceTex() {
  var c = document.createElement('canvas'); c.width = c.height = 256; var x = c.getContext('2d');
  x.fillStyle = '#f6d3b0'; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = '#4a2c1a'; x.lineWidth = 9; x.lineCap = 'round';
  x.beginPath(); x.arc(88, 120, 16, Math.PI * 1.1, Math.PI * 1.9); x.stroke();
  x.beginPath(); x.arc(168, 120, 16, Math.PI * 1.1, Math.PI * 1.9); x.stroke();
  x.fillStyle = 'rgba(255,140,150,.45)'; x.beginPath(); x.ellipse(60, 150, 20, 11, 0, 0, 7); x.ellipse(196, 150, 20, 11, 0, 0, 7); x.fill();
  x.fillStyle = '#8a5a36'; x.beginPath(); x.moveTo(30, 175); x.quadraticCurveTo(128, 300, 226, 175); x.lineTo(226, 256); x.lineTo(30, 256); x.closePath(); x.fill();
  x.strokeStyle = '#4a2c1a'; x.lineWidth = 7; x.beginPath(); x.arc(128, 150, 16, 0.3, Math.PI - 0.3); x.stroke();
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
var jesus = new THREE.Group(); jesus.position.set(0, 0, -1.2); scene.add(jesus);
var SKIN = '#f6d3b0', HAIR = '#7a4a2a';
var robe = add(new THREE.CylinderGeometry(0.95, 1.5, 2.6, 28), '#fffaf2', 0, 2.6, 0, jesus);
var sash = add(rbox(0.55, 3.1, 2.75, 0.25), '#6fa8ff', 0, 2.75, 0, jesus);
sash.rotation.z = 0.55; sash.scale.set(1, 1, 1);
add(new THREE.TorusGeometry(1.05, 0.12, 8, 28), '#e8c46a', 0, 2.2, 0, jesus).rotation.x = Math.PI / 2;
var head = new THREE.Group(); head.position.y = 4.9; jesus.add(head);
var skin = toon(SKIN), face = new THREE.MeshToonMaterial({ map: faceTex(), gradientMap: ramp });
add(rbox(2.5, 2.4, 2.3, 0.9), [skin, skin, skin, skin, face, skin], 0, 0, 0, head);
add(rbox(2.7, 1, 2.5, 0.45), HAIR, 0, 1.05, -0.1, head);
add(rbox(2.8, 2.6, 0.9, 0.45), HAIR, 0, -0.25, -0.95, head);
[-1, 1].forEach(function (s) { add(rbox(0.6, 2.2, 1.4, 0.3), HAIR, s * 1.3, -0.35, -0.3, head); });
var halo = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.13, 12, 48), new THREE.MeshBasicMaterial({ color: '#ffe27a' }));
halo.position.set(0, 1.95, -0.2); halo.rotation.x = Math.PI / 2.4; head.add(halo);
var glow = new THREE.Mesh(new THREE.CircleGeometry(2.6, 48), new THREE.MeshBasicMaterial({ color: '#fff3b8', transparent: true, opacity: 0.45, depthWrite: false }));
glow.position.set(0, 0.2, -1.4); head.add(glow);
function arm(side) {
  var p = new THREE.Group(); p.position.set(side * 1.05, 3.6, 0.1); jesus.add(p);
  add(rbox(0.65, 1.5, 0.65, 0.3), '#fffaf2', 0, -0.75, 0, p);
  add(ball(0.3), SKIN, 0, -1.6, 0, p); return p;
}
var armL = arm(-1), armR = arm(1); armL.rotation.z = -0.5; armR.rotation.z = 0.5; armL.rotation.x = armR.rotation.x = -0.4;
[-0.45, 0.45].forEach(function (x) { add(rbox(0.6, 0.3, 0.9, 0.14), '#c98f62', x, 0.15, 0.4, jesus); });

var lamb = new THREE.Group(); lamb.position.set(2.6, 0, 1.2); lamb.rotation.y = -0.6; scene.add(lamb);
[[0, 0.9, 0, 0.75], [0.6, 0.95, 0, 0.55], [-0.6, 0.95, 0, 0.55], [0, 1.25, 0.3, 0.55], [0, 1.2, -0.4, 0.5]].forEach(function (p) { add(ball(p[3]), '#ffffff', p[0], p[1], p[2], lamb); });
var lh = add(ball(0.45), '#3a3040', 0, 1.3, 0.95, lamb); lh.scale.set(1, 0.9, 1.1);
[-0.35, 0.35].forEach(function (x) { add(ball(0.17), '#3a3040', x, 1.5, 0.85, lamb).scale.set(1.6, 0.6, 0.8); });
[-0.15, 0.15].forEach(function (x) { add(ball(0.06), '#ffffff', x, 1.4, 1.35, lamb); });
[[-0.4, 0.4], [0.4, 0.4], [-0.4, -0.4], [0.4, -0.4]].forEach(function (p) { add(new THREE.CylinderGeometry(0.12, 0.12, 0.6, 10), '#3a3040', p[0], 0.3, p[1], lamb); });

var hearts = [];
function heartTex(e) {
  var c = document.createElement('canvas'); c.width = c.height = 128; var x = c.getContext('2d');
  x.font = '96px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 64, 72);
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
var htex = [heartTex('💛'), heartTex('💗'), heartTex('✨')];
function burst(n) {
  for (var i = 0; i < n; i++) {
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: htex[i % 3], transparent: true, depthWrite: false }));
    s.scale.set(0.9, 0.9, 1); s.position.set((Math.random() - 0.5) * 3, 4 + Math.random(), 0.5 + Math.random());
    scene.add(s); hearts.push({ s: s, vy: 1.5 + Math.random() * 1.5, vx: (Math.random() - 0.5) * 1.2, life: 2.4 });
  }
}
var hugT = 0;
document.getElementById('hug').onclick = function () { hugT = 1.2; burst(18); };

var yaw = 0.35, drag = null;
addEventListener('pointerdown', function (e) { if (e.target.tagName !== 'BUTTON') drag = e.clientX; });
addEventListener('pointermove', function (e) { if (drag !== null) { yaw -= (e.clientX - drag) * 0.006; drag = e.clientX; } });
addEventListener('pointerup', function () { drag = null; });
var clock = new THREE.Clock(), ambient = 0;
function loop() {
  var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  camera.position.set(Math.sin(yaw) * 15, 6.5, Math.cos(yaw) * 15 - 1); camera.lookAt(0, 4.4, -1);
  head.rotation.z = Math.sin(t * 1.2) * 0.05; head.position.y = 4.9 + Math.sin(t * 1.6) * 0.05;
  halo.rotation.z = t * 0.6; glow.material.opacity = 0.35 + Math.sin(t * 2) * 0.1;
  var open = hugT > 0 ? Math.sin(Math.min(1, (1.2 - hugT) * 3) * Math.PI / 2) : 0;
  armL.rotation.z = -0.5 - open * 0.9; armR.rotation.z = 0.5 + open * 0.9;
  hugT = Math.max(0, hugT - dt);
  lamb.position.y = Math.abs(Math.sin(t * 3)) * 0.15;
  ambient += dt; if (ambient > 1.4) { ambient = 0; burst(1); }
  hearts = hearts.filter(function (h) {
    h.life -= dt; h.s.position.y += h.vy * dt; h.s.position.x += h.vx * dt; h.s.material.opacity = Math.min(1, h.life);
    if (h.life <= 0) { scene.remove(h.s); return false; } return true;
  });
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
addEventListener('resize', function () { W = innerWidth; H = innerHeight; renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix(); });
loop();
</script>
</body>
</html>
