<html lang="en">
<meta charset="utf-8">
<title>Block Bot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2FF; --surface:#FFFFFF; --surface2:#EFE9FF;
  --ink:#241C3D; --ink-soft:#5B5478;
  --accent:#7C3AED; --accent-ink:#FFFFFF;
  --gold:#FFC93C; --coral:#FF6B6B;
  --good:#22A560; --bad:#E0483E;
  --border:#E1D8FA;
  --shadow: 0 8px 24px rgba(124,58,237,0.14);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161022; --surface:#211934; --surface2:#2A2044;
    --ink:#F2EEFF; --ink-soft:#B8AEDD;
    --accent:#9D6BFF; --accent-ink:#161022;
    --gold:#FFD666; --coral:#FF8A80;
    --good:#3FCB86; --bad:#FF6B60;
    --border:#382A57;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#161022; --surface:#211934; --surface2:#2A2044;
  --ink:#F2EEFF; --ink-soft:#B8AEDD;
  --accent:#9D6BFF; --accent-ink:#161022;
  --gold:#FFD666; --coral:#FF8A80;
  --good:#3FCB86; --bad:#FF6B60;
  --border:#382A57;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Mulish',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Lilita One',cursive; font-weight:400; letter-spacing:0.02em;}
.app{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}
button:focus-visible, a:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* HOME */
.hero{display:flex; align-items:center; gap:14px; margin:10px 0 20px;}
.hero-bot{width:76px; height:92px; flex:none;}
.hero h1{font-size:2.1rem; margin:0; color:var(--accent);}
.hero p{margin:4px 0 0; color:var(--ink-soft); font-size:0.95rem;}
.lesson-grid{display:grid; gap:14px;}
.lesson-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
  text-align:left; width:100%;
}
.lesson-emoji{font-size:2rem; flex:none; width:52px; height:52px; border-radius:14px;
  background:var(--surface2); display:flex; align-items:center; justify-content:center;}
.lesson-info{flex:1; min-width:0;}
.lesson-info h3{margin:0 0 2px; font-size:1.15rem;}
.lesson-info p{margin:0; color:var(--ink-soft); font-size:0.85rem;}
.stars{margin-top:6px; font-size:0.95rem; letter-spacing:2px;}
.star-on{color:var(--gold);}
.star-off{color:var(--border);}
.go-btn{
  flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:10px 16px; font-weight:800; font-size:0.9rem;
}

/* FLASHCARDS */
.screen-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{background:none; border:none; color:var(--accent); font-weight:800; font-size:0.95rem; padding:6px 4px;}
.screen-head h2{margin:0; font-size:1.4rem; flex:1;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px 24px; box-shadow:var(--shadow); gap:14px;
}
.card-icon{font-size:2.6rem;}
.card-icon.has-art{font-size:0; line-height:0;}
.money-group{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;}
.money-group svg{display:block;}
.q-art{margin:2px 0 14px;}
.card-term{font-family:'Lilita One',cursive; font-size:1.6rem; color:var(--accent);}
.card-def{font-size:1.05rem; color:var(--ink-soft); line-height:1.5;}
.card-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px;}
.nav-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:12px;
  padding:12px 18px; font-weight:700;
}
.nav-btn:disabled{opacity:0.4; cursor:default;}
.dots{display:flex; gap:6px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent);}
.primary-btn{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
  padding:14px 22px; font-weight:800; font-size:1rem; width:100%; margin-top:18px;
}

/* QUIZ */
.quiz-top{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.progress-bar{flex:1; height:10px; background:var(--surface2); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); transition:width .3s;}
.quiz-bot{width:44px; height:52px; flex:none;}
.q-text{font-size:1.2rem; font-weight:800; margin:6px 0 16px;}
.options{display:grid; gap:10px;}
.option{
  background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
  text-align:left; font-size:1rem; font-weight:600; color:var(--ink);
}
.option.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.option.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
.option:disabled{cursor:default;}
.option.explorable{border-style:dashed;}
.option.explored{box-shadow:0 0 0 3px var(--surface2);}
.explore{margin-top:10px;}
.explore-hint{font-size:0.88rem; color:var(--ink-soft); font-weight:700;}
.explore-card{margin-top:8px; background:var(--surface); border:2px solid var(--border); border-left:5px solid var(--bad); border-radius:12px; padding:9px 12px; line-height:1.45; font-size:0.95rem;}
.explore-card.explore-right{border-left-color:var(--good);}
.explore-card b{display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);}
.explore-card .learn-choice{font-weight:800;}
.explore-card .learn-why{display:block; margin-top:3px;}
.explore-card .fb-en{margin-top:4px;}
.feedback{margin-top:14px; padding:14px 16px; border-radius:14px; font-size:0.95rem; line-height:1.5;}
.feedback.good{background:color-mix(in srgb, var(--good) 16%, var(--surface)); color:var(--ink);}
.feedback.bad{background:color-mix(in srgb, var(--bad) 16%, var(--surface)); color:var(--ink);}
.feedback strong{display:block; margin-bottom:4px; font-family:'Lilita One',cursive; font-size:1.05rem;}

/* RESULTS */
.results{text-align:center; padding:20px 10px;}
.results-bot{width:160px; height:190px; margin:0 auto 14px;}
.results h2{font-size:1.8rem; color:var(--accent); margin:0 0 4px;}
.score-line{font-size:1.1rem; color:var(--ink-soft); margin-bottom:10px;}
.results-stars{font-size:2rem; letter-spacing:8px; margin-bottom:18px;}
.points-total{display:inline-flex; align-items:center; gap:6px; background:color-mix(in srgb, var(--gold) 30%, var(--surface)); color:var(--ink); font-weight:800; font-size:0.85rem; padding:6px 14px; border-radius:999px; margin-top:8px;}
.points-live{font-size:0.85rem; font-weight:800; color:var(--ink); white-space:nowrap; margin-left:auto;}
.points-live .streak{color:var(--bad); margin-left:4px;}
.points-earned{font-size:1rem; font-weight:800; color:var(--ink); margin-bottom:4px;}
.missed-review{display:none; text-align:left; margin:0 0 18px; padding-top:16px; border-top:1px solid var(--border);}
.missed-review.show{display:block;}
.missed-review h3{font-size:1rem; font-family:'Lilita One',cursive; font-weight:400; color:var(--ink); margin:0 0 10px; text-align:center;}
.missed-list{max-height:340px; overflow-y:auto; padding-right:2px;}
.missed-item{background:var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.missed-item .missed-q{white-space:pre-line; font-weight:700; color:var(--ink); margin:0 0 4px; line-height:1.4; font-size:0.96rem;}
.missed-item .missed-explain{color:var(--ink-soft); margin:0; line-height:1.4; font-size:0.9rem;}
.results-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.secondary-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:14px;
  padding:12px 20px; font-weight:700;
}

/* bot pieces */
.piece{opacity:0; transform:scale(0.6); transform-origin:center; transition:opacity .35s ease, transform .35s ease;}
.piece.on{opacity:1; transform:scale(1);}

/* NUMBER LINE */
.nline-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.mode-badge{display:inline-block; font-size:0.78rem; font-weight:800; padding:4px 12px; border-radius:999px; margin-bottom:12px;}
.mode-badge.guided{background:var(--surface2); color:var(--accent);}
.mode-badge.challenge{background:color-mix(in srgb, var(--coral) 18%, var(--surface)); color:var(--coral);}
.nline-svg{width:100%; margin-bottom:14px;}
.nline-svg svg{width:100%; height:auto; display:block;}
.nline-input-row{display:flex; align-items:center; gap:10px; font-size:1.15rem; font-weight:800; flex-wrap:wrap;}
.nline-input{width:64px; padding:10px; font-size:1.1rem; font-weight:800; text-align:center; border:2px solid var(--border); border-radius:10px; font-family:inherit; color:var(--ink); background:var(--bg);}
.nline-input.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--bg));}
.nline-input.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--bg));}
.check-btn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:10px 18px; font-weight:800; font-size:0.95rem;}
.check-btn:disabled{opacity:0.5;}

/* FINAL EXAM CARD */
.final-card{border-color:var(--gold); background:linear-gradient(135deg, var(--surface2), var(--surface));}
.final-badge{
  display:inline-block; background:var(--gold); color:#3A2900; font-size:0.68rem; font-weight:800;
  padding:2px 10px; border-radius:999px; margin-bottom:4px; letter-spacing:0.03em;
}

/* 3-up lesson map on wide screens, so every lesson shows at once.
   Only the lesson list widens -- flashcards, quiz and results stay narrow. */
@media (min-width:900px){
  .app{max-width:1120px;}
  .app section:not(#screen-home){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home > *:not(.lesson-grid){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home .lesson-grid{grid-template-columns:repeat(3, minmax(0,1fr)); align-items:stretch;}
  #screen-home .lesson-card{flex-direction:column; align-items:stretch; gap:10px; height:100%;}
  #screen-home .lesson-emoji{align-self:flex-start;}
  #screen-home .lesson-info{flex:1;}
  #screen-home .go-btn{width:100%; text-align:center;}
}
  .q-sentence{background:var(--surface2); border:2px solid var(--border); border-radius:14px; padding:14px 16px; font-size:1.2rem; font-weight:700; line-height:1.5; text-align:center; margin:-4px 0 16px; color:var(--ink);}
/* ---- Learn from a wrong answer ---- */
.learn{display:flex; flex-direction:column; gap:8px;}
.learn-row{background:var(--surface); border-radius:12px; padding:9px 12px; border-left:5px solid var(--bad); line-height:1.45;}
.learn-row b{display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);}
.learn-row .learn-choice{font-weight:800;}
.learn-row .learn-why{display:block; margin-top:3px;}
.learn-right{border-left-color:var(--good);}
.learn-tip{border-left-color:var(--gold);}
.learn-row .fb-en{margin-top:4px;}
.missed-item .learn{margin-top:6px; font-size:0.9rem;}
</style>

<div class="app">

  <!-- HOME -->
  <section id="screen-home">
    <div class="hero">
      <svg class="hero-bot" viewBox="0 0 200 240" id="hero-bot-svg"></svg>
      <div>
        <h1>Block Bot</h1>
        <p>Build your robot with base-ten blocks! Questions and answer order shuffle every time, and numbers change every attempt, so you truly learn each skill. Try the Final Mock Exam once you've mastered every lesson!</p>
        <div class="points-total" id="points-total-badge"></div>
      <button type="button" class="coins-badge" data-coins="badge" data-coins-guide hidden></button>
      </div>
    </div>
    <div class="lesson-grid" id="lesson-grid"></div>
  </section>

  <!-- FLASHCARDS -->
  <section id="screen-cards" class="hidden">
    <div class="screen-head">
      <button class="back-btn" onclick="goHome()">&larr; Back</button>
      <h2 id="cards-title"></h2>
    </div>
    <div class="card">
      <div class="card-icon" id="card-icon"></div>
      <div class="card-term" id="card-term"></div>
      <div class="card-def" id="card-def"></div>
    </div>
    <div class="card-nav">
      <button class="nav-btn" id="card-prev" onclick="cardStep(-1)">&larr; Prev</button>
      <div class="dots" id="card-dots"></div>
      <button class="nav-btn" id="card-next" onclick="cardStep(1)">Next &rarr;</button>
    </div>
    <button class="primary-btn" onclick="startQuiz()">Start the Quiz!</button>
  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="hidden">
    <div class="screen-head">
      <button class="back-btn" onclick="goHome()">&larr; Back</button>
      <h2 id="quiz-title"></h2>
      <div class="points-live" id="points-live"></div>
    </div>
    <div class="quiz-top">
      <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
      <svg class="quiz-bot" viewBox="0 0 200 240" id="quiz-bot-svg"></svg>
    </div>
    <div class="q-text" id="q-text"></div>
      <div class="q-sentence" id="q-sentence" style="display:none"></div>
    <div class="q-art hidden" id="q-art"></div>
    <div class="options" id="q-options"></div>
    <div class="explore hidden" id="q-explore"></div>
    <div class="nline-box hidden" id="q-numberline">
      <div class="mode-badge" id="nline-badge"></div>
      <div class="nline-svg" id="nline-svg"></div>
      <div class="nline-input-row">
        <span id="nline-equation"></span>
        <input type="number" inputmode="numeric" id="nline-input" class="nline-input" placeholder="?">
        <button class="check-btn" id="nline-check" onclick="checkNumberline()">Check</button>
      </div>
    </div>
    <div id="q-feedback"></div>
    <button class="primary-btn hidden" id="q-next-btn" onclick="nextQuestion()">Next &rarr;</button>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="hidden">
    <div class="results">
      <svg class="results-bot" viewBox="0 0 200 240" id="results-bot-svg"></svg>
      <h2 id="results-heading"></h2>
      <div class="score-line" id="results-score"></div>
      <div class="points-earned" id="points-earned"></div>
      <div class="coins-have" data-coins="haveNow"></div>
      <div class="results-stars" id="results-stars"></div>
      <div class="missed-review" id="missed-review"></div>
      <div class="results-actions">
        <button class="primary-btn" style="width:auto" onclick="retryLesson()">Try Again</button>
        <button class="secondary-btn" onclick="goHome()">Lesson Map</button>
      </div>
    </div>
  </section>

</div>

<script data-file-check>
(function(){
  var GLOBALS = { 'study-history': 'StudyHistory', wallet: 'Wallet', fx: 'Fx', powerups: 'PowerUps', recall: 'Recall', 'study-kit': 'StudyKit' };
  var missing = [];
  document.querySelectorAll('script[src]').forEach(function(s){
    var file = s.getAttribute('src').replace(/^.*\//, ''), name = GLOBALS[file.replace(/\.js$/, '')];
    if (name && !window[name]) missing.push(file);
  });
  if (!missing.length) return;
  function show(){
    var bar = document.createElement('div');
    bar.id = 'file-check';
    bar.setAttribute('role', 'alert');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;font:600 15px/1.4 system-ui,sans-serif;padding:10px 16px;text-align:center';
    bar.textContent = '⚠️ Missing or broken file: ' + missing.join(', ') + '. Check that the engine folder is complete.';
    document.body.appendChild(bar);
  }
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
})();
</script>
<script>
/* ---- Philippine money art -------------------------------------------------
   Coins are drawn to true relative diameter (5 sentimo 16mm up to 20 piso
   30mm), so size is a real clue the way it is in a coin purse -- on this
   series the bigger the coin, the more it is worth. Bills are drawn larger
   than every coin but not to true scale: a real note is 160mm across, which
   would leave the coins too small to read. */
const COIN_SPECS = {
  '5s' : {mm:16, num:'5',  unit:'SENTIMO', name:'5-centavo coin',  sun:true},
  '25s': {mm:20, num:'25', unit:'SENTIMO', name:'25-centavo coin', sun:true},
  '1p' : {mm:23, num:'1',  unit:'PISO',    name:'1-peso coin'},
  '5p' : {mm:25, num:'5',  unit:'PISO',    name:'5-peso coin', sides:9},
  '10p': {mm:27, num:'10', unit:'PISO',    name:'10-peso coin'},
  '20p': {mm:30, num:'20', unit:'PISO',    name:'20-peso coin', bimetal:true},
};

const BILL_SPECS = {
  '50'  : {num:'50',   ink:'#B14A36', name:'50-peso bill'},
  '100' : {num:'100',  ink:'#7E5FA4', name:'100-peso bill'},
  '200' : {num:'200',  ink:'#2F7F52', name:'200-peso bill'},
  '500' : {num:'500',  ink:'#B8860B', name:'500-peso bill'},
  '1000': {num:'1000', ink:'#2F5F92', name:'1000-peso bill'},
};

function polygonPoints(cx, cy, r, sides){
  const pts = [];
  for(let i=0;i<sides;i++){
    const a = (Math.PI*2*i/sides) - Math.PI/2;
    pts.push((cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function sunMotif(){
  let rays = '';
  for(let i=0;i<8;i++){
    const a = Math.PI*2*i/8;
    const x1 = 50 + 7.5*Math.cos(a), y1 = 27 + 7.5*Math.sin(a);
    const x2 = 50 + 11*Math.cos(a),  y2 = 27 + 11*Math.sin(a);
    rays += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#8B97A3" stroke-width="2" stroke-linecap="round"/>`;
  }
  return `<g opacity="0.75"><circle cx="50" cy="27" r="5.5" fill="#8B97A3"/>${rays}</g>`;
}

function coinSvg(key, pxPerMm){
  const s = COIN_SPECS[key];
  const px = Math.round(s.mm * pxPerMm);
  const silver = '#D6DCE2', rim = '#98A3AE', ink = '#3D4B59';

  const body = s.sides
    ? `<polygon points="${polygonPoints(50,50,47,s.sides)}" fill="${silver}" stroke="${rim}" stroke-width="2.5" stroke-linejoin="round"/>`
    : `<circle cx="50" cy="50" r="47" fill="${s.bimetal ? '#C2865A' : silver}" stroke="${rim}" stroke-width="2.5"/>`;

  const inner = s.bimetal
    ? `<circle cx="50" cy="50" r="33" fill="${silver}" stroke="#A8B2BC" stroke-width="2"/>`
    : `<circle cx="50" cy="50" r="40" fill="none" stroke="#B9C1C9" stroke-width="1.5"/>`;

  const numY    = s.bimetal ? 56 : (s.sun ? 62 : 58);
  const numSize = s.bimetal ? 30 : (s.sun ? 32 : 40);
  const unitY   = s.bimetal ? 70 : 78;

  return `<svg class="coin" viewBox="0 0 100 100" width="${px}" height="${px}" role="img" aria-label="${s.name}">`
    + body + inner
    + (s.sun ? sunMotif() : '')
    + `<text x="50" y="${numY}" text-anchor="middle" font-family="Mulish, sans-serif" font-size="${numSize}" font-weight="800" fill="${ink}">${s.num}</text>`
    + `<text x="50" y="${unitY}" text-anchor="middle" font-family="Mulish, sans-serif" font-size="12" font-weight="700" fill="#5A6875">${s.unit}</text>`
    + `</svg>`;
}

function billSvg(key, w){
  const b = BILL_SPECS[key];
  const h = Math.round(w * 66 / 160);
  const numSize = b.num.length > 3 ? 18 : 24;
  return `<svg class="bill" viewBox="0 0 160 66" width="${w}" height="${h}" role="img" aria-label="${b.name}">`
    + `<rect x="2" y="2" width="156" height="62" rx="6" fill="#FCF8F0" stroke="${b.ink}" stroke-width="2.5"/>`
    + `<rect x="8" y="8" width="144" height="50" rx="4" fill="none" stroke="${b.ink}" stroke-width="1" opacity="0.4"/>`
    + `<ellipse cx="38" cy="36" rx="16" ry="19" fill="${b.ink}" opacity="0.13"/>`

/* A row of money to count. Bills first, then coins biggest to smallest --
   the order the lesson teaches for adding them up. */
function moneyGroup(items, opt){
  const o = opt || {};
  const coinPx = o.coinPx || 3.0, billW = o.billW || 150;
  const html = items.map(k => BILL_SPECS[k] ? billSvg(k, billW) : coinSvg(k, coinPx)).join('');
  return `<div class="money-group">${html}</div>`;
}

function allBills(w){ return `<div class="money-group">` + Object.keys(BILL_SPECS).map(k=>billSvg(k, w||96)).join('') + `</div>`; }
function allCoins(pxPerMm){ return `<div class="money-group">` + Object.keys(COIN_SPECS).map(k=>coinSvg(k, pxPerMm||3.4)).join('') + `</div>`; }

/* Base-ten blocks: a unit is 1 tiny square, a flat is a 10x10 grid of units (1 hundred),
   and the thousand cube is a flat drawn with a pseudo-3D top/side so it reads as stacked flats. */
function unitSvg(px){
  px = px || 16;
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}"><rect x="1" y="1" width="${px-2}" height="${px-2}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1"/></svg>`;
}
function flatSvg(px){
  px = px || 64;
  const cell = px/10;
  let rects = '';
  for (let r=0;r<10;r++){
    for (let c=0;c<10;c++){
      rects += `<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="var(--surface2)" stroke="var(--accent)" stroke-width="0.6"/>`;
    }
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}">${rects}</svg>`;
}
function thousandCubeSvg(px){
  px = px || 84;
  const depth = px*0.22, cell = px/10;
  let rects = '';
  for (let r=0;r<10;r++){
    for (let c=0;c<10;c++){
      rects += `<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="var(--surface2)" stroke="var(--accent)" stroke-width="0.5"/>`;
    }
  }
  const w = px + depth, h = px + depth;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polygon points="${depth},0 ${w},0 ${px},${depth} 0,${depth}" fill="var(--accent)" opacity="0.85"/>
    <polygon points="${w},0 ${w},${px} ${px},${h} ${px},${depth}" fill="var(--accent)" opacity="0.6"/>
    <g transform="translate(0,${depth})">${rects}</g>
  </svg>`;
}
function blockGroup(flats, units){
  let out = '<div class="money-group">';
  for (let i=0;i<flats;i++) out += flatSvg(64);
  if (units > 0){
    out += '<div style="display:grid;grid-template-columns:repeat(3,16px);gap:2px;">';
    for (let j=0;j<units;j++) out += unitSvg(16);
    out += '</div>';
  }
  return out + '</div>';
}

      {q:'Which symbol goes in the blank?\n443 ___ 210', options:['>','<','='], correct:0, explain:'443 has more hundreds (4) than 210 (2), so 443 is greater.', why:['', '&lt; would say 443 is less than 210. But 443 has 4 hundreds and 210 has only 2.', '= means the same number. 443 and 210 are different.'], tip:'Compare the hundreds first: 4 and 2. Then make the open side of the symbol face the bigger number.'},
      {q:'Which symbol goes in the blank?\n443 ___ 470', options:['>','<','='], correct:1, explain:'The hundreds are equal (4=4), but tens: 4 is less than 7, so 443 < 470.', why:['&gt; would say 443 is greater. The hundreds are the same (4), but 443 has 4 tens and 470 has 7 tens, so 443 is smaller.', '', '= means the same number. 443 and 470 are different in the tens and the ones.'], tip:'If the hundreds are the same, move one place to the right and compare the tens.'},

      {q:'True or False: 136 is smaller than 225.', options:['True','False'], correct:0, explain:'136 has 1 hundred, 225 has 2 hundreds, so 136 is smaller.', why:['', 'You said False, but this is true: 136 has 1 hundred and 225 has 2 hundreds, so 136 is smaller.'], tip:'Compare the first digit (the hundreds) first. The number with fewer hundreds is smaller.'},

      {q:'Which symbol goes in the blank?\n56 ___ 75', options:['>','<','='], correct:1, explain:'56 has fewer tens (5) than 75 (7), so 56 is less than 75.', why:['&gt; would say 56 is bigger. But 56 has 5 tens and 75 has 7 tens, so 56 is smaller.', '', '= means the same. 56 and 75 are different numbers.'], tip:'These numbers have no hundreds, so start with the tens: 5 tens and 7 tens.'},
      {q:'True or False: When comparing numbers, we look at the ones digit first.', options:['True','False'], correct:1, explain:'We always compare the biggest place value first — hundreds, then tens, then ones.', why:['You said True, but we start with the biggest place: hundreds first, then tens, then ones.', ''], tip:'Compare from the LEFT, where the biggest place is. Only look at the ones if everything before them is the same.'},
      {q:'Which symbol goes in the blank?\n308 ___ 380', options:['>','<','='], correct:1, explain:'Comparing tens: 0 is less than 8, so 308 < 380.', why:['&gt; would say 308 is bigger. The hundreds are the same, but 308 has 0 tens and 380 has 8 tens.', '', 'They look alike, but they are not the same. The 0 and the 8 are in different places.'], tip:'When two numbers use the same digits, compare place by place. Here the tens decide: 0 tens and 8 tens.'},

      {q:'Which symbol means "equal to"?', options:['>','<','='], correct:2, explain:'The = symbol means both numbers have the same value.', why:['&gt; means greater than. It shows the first number is bigger.', '&lt; means less than. It shows the first number is smaller.', ''], tip:'The = sign has no open side and no point. It does not lean toward either number, because they are the same.'},

      {q:'Order the numbers from smallest to greatest.\n512, 125, 251', options:['125, 251, 512','512, 251, 125','251, 125, 512','125, 512, 251'], correct:0, explain:'Comparing hundreds: 125 (1) is smallest, then 251 (2), then 512 (5).', why:['', 'This is greatest to smallest. We need smallest first.', '251 is not the smallest. 125 has only 1 hundred, so it comes first.', '125 first is right! But 512 has 5 hundreds and 251 has 2 hundreds, so 251 comes next.'], tip:'These numbers all have different hundreds, so just look at the first digit: 1, 2, 5.'},

      {q:'Who finished first?\nIn a race, Jay finished 1st and Lim finished 2nd.', options:['Jay','Lim','Both of them','None of them'], correct:0, explain:'1st place means Jay finished first.', why:['', 'Lim finished 2nd, which means second, after Jay.', 'Only one person can be 1st. Jay was 1st and Lim was 2nd.', 'Someone did finish first: Jay was 1st.'], tip:'Find 1st in the sentence. The name next to 1st is the one who finished first.'},

    quiz:[
      {q:'In 2369, which digit is in the ones place?', options:['9','6','3','2'], correct:0, explain:'Counting from the right: 9 ones, 6 tens, 3 hundreds, 2 thousands. The ones place holds the 9.', why:['', '6 is in the tens place, the second digit from the right.', '3 is in the hundreds place, the third digit from the right.', '2 is in the thousands place, at the far left.'], tip:'Always start counting places from the RIGHT. The very last digit is the ones.'},
      {q:'In 8104, which digit is in the tens place?', options:['0','1','4','8'], correct:0, explain:'8104 is 8 thousands, 1 hundred, 0 tens and 4 ones, so the tens place holds a 0.', why:['', '1 is in the hundreds place, the third digit from the right.', '4 is in the ones place, the last digit.', '8 is in the thousands place, at the far left.'], tip:'Count from the right: ones (4), then tens (0). A 0 can hold a place too.'},
      {q:'In 569, which digit is in the thousands place?', options:['0','5','6','9'], correct:0, explain:'569 has no thousands at all, so the thousands place holds a 0.', why:['', '5 is in the hundreds place. 569 has only 3 digits, so there are no thousands.', '6 is in the tens place, not the thousands.', '9 is in the ones place, the last digit.'], tip:'Count the digits. A 3-digit number has no thousands, so its thousands digit is 0.'},
      {q:'Write 974 in expanded form.', options:['900 + 70 + 4','90 + 70 + 4','900 + 7 + 40','9 + 7 + 4'], correct:0, explain:'9 hundreds = 900, 7 tens = 70, 4 ones = 4. So 974 = 900 + 70 + 4.', why:['', '90 is only 9 tens. The 9 is in the hundreds place, so it is worth 900.', 'This mixes up the 7 and the 4. The 7 is in the tens place (70) and the 4 is in the ones place (4).', 'This writes only the digits. In expanded form we write what each digit is worth: 900, 70, 4.'], tip:'Check by adding the parts back: 900 + 70 + 4 = 974. If you get the same number, it is right.'},
      {q:'Write 4329 in expanded form.', options:['4000 + 300 + 20 + 9','400 + 30 + 20 + 9','4000 + 30 + 200 + 9','4 + 3 + 2 + 9'], correct:0, explain:'4 thousands + 3 hundreds + 2 tens + 9 ones = 4000 + 300 + 20 + 9.', why:['', 'This adds up to only 459. The 4 is in the thousands place (4000) and the 3 is in the hundreds place (300).', 'This mixes up the 3 and the 2. The 3 is in the hundreds place (300) and the 2 is in the tens place (20).', 'This writes only the digits. We need their values: 4000, 300, 20, 9.'], tip:'The number of zeros matches the place: thousands get 3 zeros, hundreds 2, tens 1, and ones none.'},
      {q:'Write 7548 in expanded form.', options:['7000 + 500 + 40 + 8','7000 + 50 + 400 + 8','700 + 500 + 40 + 8','7000 + 500 + 4 + 80'], correct:0, explain:'7 thousands + 5 hundreds + 4 tens + 8 ones = 7000 + 500 + 40 + 8.', why:['', 'This mixes up the 5 and the 4. The 5 is in the hundreds place (500) and the 4 is in the tens place (40).', '700 is only 7 hundreds. The 7 is in the thousands place, so it is 7000.', 'This mixes up the 4 and the 8. The 4 is in the tens place (40) and the 8 is in the ones place (8).'], tip:'Write the parts from the highest place to the lowest. Each part should have one less zero than the part before it.'},
      {q:'Write 8946 in expanded form.', options:['8000 + 900 + 40 + 6','8000 + 90 + 40 + 6','800 + 900 + 4 + 6','8000 + 900 + 4 + 60'], correct:0, explain:'8 thousands + 9 hundreds + 4 tens + 6 ones = 8000 + 900 + 40 + 6.', why:['', '90 is only 9 tens. The 9 is in the hundreds place, so it is 900.', '800 should be 8000, and 4 should be 40. Both parts have too few zeros.', 'This mixes up the 4 and the 6. The 4 is in the tens place (40) and the 6 is in the ones place (6).'], tip:'Count the zeros in each part: 8000 has 3 zeros, 900 has 2, 40 has 1, and 6 has none.'},
      {q:'Write 5892 in expanded form.', options:['5000 + 800 + 90 + 2','500 + 800 + 90 + 2','5000 + 80 + 900 + 2','5000 + 800 + 9 + 20'], correct:0, explain:'5 thousands + 8 hundreds + 9 tens + 2 ones = 5000 + 800 + 90 + 2.', why:['', '500 is only 5 hundreds. The 5 is in the thousands place, so it is 5000.', 'This mixes up the 8 and the 9. The 8 is in the hundreds place (800) and the 9 is in the tens place (90).', 'This mixes up the 9 and the 2. The 9 is in the tens place (90) and the 2 is in the ones place (2).'], tip:'Go digit by digit from the left: 5 becomes 5000, 8 becomes 800, 9 becomes 90, 2 stays 2.'},
      {q:'Write 700 + 50 + 4 in standard form.', options:['754','745','7504','574'], correct:0, explain:'700 + 50 + 4 = 754.', why:['', '745 has 4 tens and 5 ones. We have 50 (5 tens) and 4 ones.', '7504 looks like 750 and then 4 written next to it. We only have hundreds, tens and ones, so the answer has 3 digits.', '574 has 5 hundreds. 700 means 7 hundreds, so the 7 goes first.'], tip:'The biggest part gives the first digit: 700 gives 7, 50 gives 5, 4 gives 4.'},
      {q:'Write 1000 + 500 + 30 + 9 in standard form.', options:['1539','1593','1359','15309'], correct:0, explain:'1000 + 500 + 30 + 9 = 1539.', why:['', '1593 has 9 tens and 3 ones. We have 30 (3 tens) and 9 ones.', '1359 has 3 hundreds and 5 tens. We have 500 (5 hundreds) and 30 (3 tens).', '15309 has 5 digits. It looks like 1, 5, 30 and 9 were written side by side. We only have thousands, hundreds, tens and ones, so it has 4 digits.'], tip:'Count the places: thousands, hundreds, tens and ones means 4 digits. Your answer should have 4 digits too.'},
      {q:'Write 8000 + 600 + 3 in standard form.', options:['8603','8630','863','8063'], correct:0, explain:'There are 0 tens, so a 0 goes in the tens place: 8603.', why:['', '8630 has 3 tens and 0 ones. We have 3 ones and 0 tens.', '863 forgot the 0. Without it, the 8 is only 8 hundreds, not 8 thousands.', '8063 has 0 hundreds and 6 tens. We have 600, which is 6 hundreds.'], tip:'Draw 4 boxes: thousands, hundreds, tens, ones. Fill in 8, 6 and 3, and put a 0 in the empty tens box.'},
      {q:'Write 6000 + 50 + 9 in standard form.', options:['6059','6590','6509','659'], correct:0, explain:'There are 0 hundreds, so a 0 goes in the hundreds place: 6059.', why:['', '6590 has 5 hundreds and 9 tens. We have 50 (5 tens) and 9 ones.', '6509 has 5 hundreds. 50 is 5 tens, so the 5 goes in the tens place.', '659 forgot the 0. Without it, the 6 is only 6 hundreds, not 6 thousands.'], tip:'Look for the missing place. There is no hundreds part, so a 0 goes in the hundreds box.'},
      {q:'Write 4000 + 800 + 70 + 1 in standard form.', options:['4871','4817','4781','48701'], correct:0, explain:'4000 + 800 + 70 + 1 = 4871.', why:['', '4817 has 1 ten and 7 ones. We have 70 (7 tens) and 1 one.', '4781 has 7 hundreds and 8 tens. We have 800 (8 hundreds) and 70 (7 tens).', '48701 has 5 digits. It looks like 4, 8, 70 and 1 were written side by side. We need just one digit for each place.'], tip:'Take one digit from each part, from biggest to smallest: 4, 8, 7, 1.'},
      {q:'Which form is this number written in?\nfive thousand four hundred thirty-seven', options:['Word form','Standard form','Expanded form','Place value form'], correct:0, explain:'A number written using words is in word form. Its standard form is 5,437.', why:['', 'Standard form uses digits, like 5,437. This number is written in words.', 'Expanded form uses plus signs, like 5000 + 400 + 30 + 7. This number is written in words.', 'Place value form is not one of the forms in this lesson. The three forms are standard, word and expanded.'], tip:'Look at how it is written: digits means standard form, words means word form, plus signs mean expanded form.'},
      {q:'True or False: In expanded form we write the value of each digit, not just the digit itself.', options:['True','False'], correct:0, explain:'Correct. In 2184 the 8 is worth 80, so we write 80 and not 8.', why:['', 'You said False, but this is true: in 2184 we write 80 for the 8, because it is in the tens place.'], tip:'In expanded form, each part has zeros for its place, like 2000 + 100 + 80 + 4.'},
    ]
  },
  {
    id:'addnoregroup', emoji:'➕', title:'Addition Without Regrouping', subtitle:'Ones, Tens, Hundreds, and Thousands',
    flashcards:[
      {icon:'➕', term:'What Does It Mean?', def:'Addition without regrouping means the sum in each column is less than 10, so there is nothing to carry over.'},
      {icon:'📐', term:'Line Up the Digits', def:'Write the numbers one on top of the other so ones are under ones, tens under tens, and hundreds under hundreds.'},
      {icon:'1️⃣', term:'Step 1: Add the Ones', def:'Always start at the right side, in the ones column.'},
      {icon:'2️⃣', term:'Step 2: Add the Tens', def:'Move one column to the left and add the tens.'},
      {icon:'3️⃣', term:'Step 3: Add the Hundreds', def:'Then add the hundreds, and the thousands if the numbers have them.'},
      {icon:'🔍', term:'Example: 426 + 142', def:'Ones: 6 + 2 = 8. Tens: 2 + 4 = 6. Hundreds: 4 + 1 = 5. The sum is 568.'},
      {icon:'🔍', term:'Example: 351 + 138', def:'Ones: 1 + 8 = 9. Tens: 5 + 3 = 8. Hundreds: 3 + 1 = 4. The sum is 489.'},
      {icon:'🧠', term:'Addend and Sum', def:'The numbers you add together are called addends. The answer is called the sum.'},
    ],
    quiz:[
      {q:'426 + 142 = ?', options:['568','558','468','578'], correct:0, explain:'Ones: 6 + 2 = 8. Tens: 2 + 4 = 6. Hundreds: 4 + 1 = 5. The sum is 568.', why:['', '558 has 5 tens. Check the tens: 2 + 4 = 6.', '468 has 4 hundreds. Check the hundreds: 4 + 1 = 5.', '578 has 7 tens. Check the tens: 2 + 4 = 6, not 7.'], tip:'Add one column at a time, starting with the ones. Write each answer under its own column.'},
      {q:'567 + 112 = ?', options:['679','669','779','689'], correct:0, explain:'Ones: 7 + 2 = 9. Tens: 6 + 1 = 7. Hundreds: 5 + 1 = 6. The sum is 679.', why:['', '669 has 6 tens. Check the tens: 6 + 1 = 7.', '779 has 7 hundreds. Check the hundreds: 5 + 1 = 6.', '689 has 8 tens. Check the tens: 6 + 1 = 7.'], tip:'When you finish, check each column again: ones 7 + 2, tens 6 + 1, hundreds 5 + 1.'},
      {q:'351 + 138 = ?', options:['489','479','498','589'], correct:0, explain:'Ones: 1 + 8 = 9. Tens: 5 + 3 = 8. Hundreds: 3 + 1 = 4. The sum is 489.', why:['', '479 has 7 tens. Check the tens: 5 + 3 = 8.', '498 swaps the tens and the ones. Ones: 1 + 8 = 9 goes last. Tens: 5 + 3 = 8 goes in the middle.', '589 has 5 hundreds. Check the hundreds: 3 + 1 = 4.'], tip:'Write the ones answer first, on the right. Then write the tens to its left, so the digits do not swap.'},
      {q:'234 + 145 = ?', options:['379','369','389','479'], correct:0, explain:'Ones: 4 + 5 = 9. Tens: 3 + 4 = 7. Hundreds: 2 + 1 = 3. The sum is 379.', why:['', '369 has 6 tens. Check the tens: 3 + 4 = 7.', '389 has 8 tens. Check the tens: 3 + 4 = 7.', '479 has 4 hundreds. Check the hundreds: 2 + 1 = 3.'], tip:'Say each column out loud as you add: ones 4 + 5 = 9, tens 3 + 4 = 7, hundreds 2 + 1 = 3.'},
      {q:'512 + 236 = ?', options:['748','758','648','738'], correct:0, explain:'Ones: 2 + 6 = 8. Tens: 1 + 3 = 4. Hundreds: 5 + 2 = 7. The sum is 748.', why:['', '758 has 5 tens. Check the tens: 1 + 3 = 4.', '648 has 6 hundreds. Check the hundreds: 5 + 2 = 7.', '738 has 3 tens. Check the tens: 1 + 3 = 4.'], tip:'Line up the numbers so ones are under ones. Then add straight down each column.'},
      {q:'Which column do we add first?', options:['The ones','The tens','The hundreds','Any column you like'], correct:0, explain:'We always start at the right side with the ones column.', why:['', 'The tens come second. We start at the right, with the ones.', 'The hundreds are on the left. We start at the right side, with the ones.', 'We always follow the same steps: ones first, then tens, then hundreds.'], tip:'Remember: start on the RIGHT. The ones column is always the column on the far right.'},
      {q:'True or False: In addition without regrouping, the sum in each column is less than 10.', options:['True','False'], correct:0, explain:'Correct. Because no column reaches 10, there is nothing to carry over.', why:['', 'You said False, but this is true: without regrouping, every column adds up to 9 or less, so there is nothing to carry.'], tip:'Check each column. If none of them reaches 10, there is no regrouping.'},
      {q:'1023 + 2431 = ?', options:['3454','3444','3554','2454'], correct:0, explain:'Ones: 3 + 1 = 4. Tens: 2 + 3 = 5. Hundreds: 0 + 4 = 4. Thousands: 1 + 2 = 3. The sum is 3454.', why:['', '3444 has 4 tens. Check the tens: 2 + 3 = 5.', '3554 has 5 hundreds. Check the hundreds: 0 + 4 = 4.', '2454 has 2 thousands. Do not forget to add the thousands: 1 + 2 = 3.'], tip:'4-digit numbers have 4 columns. Add all four: ones, tens, hundreds, thousands.'},
      {q:'640 + 125 = ?', options:['765','755','665','775'], correct:0, explain:'Ones: 0 + 5 = 5. Tens: 4 + 2 = 6. Hundreds: 6 + 1 = 7. The sum is 765.', why:['', '755 has 5 tens. Check the tens: 4 + 2 = 6.', '665 has 6 hundreds. Check the hundreds: 6 + 1 = 7.', '775 has 7 tens. Check the tens: 4 + 2 = 6.'], tip:'A 0 in a column is easy: 0 + 5 = 5. Then keep going with the tens and the hundreds.'},
      {q:'What do we call the answer in an addition problem?', options:['The sum','The addend','The difference','The number line'], correct:0, explain:'The numbers being added are the addends, and the answer is the sum.', why:['', 'Addends are the numbers we add together, not the answer.', 'Difference is not the word for the answer when we add. The answer to an addition problem is the sum.', 'A number line is a tool to help us add. It is not the answer.'], tip:'Addends go in, and the sum comes out. The sum is the number after the = sign.'},
      {q:'703 + 261 = ?', options:['964','954','864','974'], correct:0, explain:'Ones: 3 + 1 = 4. Tens: 0 + 6 = 6. Hundreds: 7 + 2 = 9. The sum is 964.', why:['', '954 has 5 tens. Check the tens: 0 + 6 = 6.', '864 has 8 hundreds. Check the hundreds: 7 + 2 = 9.', '974 has 7 tens. Check the tens: 0 + 6 = 6.'], tip:'When a column has a 0, adding 0 changes nothing: 0 + 6 = 6.'},
      {q:'True or False: We start adding from the left side, in the hundreds column.', options:['True','False'], correct:1, explain:'We start from the right side, in the ones column.', why:['You said True, but we start on the right side, in the ones column, then move to the left.', ''], tip:'Think ones, tens, hundreds, going from right to left.'},
    ]
  },
  {
    id:'addregroup', emoji:'🔁', title:'Addition With Regrouping', subtitle:'Carrying Over to the Next Place',
    flashcards:[
      {icon:'🔁', term:'What Is Regrouping?', def:'Regrouping means adding numbers when the sum in one place value is 10 or more. The extra is carried over to the next place.'},
      {icon:'🔟', term:'Regroup 12 Ones', def:'12 ones = 1 ten and 2 ones. Write the 2 in the ones place and carry the 1 over to the tens.'},
      {icon:'⬆️', term:'Where Does the Carry Go?', def:'The carried 1 goes on top of the next column to the left, and you add it together with that column.'},
      {icon:'🔍', term:'Example: 426 + 146', def:'Ones: 6 + 6 = 12, so write 2 and carry 1. Tens: 1 + 2 + 4 = 7. Hundreds: 4 + 1 = 5. The sum is 572.'},
      {icon:'🔍', term:'Example: 274 + 365', def:'Ones: 4 + 5 = 9. Tens: 7 + 6 = 13, so write 3 and carry 1. Hundreds: 1 + 2 + 3 = 6. The sum is 639.'},
      {icon:'🔍', term:'Example: 186 + 447', def:'Ones: 6 + 7 = 13, write 3 and carry 1. Tens: 1 + 8 + 4 = 13, write 3 and carry 1. Hundreds: 1 + 1 + 4 = 6. The sum is 633.'},
      {icon:'🤔', term:'When Do I Regroup?', def:'Only when a column adds up to 10 or more. If the column is 9 or less, just write the answer down.'},
    ],
    quiz:[
      {q:'426 + 146 = ?', options:['572','562','672','582'], correct:0, explain:'Ones: 6 + 6 = 12, write 2 and carry 1. Tens: 1 + 2 + 4 = 7. Hundreds: 4 + 1 = 5. The sum is 572.', why:['', '562 forgot the carried 1. Tens: 1 + 2 + 4 = 7, not 6.', '672 has 6 hundreds. Hundreds: 4 + 1 = 5. The carry went to the tens, not the hundreds.', '582 has 8 tens. Tens: 1 + 2 + 4 = 7.'], tip:'When a column makes 10 or more, write a small 1 on top of the next column so you do not forget it.'},
      {q:'274 + 365 = ?', options:['639','629','539','649'], correct:0, explain:'Ones: 4 + 5 = 9. Tens: 7 + 6 = 13, write 3 and carry 1. Hundreds: 1 + 2 + 3 = 6. The sum is 639.', why:['', '629 has 2 tens. Tens: 7 + 6 = 13, so write 3, not 2.', '539 forgot the carried 1. Hundreds: 1 + 2 + 3 = 6.', '649 has 4 tens. Tens: 7 + 6 = 13, so write 3 and carry 1.'], tip:'The carry can happen in the tens column too. Check every column to see if it made 10 or more.'},
      {q:'186 + 447 = ?', options:['633','623','533','643'], correct:0, explain:'Ones: 6 + 7 = 13, carry 1. Tens: 1 + 8 + 4 = 13, carry 1. Hundreds: 1 + 1 + 4 = 6. The sum is 633.', why:['', '623 forgot the carry into the tens. Tens: 1 + 8 + 4 = 13, so write 3.', '533 forgot the carry into the hundreds. Hundreds: 1 + 1 + 4 = 6.', '643 has 4 tens. Tens: 1 + 8 + 4 = 13, so write 3 and carry 1.'], tip:'Sometimes you carry twice. After each column, ask: did I get 10 or more? If yes, carry 1.'},
      {q:'420 + 612 = ?', options:['1032','932','1022','1132'], correct:0, explain:'Ones: 0 + 2 = 2. Tens: 2 + 1 = 3. Hundreds: 4 + 6 = 10, so write 0 and carry 1 to the thousands. The sum is 1032.', why:['', '932 is too small. Hundreds: 4 + 6 = 10, so write 0 and carry 1 to the thousands.', '1022 has 2 tens. Tens: 2 + 1 = 3.', '1132 has 1 hundred. Hundreds: 4 + 6 = 10, so the hundreds digit is 0, not 1.'], tip:'If the hundreds make 10 or more, the carried 1 becomes a new thousands digit in front.'},
      {q:'916 + 852 = ?', options:['1768','1668','768','1778'], correct:0, explain:'Ones: 6 + 2 = 8. Tens: 1 + 5 = 6. Hundreds: 9 + 8 = 17, so write 7 and carry 1. The sum is 1768.', why:['', '1668 has 6 hundreds. Hundreds: 9 + 8 = 17, so write 7.', '768 dropped the carried 1. Hundreds: 9 + 8 = 17, so write 7 and carry 1 to the thousands.', '1778 has 7 tens. Tens: 1 + 5 = 6. There is no carry into the tens here.'], tip:'When the last column makes 10 or more, write the 1 in front as the thousands digit. Do not drop it.'},
      {q:'When you add the ones and get 12, how do you regroup it?', options:['1 ten and 2 ones','2 tens and 1 one','1 hundred and 2 ones','12 tens'], correct:0, explain:'12 ones is the same as 1 ten and 2 ones, so the 1 ten is carried to the tens column.', why:['', '2 tens and 1 one is 21. That swaps the digits of 12.', '1 hundred and 2 ones is 102, much too big. 12 ones make 1 ten and 2 ones.', '12 tens is 120. We have 12 ones, which is 1 ten and 2 ones.'], tip:'In 12, the first digit is the ten you carry. The last digit is the ones you write down.'},
      {q:'True or False: We regroup only when a column adds up to 10 or more.', options:['True','False'], correct:0, explain:'Correct. If a column is 9 or less, there is nothing to carry over.', why:['', 'You said False, but this is true: if a column is 9 or less, just write it down. Only 10 or more is carried.'], tip:'Ask for each column: is it 10 or more? Yes means carry. No means just write it.'},
      {q:'158 + 127 = ?', options:['285','275','385','295'], correct:0, explain:'Ones: 8 + 7 = 15, write 5 and carry 1. Tens: 1 + 5 + 2 = 8. Hundreds: 1 + 1 = 2. The sum is 285.', why:['', '275 forgot the carried 1. Tens: 1 + 5 + 2 = 8, not 7.', '385 has 3 hundreds. Hundreds: 1 + 1 = 2. The carry went to the tens, not the hundreds.', '295 has 9 tens. Tens: 1 + 5 + 2 = 8.'], tip:'8 + 7 = 15, so write 5 and carry 1. Always add the carried 1 into the next column.'},
      {q:'367 + 225 = ?', options:['592','582','492','602'], correct:0, explain:'Ones: 7 + 5 = 12, write 2 and carry 1. Tens: 1 + 6 + 2 = 9. Hundreds: 3 + 2 = 5. The sum is 592.', why:['', '582 forgot the carried 1. Tens: 1 + 6 + 2 = 9, not 8.', '492 has 4 hundreds. Hundreds: 3 + 2 = 5.', '602 is too big. Tens: 1 + 6 + 2 = 9, which is less than 10, so there is no second carry.'], tip:'After you carry, check the next column: 1 + 6 + 2 = 9. 9 is less than 10, so there is no more carrying.'},
      {q:'When the tens column adds up to 13, how do you regroup it?', options:['1 hundred and 3 tens','1 ten and 3 ones','3 hundreds and 1 ten','13 hundreds'], correct:0, explain:'13 tens is the same as 1 hundred and 3 tens, so the 1 hundred is carried to the hundreds column.', why:['', '1 ten and 3 ones is 13 ONES. Here we have 13 TENS, which is 130.', '3 hundreds and 1 ten is 310. That swaps the digits. 13 tens is 1 hundred and 3 tens.', '13 hundreds is 1300, much too big. 13 tens is 130: 1 hundred and 3 tens.'], tip:'10 tens make 1 hundred. So 13 tens = 10 tens + 3 tens = 1 hundred and 3 tens.'},
      {q:'489 + 156 = ?', options:['645','635','545','655'], correct:0, explain:'Ones: 9 + 6 = 15, carry 1. Tens: 1 + 8 + 5 = 14, carry 1. Hundreds: 1 + 4 + 1 = 6. The sum is 645.', why:['', '635 has 3 tens. Tens: 1 + 8 + 5 = 14, so write 4.', '545 forgot the carry into the hundreds. Hundreds: 1 + 4 + 1 = 6.', '655 has 5 tens. Tens: 1 + 8 + 5 = 14, so write 4, not 5.'], tip:'Count your carries. The ones made 15 and the tens made 14, so you carry two times.'},
      {q:'True or False: 503 + 306 needs regrouping.', options:['True','False'], correct:1, explain:'No column reaches 10: 3 + 6 = 9, 0 + 0 = 0, 5 + 3 = 8. The sum is 809 with no carrying.', why:['You said True, but no column reaches 10: ones 3 + 6 = 9, tens 0 + 0 = 0, hundreds 5 + 3 = 8.', ''], tip:'Before you carry, add each column and see if any sum is 10 or more.'},
    ]
  },
  {
    id:'money', emoji:'💰', title:'Pesos and Centavos', subtitle:'Philippine Bills, Coins, and Amounts',
    flashcards:[
      {icon:'💵', art:allBills(92), term:'Philippine Bills', def:'The bills are the 50, 100, 200, 500, and 1000-peso bills. Each one has its own colour, so you can tell them apart across the room.'},
      {icon:'🪙', art:allCoins(3.4), term:'Philippine Coins', def:'The coins are 5 sentimo, 25 sentimo, 1 piso, 5 piso, 10 piso, and 20 piso. On this set the bigger the coin, the more it is worth.'},
      {icon:'☀️', art:coinSvg('5s',4.6)+coinSvg('25s',4.6), term:'The Sentimo Coins', def:'The two smallest coins are the centavo coins. They are marked SENTIMO, the Filipino word for centavo, and they show a small sun instead of a face.'},
      {icon:'🔩', art:coinSvg('5p',4.6), term:'The 5-Piso Coin', def:'The 5-piso coin is not round. Count the sides and you will find nine, so you can pick it out even without looking.'},
      {icon:'🟠', art:coinSvg('20p',4.6), term:'The 20-Piso Coin', def:'The 20 piso is the biggest coin, and the only one with a copper-coloured ring around a silver middle.'},
      {icon:'💯', art:moneyGroup(['25s','25s','25s','25s'],{coinPx:4.0}), term:'100 Centavos Make 1 Peso', def:'Four 25-centavo coins make 100 centavos, and 100 centavos are worth exactly 1 peso.'},
      {icon:'🧮', art:moneyGroup(['50','20p','1p','5s','5s','5s']), term:'Counting Money', def:'Count the pesos first: 50 + 20 + 1 = 71 pesos. Then count the centavos: 5 + 5 + 5 = 15 centavos. Put them together as 71.15.'},
      {icon:'⚫', term:'The Dot Separates Them', def:'The dot separates the pesos from the centavos. In 230.35, the 230 is pesos and the 35 is centavos.'},
      {icon:'🗣️', term:'Reading Money', def:'71.15 is read as seventy-one pesos and fifteen centavos.'},
    ],
    quiz:[
      {q:'How much money is this?', art:moneyGroup(['50','20p','1p','5s','5s','5s']), options:['71.15','70.15','71.05','7.115'], correct:0, explain:'Pesos: 50 + 20 + 1 = 71. Centavos: 5 + 5 + 5 = 15. Together it is 71.15.', why:['', '70.15 forgot the 1-piso coin. Pesos: 50 + 20 + 1 = 71.', '71.05 counts only one 5-centavo coin. There are three: 5 + 5 + 5 = 15 centavos.', '7.115 puts the dot in the wrong place. The pesos are 71, then the dot, then 15 centavos.'], tip:'Count the pesos first (the bill and the piso coins), then the sentimo coins. Put the dot between them.'},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Recall decides whether this question pays, shows a typing box, and offers power-ups.
function offerQuestion(pu){
  if (window.Recall) Recall.ask(pu, SH_APP, typeof TYPE_IT === 'undefined' ? null : TYPE_IT);
  else if (window.PowerUps) PowerUps.offer(pu);
}
function prepareQuestion(q){
  const order = shuffle(q.options.map((_,i)=>i));
  const options = order.map(i=>q.options[i]);
  const correct = order.indexOf(q.correct);
  const why = q.why ? order.map(i=>q.why[i]) : [];
  return {q:q.q, options, correct, explain:q.explain, art:q.art, why, tip:q.tip};
}
function buildQuizSet(lesson){
  if(lesson.generate) return lesson.generate(8);
  return shuffle(lesson.quiz).map(prepareQuestion);
}
function historyQuestion(q){
  const names = [...String(q.art || '').matchAll(/aria-label="([^"]*)"/g)].map(m => m[1]);
  return names.length ? `${q.q} [${names.join(', ')}]` : q.q;
}

function learnHtml(m){
  return `<div class="learn">
    <div class="learn-row learn-picked"><b>You picked</b><span class="learn-choice">${m.picked}</span>${m.why ? `<span class="learn-why">Why that's not right: ${m.why}</span>` : ''}</div>
    <div class="learn-row learn-right"><b>The right answer</b><span class="learn-choice">${m.answer}</span><span class="learn-why">${m.explain}</span></div>
    ${m.tip ? `<div class="learn-row learn-tip"><b>💡 Tip for next time</b>${m.tip}</div>` : ''}
  </div>`;
}

function numberlineWhy(start, jumps, val){
  const right = start + jumps;
  if(isNaN(val)) return 'The box was left empty. Always write a number — count the jumps one by one.';
  if(val === right - 1) return `${val} is one short. You probably counted the starting number ${start} as your first jump. The first jump lands on ${start+1}, not on ${start}.`;
  if(val < right) return `${val} is too small — you stopped ${right-val} jump${right-val>1?'s':''} too early. You need ${jumps} jumps, not ${jumps-(right-val)}.`;
  if(val === start + jumps + 1) return `${val} is one too many. You took an extra jump — you need exactly ${jumps} jumps.`;
  return `${val} is too big — that is ${val-right} more than the answer. Adding ${jumps} to ${start} can only move you ${jumps} steps.`;
}

const NUMBERLINE_TIP = 'Put your finger on the start number. Do NOT count it. Say "1" as you hop to the next number, then "2", and keep going until you have said the number of jumps. Where your finger stops is the answer.';

function numberlineExplain(start, jumps){
  const seq = [];
  for(let k=1;k<=jumps;k++) seq.push(start+k);
  return `Start at ${start} and take ${jumps} jumps of +1: ${seq.join(', ')}. You land on ${start+jumps}, so ${start} + ${jumps} = ${start+jumps}.`;
}
function genNumberlineSet(n){
  const qs = [];
  for(let i=0;i<n;i++){
    const jumps = 3 + Math.floor(Math.random()*7);
    const start = Math.floor(Math.random()*(100-jumps+1));
    const mode = i < n/2 ? 'labeled' : 'blank';
    qs.push({type:'numberline', start, jumps, mode, explain:numberlineExplain(start,jumps)});
  }
  return qs;
}

/* ---- Number Line ---- */
function numberLineSVG(start, jumps, mode, revealed){
  const n = jumps;
  const W = 640, padX = 36, baseY = revealed ? 92 : 60, H = revealed ? 132 : 92;
  const x = i => padX + i * (W - 2*padX) / n;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  if(revealed){
    for(let i=0;i<n;i++){
      const x1=x(i), x2=x(i+1), midX=(x1+x2)/2, peakY=baseY-34;
      svg += `<path d="M${x1},${baseY} Q${midX},${peakY} ${x2},${baseY}" fill="none" stroke="var(--coral)" stroke-width="2.5"/>`;
      svg += `<text x="${midX}" y="${peakY-6}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--coral)">+1</text>`;
    }
  }
  svg += `<line x1="${x(0)}" y1="${baseY}" x2="${x(n)}" y2="${baseY}" stroke="var(--ink-soft)" stroke-width="2"/>`;
  for(let i=0;i<=n;i++){
    const isLast = i === n;
    const showLabel = revealed || i===0 || (mode==='labeled' && !isLast);
    svg += `<line x1="${x(i)}" y1="${baseY-6}" x2="${x(i)}" y2="${baseY+6}" stroke="var(--ink-soft)" stroke-width="2"/>`;
    if(showLabel){
      svg += `<text x="${x(i)}" y="${baseY+22}" text-anchor="middle" font-size="12" font-weight="700" fill="${isLast?'var(--accent)':'var(--ink)'}">${start+i}</text>`;
    } else if(isLast){
      svg += `<text x="${x(i)}" y="${baseY+22}" text-anchor="middle" font-size="16" font-weight="800" fill="var(--accent)">?</text>`;
    }
  }
  svg += `</svg>`;
  return svg;
}

function renderNumberlineQuestion(q){
  const badge = document.getElementById('nline-badge');
  badge.textContent = q.mode==='labeled' ? '🔍 Guided: watch the numbers grow as you count on' : '🧠 Challenge: figure out the next numbers in your head!';
  badge.className = 'mode-badge ' + (q.mode==='labeled' ? 'guided' : 'challenge');
  document.getElementById('nline-svg').innerHTML = numberLineSVG(q.start, q.jumps, q.mode, false);
  document.getElementById('nline-equation').textContent = `${q.start} + ${q.jumps} =`;
  const input = document.getElementById('nline-input');
  input.value = '';
  input.disabled = false;
  input.className = 'nline-input';
  input.onkeydown = (e)=>{ if(e.key==='Enter') checkNumberline(); };
  document.getElementById('nline-check').disabled = false;
  setTimeout(()=>input.focus(), 50);
}

function checkNumberline(){
  if(answered) return;
  const q = currentQuizSet[quizIdx];
  const total = currentQuizSet.length;
  const input = document.getElementById('nline-input');
  const val = parseInt(input.value, 10);
  const correctAns = q.start + q.jumps;
  answered = true;
  const correct = val === correctAns;
  const nlMiss = correct ? null : { q: `${q.start} + ${q.jumps} = ?`, picked: isNaN(val) ? '(blank)' : String(val), why: numberlineWhy(q.start, q.jumps, val), answer: String(correctAns), explain: q.explain, tip: NUMBERLINE_TIP };
  SH && SH.quizAnswered(historyQuizId, correct, `${q.start} + ${q.jumps} = ?`, isNaN(val) ? '(blank)' : String(val), String(correctAns), window.Recall ? Recall.typed() : false);
  const helped = !!(window.PowerUps && PowerUps.answered());
  if(correct){
    quizScore++;
  } else {
    missedQuestions.push(nlMiss);
  }
  kit.answer(correct, { helped: helped, exam: currentQuizMeta.id === 'final' });
  input.disabled = true;
  input.classList.add(correct ? 'correct' : 'incorrect');
  document.getElementById('nline-check').disabled = true;
  document.getElementById('nline-svg').innerHTML = numberLineSVG(q.start, q.jumps, q.mode, true);
  renderBot(document.getElementById('quiz-bot-svg'), Math.round((quizScore/total)*8));
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = correct
    ? `<div class="feedback good"><strong>Correct! 🎉</strong>${q.explain}</div>`
    : `<div class="feedback bad"><strong>Not quite — let's learn from this!</strong>${learnHtml(nlMiss)}</div>`;
  document.getElementById('q-next-btn').classList.remove('hidden');
}

  SH && SH.cardViewed(historyLessonId, cardIdx + 1);
  const cardIcon = document.getElementById('card-icon');
  if(fc.art){ cardIcon.innerHTML = fc.art; cardIcon.classList.add('has-art'); }
  else { cardIcon.textContent = fc.icon; cardIcon.classList.remove('has-art'); }
  document.getElementById('card-term').textContent = fc.term;
  document.getElementById('card-def').textContent = fc.def;
  document.getElementById('card-prev').disabled = cardIdx === 0;
  document.getElementById('card-next').disabled = cardIdx === lesson.flashcards.length - 1;
  const dots = document.getElementById('card-dots');
  dots.innerHTML = '';
  lesson.flashcards.forEach((_, idx)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (idx === cardIdx ? ' active' : '');
    dots.appendChild(d);
  });
}

function cardStep(dir){
  const lesson = LESSONS[currentLessonIdx];
  cardIdx = Math.max(0, Math.min(lesson.flashcards.length - 1, cardIdx + dir));
  renderCard();
}

function startQuiz(){
  const lesson = LESSONS[currentLessonIdx];
  currentQuizSet = buildQuizSet(lesson);
  currentQuizMeta = {id: lesson.id, title: lesson.title};
  historyQuizId = SH ? SH.quizStarted(SH_APP, SH_TITLE, currentQuizMeta.id, currentQuizMeta.title, false, currentQuizSet.length) : null;
  quizIdx = 0;
  quizScore = 0;
  missedQuestions = [];
  kit.startRound();
  renderQuestion();
  showScreen(quizScreen);
}

function startFinalExam(){
  let qs = [];
  LESSONS.forEach(l=>{
    if(l.generate){
      qs = qs.concat(l.generate(FINAL_EXAM_PER_LESSON));
    } else {
      qs = qs.concat(shuffle(l.quiz).slice(0, FINAL_EXAM_PER_LESSON).map(prepareQuestion));
    }
  });
  currentQuizSet = shuffle(qs);
  currentQuizMeta = {id:'final', title:'Final Mock Exam'};
  historyQuizId = SH ? SH.quizStarted(SH_APP, SH_TITLE, currentQuizMeta.id, currentQuizMeta.title, true, currentQuizSet.length) : null;
  quizIdx = 0;
  quizScore = 0;
  missedQuestions = [];
  kit.startRound();
  renderQuestion();
  showScreen(quizScreen);
}

function showSentence(sentence){
  const el = document.getElementById('q-sentence');
  el.textContent = sentence || '';
  el.style.display = sentence ? '' : 'none';
}
function renderQuestion(){
  answered = false;
  document.getElementById('quiz-title').textContent = currentQuizMeta.title;
  kit.renderLive();
  const total = currentQuizSet.length;
  document.getElementById('quiz-progress').style.width = `${(quizIdx/total)*100}%`;
  renderBot(document.getElementById('quiz-bot-svg'), Math.round((quizScore/total)*8));
  const q = currentQuizSet[quizIdx];
  document.getElementById('q-feedback').innerHTML = '';
  document.getElementById('q-explore').classList.add('hidden');
  document.getElementById('q-next-btn').classList.add('hidden');

  if(q.type === 'numberline'){
    document.getElementById('q-text').textContent = `Question ${quizIdx+1} of ${total}: Find the sum.`;
    showSentence('');
    document.getElementById('q-art').classList.add('hidden');
    document.getElementById('q-options').classList.add('hidden');
    document.getElementById('q-numberline').classList.remove('hidden');
    renderNumberlineQuestion(q);
    offerQuestion({ art:q.art, quiz:currentQuizSet, exam:currentQuizMeta.id === 'final', before:document.getElementById('q-numberline'), options:[], tip:NUMBERLINE_TIP, q:`${q.start} + ${q.jumps} = ?`, historyId:historyQuizId, streak:kit.streak(), index:quizIdx, rerender:renderQuestion });
    return;
  }

  document.getElementById('q-numberline').classList.add('hidden');
  document.getElementById('q-options').classList.remove('hidden');
  const [prompt, sentence] = q.q.split('\n');
  document.getElementById('q-text').textContent = `Question ${quizIdx+1} of ${total}: ${prompt}`;
  showSentence(sentence);
  const qArt = document.getElementById('q-art');
  if(q.art){ qArt.innerHTML = q.art; qArt.classList.remove('hidden'); }
  else { qArt.innerHTML = ''; qArt.classList.add('hidden'); }
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = ()=>selectOption(idx);
    opts.appendChild(b);
  });
  offerQuestion({ art:q.art, quiz:currentQuizSet, exam:currentQuizMeta.id === 'final', before:opts, options:opts.children, correct:q.correct, tip:q.tip, q:q.q, historyId:historyQuizId, streak:kit.streak(), index:quizIdx, rerender:renderQuestion });
}

function selectOption(idx){
  if(answered) return exploreOption(idx);
  answered = true;
  const q = currentQuizSet[quizIdx];
  const total = currentQuizSet.length;
  const buttons = document.querySelectorAll('#q-options .option');
  buttons.forEach((b, i)=>{
    if(i === q.correct) b.classList.add('correct');
    else if(i === idx) b.classList.add('incorrect');
    if(i === idx) b.disabled = true;
    else b.classList.add('explorable');
  });
  showExploreHint('');
  const correct = idx === q.correct;
  const miss = correct ? null : { q: q.q, picked: q.options[idx], why: (q.why || [])[idx] || '', answer: q.options[q.correct], explain: q.explain, tip: q.tip || '' };
  SH && SH.quizAnswered(historyQuizId, correct, historyQuestion(q), q.options[idx], q.options[q.correct], window.Recall ? Recall.typed() : false);
  const helped = !!(window.PowerUps && PowerUps.answered());
  if(correct){
    quizScore++;
  } else {
    missedQuestions.push(miss);
  }
  kit.answer(correct, { helped: helped, exam: currentQuizMeta.id === 'final' });
  renderBot(document.getElementById('quiz-bot-svg'), Math.round((quizScore/total)*8));
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = correct
    ? `<div class="feedback good"><strong>Correct! 🎉</strong>${q.explain}</div>`
    : `<div class="feedback bad"><strong>Not quite — let's learn from this!</strong>${learnHtml(miss)}</div>`;
  document.getElementById('q-next-btn').classList.remove('hidden');
}

function exploreWhy(text){
  return text.replace(/^(?:You said (?:True|False), but |Pinili mo ang (?:Tama|Mali), pero )(.)/, (m, c)=>c.toUpperCase());
}
function showExploreHint(card){
  const el = document.getElementById('q-explore');
  el.innerHTML = '<div class="explore-hint">&#128269; Curious? Tap the other answers to see why.</div>' + card;
  el.classList.remove('hidden');
}
function exploreOption(i){
  const q = currentQuizSet[quizIdx];
  if(!q.options) return;
  document.querySelectorAll('#q-options .option').forEach((b, n)=>b.classList.toggle('explored', n === i));
  showExploreHint(i === q.correct
    ? '<div class="explore-card explore-right"><b>This is the right answer</b><span class="learn-choice">' + q.options[i] + '</span><span class="learn-why">' + q.explain + '</span>' + '</div>'
    : '<div class="explore-card"><b>Why not this one?</b><span class="learn-choice">' + q.options[i] + '</span><span class="learn-why">' + (exploreWhy((q.why||[])[i] || '') || 'This is not the right answer.') + '</span>' + '</div>');
}

function nextQuestion(){
  quizIdx++;
  if(quizIdx >= currentQuizSet.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  const total = currentQuizSet.length;
  const best = Math.max(progress[currentQuizMeta.id] || 0, quizScore);
  progress[currentQuizMeta.id] = best;
  kit.saveProgress(progress);
  SH && SH.quizFinished(historyQuizId, starsFor(quizScore / currentQuizSet.length), kit.sessionPoints(), kit.bestStreak());
  window.Fx && Fx.finish(starsFor(quizScore / currentQuizSet.length));
  renderResults(total);
  showScreen(resultsScreen);
}

function renderResults(total){
  renderBot(document.getElementById('results-bot-svg'), Math.round((quizScore/total)*8));
  const stars = starsFor(quizScore/total);
  document.getElementById('results-heading').textContent =
    stars === 3 ? 'Block Bot Complete!' : stars > 0 ? 'Great Progress!' : 'Keep Building!';
  document.getElementById('results-score').textContent = `You scored ${quizScore} out of ${total} on ${currentQuizMeta.title}`;
  document.getElementById('points-earned').textContent = kit.resultLine();
  document.getElementById('results-stars').innerHTML = [1,2,3].map(s=>`<span class="${s<=stars?'star-on':'star-off'}">★</span>`).join('');
  const reviewEl = document.getElementById('missed-review');
  if(missedQuestions.length){
    reviewEl.innerHTML = '<h3>Questions to Review</h3><div class="missed-list">' +
      missedQuestions.map(m => `<div class="missed-item"><p class="missed-q">${m.q}</p>${learnHtml(m)}</div>`).join('') +
      '</div>';
  } else {
    reviewEl.innerHTML = '';
  }
  reviewEl.classList.toggle('show', missedQuestions.length > 0);
}

function retryLesson(){
  if(currentQuizMeta.id === 'final'){ startFinalExam(); }
  else { startQuiz(); }
}

renderHome();
</script>
