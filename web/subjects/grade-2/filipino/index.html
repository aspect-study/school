<html lang="fil">
<meta charset="utf-8">
<title>Kuwentista</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EC; --surface:#FFFFFF; --surface2:#FBEADF;
  --ink:#2B2440; --ink-soft:#6A6083;
  --accent:#D6467E; --accent-ink:#FFFFFF;
  --gold:#F2A83C; --navy:#2C4A6E;
  --good:#2F9C5D; --bad:#D8433A;
  --border:#F0DCC7;
  --shadow: 0 8px 24px rgba(214,70,126,0.14);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1626; --surface:#2A2036; --surface2:#352840;
    --ink:#F5EEFB; --ink-soft:#C3B6D6;
    --accent:#F073A0; --accent-ink:#1D1626;
    --gold:#F5C168; --navy:#7FA6D6;
    --good:#4FCB84; --bad:#F0766B;
    --border:#443652;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1626; --surface:#2A2036; --surface2:#352840;
  --ink:#F5EEFB; --ink-soft:#C3B6D6;
  --accent:#F073A0; --accent-ink:#1D1626;
  --gold:#F5C168; --navy:#7FA6D6;
  --good:#4FCB84; --bad:#F0766B;
  --border:#443652;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Poppins',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Chewy',cursive; font-weight:400; letter-spacing:0.01em;}
.app{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}
button:focus-visible, a:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* HOME */
.hero{display:flex; align-items:center; gap:14px; margin:10px 0 20px;}
.hero-book{width:84px; height:84px; flex:none;}
.hero h1{font-size:2.2rem; margin:0; color:var(--accent);}
.hero p{margin:4px 0 0; color:var(--ink-soft); font-size:0.95rem;}
.lesson-grid{display:grid; gap:14px;}
.lesson-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
  text-align:left; width:100%;
}
.final-card{
  border:2px solid var(--gold);
  background:linear-gradient(135deg, color-mix(in srgb, var(--gold) 14%, var(--surface)), var(--surface));
}
.final-badge{
  display:inline-block; font-size:0.68rem; font-weight:800; letter-spacing:0.04em;
  color:var(--navy); background:color-mix(in srgb, var(--gold) 35%, var(--surface));
  padding:2px 8px; border-radius:20px; margin-bottom:3px;
}
.lesson-emoji{font-size:2rem; flex:none; width:52px; height:52px; border-radius:14px;
  background:var(--surface2); display:flex; align-items:center; justify-content:center;}
.lesson-info{flex:1; min-width:0;}
.lesson-info h3{margin:0 0 2px; font-size:1.1rem;}
.lesson-info p{margin:0; color:var(--ink-soft); font-size:0.85rem;}
.stars{margin-top:6px; font-size:0.95rem; letter-spacing:2px;}
.star-on{color:var(--gold);}
.star-off{color:var(--border);}
.go-btn{
  flex:none; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:10px 16px; font-weight:700; font-size:0.85rem;
}

/* FLASHCARDS */
.screen-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{background:none; border:none; color:var(--accent); font-weight:700; font-size:0.95rem; padding:6px 4px;}
.screen-head h2{margin:0; font-size:1.35rem; flex:1;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px 24px; box-shadow:var(--shadow); gap:14px;
}
.card-icon{font-size:2.6rem;}
.card-term{font-family:'Chewy',cursive; font-size:1.5rem; color:var(--accent);}
.card-def{font-size:1.02rem; color:var(--ink-soft); line-height:1.5; white-space:pre-line;}
.card-en{font-size:0.92rem; color:var(--ink); line-height:1.45; white-space:pre-line; text-align:left; width:100%;
  background:color-mix(in srgb, var(--navy) 10%, var(--surface)); border-left:4px solid var(--navy); border-radius:10px; padding:10px 14px;}
.en-label{display:block; font-weight:800; font-size:0.75rem; letter-spacing:0.04em; color:var(--navy); margin-bottom:2px;}
.card.tip{border:3px solid var(--gold); background:color-mix(in srgb, var(--gold) 10%, var(--surface));}
.card.tip .card-term{color:var(--ink);}
.card.tip .card-def{color:var(--ink); text-align:left;}
.q-help{background:none; border:1px dashed var(--navy); color:var(--navy); border-radius:10px; padding:6px 12px; font-weight:700; font-size:0.85rem; margin:-8px 0 14px;}
.q-en{font-size:0.92rem; color:var(--ink); background:color-mix(in srgb, var(--navy) 10%, var(--surface)); border-left:4px solid var(--navy); border-radius:10px; padding:8px 12px; margin:-8px 0 14px;}
.fb-en{margin-top:8px; font-size:0.88rem; color:var(--ink-soft);}
.card-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px;}
.nav-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:12px;
  padding:12px 18px; font-weight:600;
}
.nav-btn:disabled{opacity:0.4; cursor:default;}
.dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:140px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent);}
.primary-btn{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
  padding:14px 22px; font-weight:700; font-size:1rem; width:100%; margin-top:18px;
}

/* QUIZ */
.quiz-top{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.progress-bar{flex:1; height:10px; background:var(--surface2); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); transition:width .3s;}
.quiz-book{width:46px; height:46px; flex:none;}
.q-text{font-size:1.1rem; font-weight:700; margin:6px 0 16px; line-height:1.4;}
.options{display:grid; gap:10px;}
.option{
  background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
  text-align:left; font-size:1rem; font-weight:600; color:var(--ink);
}
.option.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
.option.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
.option:disabled{cursor:default;}
.option.explorable{border-style:dashed;}
.option.explored{box-shadow:0 0 0 3px var(--surface2);}
.explore{margin-top:10px;}
.explore-hint{font-size:0.88rem; color:var(--ink-soft); font-weight:700;}
.explore-card{margin-top:8px; background:var(--surface); border:2px solid var(--border); border-left:5px solid var(--bad); border-radius:12px; padding:9px 12px; line-height:1.45; font-size:0.95rem;}
.explore-card.explore-right{border-left-color:var(--good);}
.explore-card b{display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);}
.explore-card .learn-choice{font-weight:800;}
.explore-card .learn-why{display:block; margin-top:3px;}
.explore-card .fb-en{margin-top:4px;}
.feedback{margin-top:14px; padding:14px 16px; border-radius:14px; font-size:0.95rem; line-height:1.5;}
.feedback.good{background:color-mix(in srgb, var(--good) 16%, var(--surface)); color:var(--ink);}
.feedback.bad{background:color-mix(in srgb, var(--bad) 16%, var(--surface)); color:var(--ink);}
.feedback strong{display:block; margin-bottom:4px; font-family:'Chewy',cursive; font-size:1.05rem;}
.q-sentence{
  background:var(--surface2); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
  font-size:1.2rem; font-weight:700; line-height:1.5; text-align:center; margin:-4px 0 16px; color:var(--ink);
}
.passage{
  background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:14px 16px;
  font-size:0.95rem; line-height:1.55; margin-bottom:14px; color:var(--ink);
}
.passage strong{font-family:'Chewy',cursive; color:var(--accent); display:block; margin-bottom:4px; font-size:1.05rem;}

/* RESULTS */
.results{text-align:center; padding:20px 10px;}
.results-book{width:180px; height:180px; margin:0 auto 14px;}
.results h2{font-size:1.75rem; color:var(--accent); margin:0 0 4px;}
.score-line{font-size:1.05rem; color:var(--ink-soft); margin-bottom:10px;}
.results-stars{font-size:2rem; letter-spacing:8px; margin-bottom:18px;}
.points-total{display:inline-flex; align-items:center; gap:6px; background:color-mix(in srgb, var(--gold) 30%, var(--surface)); color:var(--ink); font-weight:800; font-size:0.85rem; padding:6px 14px; border-radius:999px; margin-top:8px;}
.points-live{font-size:0.85rem; font-weight:800; color:var(--ink); white-space:nowrap; margin-left:auto;}
.points-live .streak{color:var(--bad); margin-left:4px;}
.points-earned{font-size:1rem; font-weight:800; color:var(--ink); margin-bottom:4px;}
.missed-review{display:none; text-align:left; margin:0 0 18px; padding-top:16px; border-top:1px solid var(--border);}
.missed-review.show{display:block;}
.missed-review h3{font-size:1rem; font-family:'Chewy',cursive; font-weight:400; color:var(--ink); margin:0 0 10px; text-align:center;}
.missed-list{max-height:340px; overflow-y:auto; padding-right:2px;}
.missed-item{background:var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.missed-item .missed-q{white-space:pre-line; font-weight:700; color:var(--ink); margin:0 0 4px; line-height:1.4; font-size:0.96rem;}
.missed-item .missed-explain{color:var(--ink-soft); margin:0; line-height:1.4; font-size:0.9rem;}
.results-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.secondary-btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--border); border-radius:14px;
  padding:12px 20px; font-weight:600;
}

/* book pieces */
.piece{opacity:0; transform:scale(0.6); transform-origin:center; transition:opacity .35s ease, transform .35s ease;}
.piece.on{opacity:1; transform:scale(1);}

/* 3-up lesson map on wide screens, so every lesson shows at once.
   Only the lesson list widens -- flashcards, quiz and results stay narrow. */
@media (min-width:900px){
  .app{max-width:1120px;}
  .app section:not(#screen-home){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home > *:not(.lesson-grid){max-width:720px; margin-left:auto; margin-right:auto;}
  #screen-home .lesson-grid{grid-template-columns:repeat(3, minmax(0,1fr)); align-items:stretch;}
  #screen-home .lesson-card{flex-direction:column; align-items:stretch; gap:10px; height:100%;}
  #screen-home .lesson-emoji{align-self:flex-start;}
  #screen-home .lesson-info{flex:1;}
  #screen-home .go-btn{width:100%; text-align:center;}
}
/* ---- Learn from a wrong answer ---- */
.learn{display:flex; flex-direction:column; gap:8px;}
.learn-row{background:var(--surface); border-radius:12px; padding:9px 12px; border-left:5px solid var(--bad); line-height:1.45;}
.learn-row b{display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);}
.learn-row .learn-choice{font-weight:800;}
.learn-row .learn-why{display:block; margin-top:3px;}
.learn-right{border-left-color:var(--good);}
.learn-tip{border-left-color:var(--gold);}
.learn-row .fb-en{margin-top:4px;}
.missed-item .learn{margin-top:6px; font-size:0.9rem;}
#points-earned{white-space:pre-line;}
</style>

<div class="app">

  <!-- HOME -->
  <section id="screen-home">

      <svg class="hero-book" viewBox="0 0 200 200" id="hero-book-svg"></svg>

        <h1>Kuwentista</h1>
        <p>Mas mahigpit na antas: bagong halimbawa, hindi lang paulit-ulit sa flashcard. Repasuhin, sagutan, at subukan ang Pangwakas na Pagsusulit para maging handa sa tunay na exam!</p>
        <div class="points-total" id="points-total-badge"></div>
      <button type="button" class="coins-badge" data-coins="badge" data-coins-guide hidden></button>

  <!-- FLASHCARDS -->
  <section id="screen-cards" class="hidden">

      <div class="card-icon" id="card-icon"></div>
      <div class="card-term" id="card-term"></div>
      <div class="card-def" id="card-def"></div>
      <div class="card-en hidden" id="card-en"></div>

      <button class="nav-btn" id="card-prev" onclick="cardStep(-1)">&larr; Balik</button>

      <button class="nav-btn" id="card-next" onclick="cardStep(1)">Susunod &rarr;</button>
    </div>

  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="hidden">
    <div class="screen-head">
      <button class="back-btn" onclick="goHome()">&larr; Balik</button>

      <div class="points-live" id="points-live"></div>
    </div>
    <div class="quiz-top">
      <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
      <svg class="quiz-book" viewBox="0 0 200 200" id="quiz-book-svg"></svg>
    </div>
    <div id="q-passage"></div>
    <div class="q-text" id="q-text"></div>
    <button class="q-help" id="q-help" onclick="showQuestionEnglish()">🤔 Hindi maintindihan? Tingnan sa English</button>
    <div class="q-en hidden" id="q-en"></div>
    <div class="q-sentence hidden" id="q-sentence"></div>
    <div class="options" id="q-options"></div>
    <div class="explore hidden" id="q-explore"></div>
    <div id="q-feedback"></div>
    <button class="primary-btn hidden" id="q-next-btn" onclick="nextQuestion()">Susunod &rarr;</button>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="hidden">
    <div class="results">
      <svg class="results-book" viewBox="0 0 200 200" id="results-book-svg"></svg>
      <h2 id="results-heading"></h2>
      <div class="score-line" id="results-score"></div>
      <div class="points-earned" id="points-earned"></div>
      <div class="coins-have" data-coins="haveNow"></div>
      <div class="results-stars" id="results-stars"></div>
      <div class="missed-review" id="missed-review"></div>
      <div class="results-actions">
        <button class="primary-btn" style="width:auto" onclick="retryLesson()">Ulitin</button>
        <button class="secondary-btn" onclick="goHome()">Balik sa Aralin</button>
      </div>
    </div>
  </section>

</div>

<script data-file-check>
(function(){
  var GLOBALS = { 'study-history': 'StudyHistory', wallet: 'Wallet', fx: 'Fx', powerups: 'PowerUps', recall: 'Recall' };
  var missing = [];
  document.querySelectorAll('script[src]').forEach(function(s){
    var file = s.getAttribute('src').replace(/^.*\//, ''), name = GLOBALS[file.replace(/\.js$/, '')];
    if (name && !window[name]) missing.push(file);
  });
  if (!missing.length) return;
  function show(){
    var bar = document.createElement('div');
    bar.id = 'file-check';
    bar.setAttribute('role', 'alert');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;font:600 15px/1.4 system-ui,sans-serif;padding:10px 16px;text-align:center';
    bar.textContent = '⚠️ Missing or broken file: ' + missing.join(', ') + '. Check that the engine folder is complete.';
    document.body.appendChild(bar);
  }
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
})();
</script>
<script>
const STORY_PASSAGE = `Isang mainit na araw, nakita ng masipag na langgam ang isang tipaklong na umaawit sa ilalim ng punong-kahoy. Habang naglalakad, patuloy na nagtitipon ang langgam ng pagkain para sa paparating na tag-ulan. Nang dumating ang tag-ulan, wala nang pagkain ang tipaklong ngunit marami pa rin ang naitipon ng langgam. Kusang-loob na ibinahagi ng langgam ang kaniyang pagkain sa tipaklong. Mula noon, natutong maging masipag ang tipaklong.`;

const LESSONS = [
  {
    id:'alpabeto', emoji:'🔤', title:'Alpabetong Pilipino', subtitle:'Ang mga Titik ng Wikang Filipino',
    flashcards:[
      {icon:'🔡', term:'Alpabetong Filipino', def:'May 28 na titik (letra) ang Alpabetong Filipino.\n20 ay galing sa dating Abakada.\n8 ay dagdag mula sa Ingles at Espanyol.', en:'The Filipino alphabet has 28 letters.\n20 from the old Abakada + 8 added letters = 28.'},
      {icon:'🅰️', term:'Patinig', def:'LIMA (5) lang ang patinig:\nA, E, I, O, U', en:'Patinig = vowels. There are only 5: A, E, I, O, U.'},
      {icon:'🔠', term:'Katinig', def:'Lahat ng titik na HINDI patinig ay katinig.\nHal: B, K, D, G, M, S, T', en:'Katinig = consonants. If it is not A, E, I, O, U, it is a katinig.'},
      {icon:'✨', term:'Ñ at NG', def:'Kasama ang Ñ at NG sa 28 na titik.\nPa-Ingles ang bigkas ng mga titik, MALIBAN sa Ñ.\nAng Ñ ay pa-Espanyol ang bigkas.', en:'Ñ and NG are letters too.\nWe say the letters the English way, EXCEPT Ñ. We say Ñ the Spanish way.'},
      {icon:'📜', term:'Ang 8 Dagdag na Letra', def:'C, F, J, Ñ, Q, V, X, Z\nWala sila sa dating Abakada. Dagdag sila mula sa Ingles at Espanyol.', en:'The 8 added letters: C, F, J, Ñ, Q, V, X, Z. They were not in the old Abakada.'},
      {icon:'🔡', term:'Malaki at Maliit na Titik', def:'A = malaking titik\na = maliit na titik\nDapat alam mong isulat at basahin ang dalawa.', en:'Malaking titik = uppercase (A).\nMaliit na titik = lowercase (a).'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Patinig ba? Tingnan kung A, E, I, O, o U.\nKung hindi — KATINIG iyan!\n\nPara magbilang sa isang salita, ituro isa-isa ang bawat titik.\nHal: g-U-r-O → 2 patinig', en:'Is it A, E, I, O, U? Then it is a vowel (patinig). If not, it is a consonant (katinig).\nTo count, point at each letter one by one.'},
    ],
    quiz:[
      {q:'Ilang titik mayroon ang Alpabetong Filipino?', qen:'How many letters are in the Filipino alphabet?', options:['26','28','20','30'], correct:1, explain:'28 ang titik: 20 mula sa Abakada + 8 na dagdag.', en:'28 letters (20 + 8).', why:['Kulang ang 26. Tandaan: 20 mula sa Abakada + 8 na dagdag = 28.', '', 'Ang 20 ay ang galing lang sa dating Abakada. Kulang pa ang 8 na dagdag na letra.', 'Sobra ang 30. Ang tamang bilang: 20 + 8 = 28.'], whyEn:['26 is too few. Remember: 20 from the Abakada + 8 added = 28.', '', '20 is only the letters from the old Abakada. The 8 added letters are still missing.', '30 is too many. The right count: 20 + 8 = 28.'], tip:'Tandaan ang dalawang bilang: 20 at 8. Pagsamahin sila: 20 + 8 = 28.', tipEn:'Remember two numbers: 20 and 8. Put them together: 20 + 8 = 28.'},
      {q:'Ilan ang patinig sa Filipino?', qen:'How many vowels are there in Filipino?', options:['5','6','4','7'], correct:0, explain:'Lima (5) ang patinig: A, E, I, O, U.', en:'5 vowels: A, E, I, O, U.', why:['', 'Sobra ang 6. Bilangin: A, E, I, O, U — lima lang.', 'Kulang ang 4. Baka may nakalimutan ka. A, E, I, O, U = 5.', 'Sobra ang 7. Lima lang ang patinig: A, E, I, O, U.'], whyEn:['', '6 is too many. Count: A, E, I, O, U. That is only five.', '4 is too few. Maybe you forgot one. A, E, I, O, U = 5.', '7 is too many. There are only five vowels: A, E, I, O, U.'], tip:'Bilangin sa daliri: A, E, I, O, U. Isang daliri para sa bawat patinig.', tipEn:'Count on your fingers: A, E, I, O, U. One finger for each vowel.'},
      {q:'Alin dito ang HINDI patinig?', qen:'Which one is NOT a vowel?', options:['A','E','M','O'], correct:2, explain:'Ang M ay katinig. Ang A, E, at O ay patinig.', en:'M is a consonant. A, E, O are vowels.', why:['Ang A ay patinig, kaya hindi ito ang sagot. Hanapin ang HINDI patinig.', 'Ang E ay patinig, kaya hindi ito ang sagot. Hanapin ang HINDI patinig.', '', 'Ang O ay patinig, kaya hindi ito ang sagot. Hanapin ang HINDI patinig.'], whyEn:['A is a vowel, so it is not the answer. We need the one that is NOT a vowel.', 'E is a vowel, so it is not the answer. We need the one that is NOT a vowel.', '', 'O is a vowel, so it is not the answer. We need the one that is NOT a vowel.'], tip:'Basahin nang mabuti ang HINDI sa tanong. Hanapin ang titik na wala sa A, E, I, O, U.', tipEn:'Read the word NOT in the question carefully. Find the letter that is not A, E, I, O, or U.'},
      {q:'Alin dito ang katinig?', qen:'Which one is a consonant?', options:['I','U','S','A'], correct:2, explain:'Ang S ay katinig — hindi ito A, E, I, O, o U.', en:'S is a consonant because it is not A, E, I, O, U.', why:['Ang I ay patinig (A, E, I, O, U), hindi katinig.', 'Ang U ay patinig (A, E, I, O, U), hindi katinig.', '', 'Ang A ay patinig (A, E, I, O, U), hindi katinig.'], whyEn:['I is a vowel (A, E, I, O, U), not a consonant.', 'U is a vowel (A, E, I, O, U), not a consonant.', '', 'A is a vowel (A, E, I, O, U), not a consonant.'], tip:'Alisin muna ang mga patinig (A, E, I, O, U). Ang titik na matitira ay katinig.', tipEn:'First cross out the vowels (A, E, I, O, U). The letter that is left is a consonant.'},
      {q:'Ano ang kasunod na titik pagkatapos ng "F"?', qen:'Which letter comes right after F?', options:['E','G','H','D'], correct:1, explain:'...E, F, G, H... — ang G ang kasunod ng F.', en:'After F comes G.', why:['Ang E ay BAGO ang F, hindi kasunod nito.', '', 'Ang H ay pagkatapos pa ng G. Nalaktawan mo ang G.', 'Ang D ay bago pa ang E at F. Hindi ito kasunod ng F.'], whyEn:['E comes BEFORE F, not after it.', '', 'H comes after G. You skipped G.', 'D comes before E and F. It does not come after F.'], tip:'Awitin ang alpabeto hanggang F, tapos sabihin ang susunod na titik: ...E, F, G.', tipEn:'Sing the alphabet up to F, then say the next letter: ...E, F, G.'},
      {q:'Tama o Mali: Ang Ñ ay binibigkas nang pa-Ingles.', qen:'True or False: We say Ñ the English way.', options:['Tama','Mali'], correct:1, explain:'Mali — pa-Espanyol ang bigkas ng Ñ. Ang ibang titik ang pa-Ingles.', en:'False. Ñ is said the Spanish way.', why:['Pinili mo ang Tama, pero mali ang pangungusap. Ang salitang "pa-Ingles" ang mali — pa-Espanyol ang bigkas ng Ñ.', ''], whyEn:['You said True, but the sentence is false. The words "the English way" are wrong. We say Ñ the Spanish way.', ''], tip:'Tandaan: Ñ lang ang naiiba. Lahat ng ibang titik ay pa-Ingles, pero ang Ñ ay pa-Espanyol.', tipEn:'Remember: only Ñ is different. All other letters are said the English way, but Ñ is said the Spanish way.'},
      {q:'Ilang letra ang idinagdag mula sa Ingles at Espanyol?', qen:'How many letters were added from English and Spanish?', options:['8','10','5','20'], correct:0, explain:'8 ang dagdag: C, F, J, Ñ, Q, V, X, Z.', en:'8 added letters.', why:['', 'Sobra ang 10. Bilangin: C, F, J, Ñ, Q, V, X, Z = 8.', 'Kulang ang 5. Bilangin: C, F, J, Ñ, Q, V, X, Z = 8.', 'Ang 20 ay ang galing sa dating Abakada, hindi ang dagdag na letra.'], whyEn:['', '10 is too many. Count: C, F, J, Ñ, Q, V, X, Z = 8.', '5 is too few. Count: C, F, J, Ñ, Q, V, X, Z = 8.', '20 is the letters from the old Abakada, not the added letters.'], tip:'Bilangin sa daliri ang dagdag na letra: C, F, J, Ñ, Q, V, X, Z.', tipEn:'Count the added letters on your fingers: C, F, J, Ñ, Q, V, X, Z.'},
      {q:'Ilan ang patinig sa salitang ito?\n"guro"', qen:'How many vowels are in this word?', options:['1','2','3','0'], correct:1, explain:'g-U-r-O → 2 patinig: u at o.', en:'g-u-r-o: the vowels are u and o. That is 2.', why:['Isa lang ang nabilang mo. Baka nakalimutan mo ang u o ang o. g-U-r-O → u at o = 2.', '', 'Sobra ang 3. Ang g at r ay katinig, hindi patinig. u at o lang = 2.', 'May patinig ang "guro": ang u at ang o. Kaya 2, hindi 0.'], whyEn:['You counted only one. Maybe you missed the u or the o. g-U-r-O → u and o = 2.', '', '3 is too many. g and r are consonants, not vowels. Only u and o = 2.', '"guro" does have vowels: u and o. So it is 2, not 0.'], tip:'Ituro isa-isa ang bawat titik ng g-u-r-o. Bilangin lang ang A, E, I, O, U.', tipEn:'Point at each letter of g-u-r-o one by one. Count only A, E, I, O, U.'},
      {q:'Ilan ang katinig sa salitang ito?\n"aklat"', qen:'How many consonants are in this word?', options:['2','3','4','1'], correct:1, explain:'a-K-L-a-T → 3 katinig: k, l, t.', en:'a-k-l-a-t: the consonants are k, l, t. That is 3.', why:['Kulang ang 2. Baka nakalimutan mo ang isa sa k, l, t. a-K-L-a-T → 3.', '', 'Sobra ang 4. Baka nabilang mo ang isang a. Ang a ay patinig. k, l, t lang = 3.', 'Kulang ang 1. May tatlong katinig: k, l, at t.'], whyEn:['2 is too few. Maybe you missed one of k, l, t. a-K-L-a-T → 3.', '', '4 is too many. Maybe you counted one a. The a is a vowel. Only k, l, t = 3.', '1 is too few. There are three consonants: k, l, and t.'], tip:'Ituro ang bawat titik ng a-k-l-a-t. Bilangin lang ang mga titik na HINDI A, E, I, O, U.', tipEn:'Point at each letter of a-k-l-a-t. Count only the letters that are NOT A, E, I, O, U.'},
      {q:'Aling titik ang binibigkas nang pa-Espanyol?', qen:'Which letter is said the Spanish way?', options:['NG','Ñ','K','W'], correct:1, explain:'Ñ lang ang pa-Espanyol ang bigkas.', en:'Only Ñ is said the Spanish way.', why:['Kasama ang NG sa 28 na titik, pero pa-Ingles ang bigkas nito.', '', 'Pa-Ingles ang bigkas ng K, hindi pa-Espanyol.', 'Pa-Ingles ang bigkas ng W, hindi pa-Espanyol.'], whyEn:['NG is one of the 28 letters, but we say it the English way.', '', 'We say K the English way, not the Spanish way.', 'We say W the English way, not the Spanish way.'], tip:'Isa lang ang pa-Espanyol: ang Ñ. Hanapin ang titik na may maliit na alon ( ~ ) sa ibabaw.', tipEn:'Only one letter is said the Spanish way: Ñ. Look for the letter with the little wave ( ~ ) on top.'},
      {q:'Tama o Mali: May 20 letra mula sa dating Abakada ang Alpabetong Filipino.', qen:'True or False: 20 letters of the Filipino alphabet came from the old Abakada.', options:['Tama','Mali'], correct:0, explain:'Tama — 20 mula sa Abakada + 8 dagdag = 28.', en:'True. 20 + 8 = 28.', why:['', 'Pinili mo ang Mali, pero tama ang pangungusap. Talagang 20 ang galing sa Abakada, at 8 ang dagdag: 20 + 8 = 28.'], whyEn:['', 'You said False, but the sentence is true. 20 letters really came from the Abakada, and 8 were added: 20 + 8 = 28.'], tip:'Suriin ang bilang sa pangungusap. Tandaan: 20 (Abakada) + 8 (dagdag) = 28.', tipEn:'Check the number in the sentence. Remember: 20 (Abakada) + 8 (added) = 28.'},
      {q:'Alin ang isa sa 8 DAGDAG na letra (wala sa dating Abakada)?', qen:'Which one is one of the 8 ADDED letters (not in the old Abakada)?', options:['B','C','K','P'], correct:1, explain:'Ang C ay isa sa 8 dagdag na letra. Ang B, K, at P ay nasa dating Abakada.', en:'C is an added letter. B, K, P were already in the Abakada.', why:['Ang B ay nasa dating Abakada na, kaya hindi ito dagdag.', '', 'Ang K ay nasa dating Abakada na, kaya hindi ito dagdag.', 'Ang P ay nasa dating Abakada na, kaya hindi ito dagdag.'], whyEn:['B was already in the old Abakada, so it is not an added letter.', '', 'K was already in the old Abakada, so it is not an added letter.', 'P was already in the old Abakada, so it is not an added letter.'], tip:'Tandaan ang 8 dagdag: C, F, J, Ñ, Q, V, X, Z. Hanapin ang titik na kasama sa listahang ito.', tipEn:'Remember the 8 added letters: C, F, J, Ñ, Q, V, X, Z. Find the letter that is on this list.'},
    ]
  },
  {
    id:'pangngalan', emoji:'🏷️', title:'Uri ng Pangngalan', subtitle:'Pambalana at Pantangi',
    flashcards:[
      {icon:'🏷️', term:'Pangngalan', def:'PANGALAN ng tao, hayop, bagay, lugar, o pangyayari.', en:'Pangngalan = noun. The name of a person, animal, thing, place, or event.'},
      {icon:'🐶', term:'Mga Halimbawa', def:'Tao: guro, bata, Ana\nHayop: aso, pusa, daga\nBagay: libro, mesa, upuan\nLugar: paaralan, palengke, Luneta\nPangyayari: kasal, piyesta, kaarawan', en:'Person, animal, thing, place, event.'},
      {icon:'🔡', term:'Pambalana', def:'KARANIWANG pangalan.\nMaliit na titik ang simula.\nHal: guro, aso, paaralan', en:'Pambalana = a common name (not one special one). It starts with a small letter.\nLike: teacher, dog, school.'},
      {icon:'🔠', term:'Pantangi', def:'TIYAK na pangalan.\nLaging malaking titik ang simula.\nHal: Maynila, Ginoong Santos, Bantay (pangalan ng aso)', en:'Pantangi = the special name of ONE person, animal, thing, or place. It always starts with a capital letter.\nLike: Manila, Mr. Santos, Bantay (a dog name).'},
      {icon:'⚖️', term:'Paghambingin', def:'guro → Pambalana (kahit sinong guro)\nJose Rizal → Pantangi (isang tiyak na tao)\n\npaaralan → Pambalana\nMaynila → Pantangi', en:'"guro" can be any teacher, so it is Pambalana.\n"Jose Rizal" is one specific person, so it is Pantangi.'},
      {icon:'⚠️', term:'Tandaan', def:'Ang Pambalana ay malaking titik LANG kapag ito ang unang salita ng pangungusap.\nPambalana pa rin ito!', en:'A Pambalana word gets a capital letter only when it is the first word of a sentence. It is still Pambalana.'},
      {icon:'🎉', term:'Pangyayari', def:'kaarawan, kasal, piyesta → Pambalana (karaniwan)\nPasko, Enero → Pantangi (tiyak na pangalan)', en:'Birthday, wedding, fiesta = common, so Pambalana.\nChristmas (Pasko), January (Enero) = special names, so Pantangi.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Itanong: KAHIT ANO ba ito, o ISANG TIYAK lang?\n\nKahit ano / kahit sino → PAMBALANA\nIsang tiyak (may sariling pangalan) → PANTANGI\n\nClue: Ang Pantangi ay laging may malaking titik.', en:'Ask: can it be ANY one, or is it ONE special one?\nAny one = Pambalana. One special one with its own name = Pantangi.\nClue: Pantangi always starts with a capital letter.'},
    ],
    quiz:[
      {q:'Ano ang uri ng "Jollibee"?\n"Kumain kami sa Jollibee kahapon."', qen:'What kind of noun is "Jollibee"?', options:['Pambalana','Pantangi'], correct:1, explain:'"Jollibee" ay tiyak na pangalan — Pantangi. May malaking titik pa!', en:'Jollibee is a special name, so it is Pantangi.', why:['Ang Pambalana ay karaniwang pangalan na maliit ang simula, gaya ng guro o aso. Ang "Jollibee" ay isang tiyak na pangalan, at may malaking titik pa.', ''], whyEn:['Pambalana is a common name that starts with a small letter, like guro or aso. "Jollibee" is one special name, and it has a capital letter.', ''], tip:'Tingnan ang unang titik. May malaking titik ba kahit nasa gitna ng pangungusap? Pantangi iyan!', tipEn:'Look at the first letter. Is it a capital letter even in the middle of the sentence? Then it is Pantangi!'},
      {q:'Ano ang uri ng "ibon"?\n"Maraming ibon sa puno."', qen:'What kind of noun is "ibon" (bird)?', options:['Pambalana','Pantangi'], correct:0, explain:'"ibon" — kahit anong ibon. Karaniwang pangalan, kaya Pambalana.', en:'It can be any bird, so it is Pambalana.', why:['', 'Ang Pantangi ay tiyak na pangalan na may malaking titik. Ang "ibon" ay kahit anong ibon, at maliit ang simula nito.'], whyEn:['', 'Pantangi is a special name with a capital letter. "ibon" can be any bird, and it starts with a small letter.'], tip:'Itanong: kahit anong ibon ba ito, o isang ibon na may sariling pangalan? Kahit ano → Pambalana.', tipEn:'Ask: can it be any bird, or one bird with its own name? Any one → Pambalana.'},
      {q:'Ilan ang Pantangi sa pangungusap?\n"Si Maria ay nag-aral sa Unibersidad ng Pilipinas."', qen:'How many Pantangi (special names) are in this sentence?', options:['1','2','3','0'], correct:1, explain:'Dalawa: "Maria" at "Unibersidad ng Pilipinas." Parehong tiyak na pangalan.', en:'Two special names: Maria and Unibersidad ng Pilipinas.', why:['Isa lang ang nabilang mo. Baka "Maria" lang ang nakita mo. Tiyak na pangalan din ang "Unibersidad ng Pilipinas." 1 + 1 = 2.', '', 'Sobra ang 3. Baka binilang mo nang hiwalay ang "Unibersidad" at "Pilipinas," o binilang mo ang "Si." Iisang pangalan lang ang "Unibersidad ng Pilipinas." Maria + Unibersidad ng Pilipinas = 2.', 'May Pantangi rito: "Maria" at "Unibersidad ng Pilipinas." Parehong may malaking titik.'], whyEn:['You counted only one. Maybe you saw only "Maria." "Unibersidad ng Pilipinas" is a special name too. 1 + 1 = 2.', '', '3 is too many. Maybe you counted "Unibersidad" and "Pilipinas" apart, or you counted "Si." "Unibersidad ng Pilipinas" is just one name. Maria + Unibersidad ng Pilipinas = 2.', 'There are Pantangi here: "Maria" and "Unibersidad ng Pilipinas." Both have capital letters.'], tip:'Hanapin ang malalaking titik sa gitna ng pangungusap. Ang pangalang may maraming salita, gaya ng "Unibersidad ng Pilipinas," ay isang Pantangi lang.', tipEn:'Look for capital letters in the middle of the sentence. A name with many words, like "Unibersidad ng Pilipinas," counts as just one Pantangi.'},
      {q:'Alin ang Pantangi?', qen:'Which one is Pantangi (a special name)?', options:['lungsod','Cebu','bata','paaralan'], correct:1, explain:'"Cebu" ay tiyak na pangalan ng lugar — Pantangi.', en:'Cebu is the name of one special place.', why:['Ang "lungsod" ay kahit anong lungsod — Pambalana. Maliit din ang simula nito.', '', 'Ang "bata" ay kahit sinong bata — Pambalana. Maliit ang simula nito.', 'Ang "paaralan" ay kahit anong paaralan — Pambalana. Maliit ang simula nito.'], whyEn:['"lungsod" (city) can be any city, so it is Pambalana. It starts with a small letter.', '', '"bata" (child) can be any child, so it is Pambalana. It starts with a small letter.', '"paaralan" (school) can be any school, so it is Pambalana. It starts with a small letter.'], tip:'Hanapin ang salitang may malaking titik. Iyon ang tiyak na pangalan (Pantangi).', tipEn:'Look for the word with a capital letter. That is the special name (Pantangi).'},
      {q:'Alin ang Pambalana?', qen:'Which one is Pambalana (a common name)?', options:['Pasko','tindahan','Jose Rizal','Enero'], correct:1, explain:'"tindahan" — kahit anong tindahan. Karaniwan, kaya Pambalana.', en:'tindahan (store) can be any store, so it is Pambalana.', why:['Ang "Pasko" ay tiyak na pangalan — Pantangi, kaya may malaking titik.', '', 'Isang tiyak na tao si Jose Rizal — Pantangi, hindi Pambalana.', 'Ang "Enero" ay tiyak na pangalan ng buwan — Pantangi, kaya may malaking titik.'], whyEn:['"Pasko" (Christmas) is a special name, so it is Pantangi. That is why it has a capital letter.', '', 'Jose Rizal is one special person, so it is Pantangi, not Pambalana.', '"Enero" (January) is the special name of a month, so it is Pantangi. It has a capital letter.'], tip:'Hanapin ang salitang maliit ang unang titik at puwedeng kahit ano. Iyon ang Pambalana.', tipEn:'Look for the word that starts with a small letter and can be any one. That is Pambalana.'},
      {q:'Ilan ang Pantangi sa pangungusap?\n"Pumunta kami sa Baguio noong Disyembre."', qen:'How many Pantangi words are in this sentence?', options:['1','2','3','0'], correct:1, explain:'Dalawa: "Baguio" (tiyak na lugar) at "Disyembre" (tiyak na buwan).', en:'Two: Baguio and Disyembre.', why:['Isa lang ang nabilang mo. Baka "Baguio" lang ang nakita mo. Pantangi rin ang "Disyembre" dahil pangalan ito ng tiyak na buwan. 1 + 1 = 2.', '', 'Sobra ang 3. Baka binilang mo ang "Pumunta." Malaki lang ang titik nito dahil ito ang unang salita. Baguio + Disyembre = 2.', 'May Pantangi rito: "Baguio" (lugar) at "Disyembre" (buwan).'], whyEn:['You counted only one. Maybe you saw only "Baguio." "Disyembre" (December) is Pantangi too, because it is the name of one month. 1 + 1 = 2.', '', '3 is too many. Maybe you counted "Pumunta." It has a capital letter only because it is the first word. Baguio + Disyembre = 2.', 'There are Pantangi here: "Baguio" (a place) and "Disyembre" (a month).'], tip:'Tandaan: ang pangalan ng buwan ay Pantangi rin, gaya ng Enero. Huwag isama ang unang salita kung karaniwang salita lang ito.', tipEn:'Remember: month names are Pantangi too, like Enero. Do not count the first word if it is just a common word.'},
      {q:'Tama o Mali: Ang "kaarawan" ay laging isinusulat sa malaking titik.', qen:'True or False: "kaarawan" (birthday) is always written with a capital letter.', options:['Tama','Mali'], correct:1, explain:'Mali — ang "kaarawan" ay Pambalana, kaya maliit na titik.', en:'False. kaarawan is a common word, so it uses a small letter.', why:['Pinili mo ang Tama, pero mali ito. Ang salitang "laging" ang mali. Pambalana ang "kaarawan," kaya maliit na titik — maliban kung ito ang unang salita ng pangungusap.', ''], whyEn:['You said True, but it is false. The word "always" is wrong. "kaarawan" is Pambalana, so it uses a small letter, unless it is the first word of a sentence.', ''], tip:'Itanong: kahit kaninong kaarawan ba ito? Oo → Pambalana → maliit na titik.', tipEn:'Ask: can it be anyone&rsquo;s birthday? Yes → Pambalana → small letter.'},
      {q:'Alin ang tamang pagsulat ng pangalan ng bansa?', qen:'Which is the correct way to write the name of the country?', options:['pilipinas','Pilipinas'], correct:1, explain:'Tiyak na pangalan ng bansa, kaya malaking titik: Pilipinas.', en:'A country name is special, so it starts with a capital letter.', why:['Maliit ang "p" sa "pilipinas." Pangalan ito ng isang tiyak na bansa, kaya dapat malaki ang unang titik.', ''], whyEn:['The "p" in "pilipinas" is small. This is the name of one special country, so the first letter must be a capital.', ''], tip:'Pangalan ba ito ng isang tiyak na lugar? Kung oo, simulan sa malaking titik.', tipEn:'Is it the name of one special place? If yes, start it with a capital letter.'},
      {q:'Alin ang Pantangi?\n"Naglalaro ang mga bata sa Luneta Park."', qen:'Which word is Pantangi?', options:['bata','Luneta Park','naglalaro','mga'], correct:1, explain:'"Luneta Park" ay tiyak na pangalan ng lugar — Pantangi.', en:'Luneta Park is the name of one special place.', why:['Ang "bata" ay kahit sinong bata — Pambalana, hindi Pantangi.', '', 'Ang "naglalaro" ay ang ginagawa ng mga bata. Hindi ito pangalan ng tao, hayop, bagay, o lugar.', 'Ang "mga" ay hindi pangalan ng tao, hayop, bagay, o lugar. Kaya hindi ito Pantangi.'], whyEn:['"bata" (child) can be any child, so it is Pambalana, not Pantangi.', '', '"naglalaro" (playing) is what the children are doing. It is not the name of a person, animal, thing, or place.', '"mga" is not the name of a person, animal, thing, or place. So it is not Pantangi.'], tip:'Hanapin ang salitang may malaking titik na HINDI ang unang salita ng pangungusap.', tipEn:'Look for a word with a capital letter that is NOT the first word of the sentence.'},
      {q:'Alin ang tiyak na pangalan ng isang alagang aso?', qen:'Which one is the special name of a pet dog?', options:['aso','Bantay','pusa','kalabaw'], correct:1, explain:'"Bantay" ang pangalan ng aso — Pantangi. Ang "aso" ay Pambalana.', en:'Bantay is the dog name (Pantangi). "aso" just means dog (Pambalana).', why:['Ang "aso" ay kahit anong aso — Pambalana. Hindi ito sariling pangalan ng alaga.', '', 'Ang "pusa" ay uri ng hayop, hindi pangalan ng isang aso.', 'Ang "kalabaw" ay uri ng hayop, hindi pangalan ng isang aso.'], whyEn:['"aso" (dog) can be any dog, so it is Pambalana. It is not the pet&rsquo;s own name.', '', '"pusa" (cat) is a kind of animal, not the name of a dog.', '"kalabaw" (carabao) is a kind of animal, not the name of a dog.'], tip:'Ang sariling pangalan ng alaga ay may malaking titik. Hanapin ang salitang nagsisimula sa malaking titik.', tipEn:'A pet&rsquo;s own name has a capital letter. Look for the word that starts with a capital letter.'},
      {q:'Alin ang Pambalana?\n"Ang guro namin ay si Bb. Reyes."', qen:'Which word is Pambalana?', options:['Bb. Reyes','guro'], correct:1, explain:'"guro" — kahit sinong guro, kaya Pambalana. Ang "Bb. Reyes" ay Pantangi.', en:'guro (teacher) is common. Bb. Reyes is a special name.', why:['Ang "Bb. Reyes" ay isang tiyak na tao at may malaking titik — Pantangi iyan, hindi Pambalana.', ''], whyEn:['"Bb. Reyes" is one special person and has a capital letter. That is Pantangi, not Pambalana.', ''], tip:'Itanong: puwede bang kahit sino? Kahit sinong guro → Pambalana. Isang tiyak na tao → Pantangi.', tipEn:'Ask: can it be anyone? Any teacher → Pambalana. One special person → Pantangi.'},
      {q:'Tama o Mali: Nagsisimula sa malaking titik ang Pambalana kapag ito ang unang salita ng pangungusap.', qen:'True or False: A Pambalana word starts with a capital letter when it is the first word of the sentence.', options:['Tama','Mali'], correct:0, explain:'Tama — sa simula ng pangungusap, laging malaking titik. Pambalana pa rin ito.', en:'True. The first word of a sentence always gets a capital letter.', why:['', 'Pinili mo ang Mali, pero tama ito. Sa simula ng pangungusap, laging malaki ang unang titik — kahit Pambalana ang salita. Pambalana pa rin ito.'], whyEn:['', 'You said False, but it is true. The first word of a sentence always gets a capital letter, even if it is Pambalana. It is still Pambalana.'], tip:'Tandaan: ang malaking titik sa UNANG salita ay dahil sa simula ng pangungusap. Hindi ibig sabihin na Pantangi na ito.', tipEn:'Remember: a capital letter on the FIRST word is because the sentence starts there. It does not make the word Pantangi.'},
    ]
  },
  {
    id:'panghalip', emoji:'🙋', title:'Panghalip Panao at Pananong', subtitle:'Ako, Ikaw, Siya... Sino? Ano?',
    flashcards:[
      {icon:'🔁', term:'Panghalip', def:'Salitang IPINAPALIT sa pangngalan, para hindi paulit-ulit ang pangalan.\nHal: siya, ako, ito, tayo\n"SIYA ang aking Nanay."', en:'Panghalip = pronoun. A word we use INSTEAD of a name, so we do not repeat the name.'},
      {icon:'🙋', term:'Panghalip Panao', def:'Pamalit sa pangalan ng TAO.\nHal: ako, ikaw, siya, kami, tayo, sila', en:'Panao = replaces the name of a PERSON.\nLike: I, you, he/she, we, they.'},
      {icon:'1️⃣', term:'Unang Panauhan', def:'Ang NAGSASALITA.\nako, ko, akin, tayo, kami\n"AKO ay aalis mamayang gabi."', en:'1st person = the one SPEAKING. I, me, my, we.'},
      {icon:'2️⃣', term:'Ikalawang Panauhan', def:'Ang KINAKAUSAP.\nikaw, ka, mo, kayo, inyo\n"Kumusta KA?"', en:'2nd person = the one you are TALKING TO. You.'},
      {icon:'3️⃣', term:'Ikatlong Panauhan', def:'Ang PINAG-UUSAPAN.\nsiya, niya, sila, kanila\n"SILA ay naglalaro sa parke."', en:'3rd person = the one being TALKED ABOUT. He, she, they.'},
      {icon:'❓', term:'Panghalip na Pananong', def:'Ginagamit kapag NAGTATANONG.\nsino, ano, saan, kailan, ilan, bakit, paano\nLaging may tandang pananong (?) sa dulo.', en:'Question words. The sentence always ends with a question mark (?).'},
      {icon:'🗝️', term:'Ano ang Tinatanong?', def:'Sino → tao\nAno → bagay\nSaan → lugar\nKailan → araw o oras\nIlan → bilang\nBakit → dahilan\nPaano → paraan', en:'Sino = who. Ano = what. Saan = where. Kailan = when.\nIlan = how many. Bakit = why. Paano = how.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Tandaan ni Teacher:\nKung NAGTATANONG → Pananong\nKung pamalit sa pangalan ng TAO → Panao\n\nPara sa panauhan, itanong:\nNagsasalita? → Una\nKinakausap? → Ikalawa\nPinag-uusapan? → Ikatlo', en:'Asking a question = Pananong. Replacing a person name = Panao.\nThe speaker = 1st. The one you talk to = 2nd. The one you talk about = 3rd.'},
    ],
    quiz:[
      {q:'Anong panauhan ang "Kami"?\n"Kami ay maglalaro sa hardin."', qen:'Which person (panauhan) is "Kami"?', options:['Una','Ikalawa','Ikatlo'], correct:0, explain:'"Kami" — kasama ang nagsasalita. Unang Panauhan.', en:'Kami (we) includes the speaker, so it is 1st person.', why:['', 'Ang Ikalawa ay ang kinakausap (ikaw, kayo). Kasama ang nagsasalita sa "kami," kaya hindi ito Ikalawa.', 'Ang Ikatlo ay ang pinag-uusapan (siya, sila). Kasama ang nagsasalita sa "kami," kaya hindi ito Ikatlo.'], whyEn:['', '2nd person is the one you talk to (ikaw, kayo). "kami" includes the speaker, so it is not 2nd.', '3rd person is the one being talked about (siya, sila). "kami" includes the speaker, so it is not 3rd.'], tip:'Itanong: kasama ba ang nagsasalita? Kung oo (ako, kami, tayo) → Una.', tipEn:'Ask: is the speaker included? If yes (ako, kami, tayo) → 1st.'},
      {q:'Anong panauhan ang "kayo"?\n"Kumusta kayo?"', qen:'Which person (panauhan) is "kayo"?', options:['Una','Ikalawa','Ikatlo'], correct:1, explain:'"kayo" — ang mga kinakausap. Ikalawang Panauhan.', en:'kayo (you, more than one) are the ones being talked to. 2nd person.', why:['Ang Una ay ang nagsasalita (ako, kami). Ang "kayo" ay ang kinakausap, hindi ang nagsasalita.', '', 'Ang Ikatlo ay ang pinag-uusapan (siya, sila). Ang "kayo" ay kinakausap mo nang harapan.'], whyEn:['1st person is the speaker (ako, kami). "kayo" is the ones being talked to, not the speaker.', '', '3rd person is the one being talked about (siya, sila). "kayo" is the people you are talking to.'], tip:'Itanong: sino ang kausap ko? Ang ikaw, ka, mo, at kayo ay kinakausap → Ikalawa.', tipEn:'Ask: who am I talking to? ikaw, ka, mo, and kayo are the ones you talk to → 2nd.'},
      {q:'Anong panauhan ang "niya"?\n"Ginawa niya ang proyekto."', qen:'Which person (panauhan) is "niya"?', options:['Una','Ikalawa','Ikatlo'], correct:2, explain:'"niya" — ang pinag-uusapan. Ikatlong Panauhan.', en:'niya (he/she) is the one being talked about. 3rd person.', why:['Ang Una ay ang nagsasalita (ako, ko). Hindi nagsasalita ang "niya" — pinag-uusapan siya.', 'Ang Ikalawa ay ang kinakausap (ikaw, mo). Hindi kinakausap ang "niya" — pinag-uusapan siya.', ''], whyEn:['1st person is the speaker (ako, ko). "niya" is not speaking. We are talking about that person.', '2nd person is the one you talk to (ikaw, mo). "niya" is not being talked to. We are talking about that person.', ''], tip:'Itanong: pinag-uusapan lang ba ang tao? Siya, niya, sila, kanila → Ikatlo.', tipEn:'Ask: are we just talking ABOUT the person? siya, niya, sila, kanila → 3rd.'},
      {q:'Alin ang ginagamit kapag nagtatanong ng DAHILAN?', qen:'Which word do we use to ask for a REASON?', options:['Saan','Bakit','Sino','Kailan'], correct:1, explain:'"Bakit" ang tanong para sa dahilan.', en:'Bakit = why (reason).', why:['Ang "Saan" ay tanong para sa lugar, hindi para sa dahilan.', '', 'Ang "Sino" ay tanong para sa tao, hindi para sa dahilan.', 'Ang "Kailan" ay tanong para sa araw o oras, hindi para sa dahilan.'], whyEn:['"Saan" (where) asks about a place, not a reason.', '', '"Sino" (who) asks about a person, not a reason.', '"Kailan" (when) asks about a day or time, not a reason.'], tip:'Itugma ang tanong sa sagot: Sino → tao, Saan → lugar, Kailan → oras, Bakit → dahilan.', tipEn:'Match the question word to the answer: Sino → person, Saan → place, Kailan → time, Bakit → reason.'},
      {q:'Alin ang ginagamit kapag nagtatanong ng LUGAR?', qen:'Which word do we use to ask about a PLACE?', options:['Kailan','Saan','Ano','Bakit'], correct:1, explain:'"Saan" ang tanong para sa lugar.', en:'Saan = where (place).', why:['Ang "Kailan" ay tanong para sa araw o oras, hindi para sa lugar.', '', 'Ang "Ano" ay tanong para sa bagay, hindi para sa lugar.', 'Ang "Bakit" ay tanong para sa dahilan, hindi para sa lugar.'], whyEn:['"Kailan" (when) asks about a day or time, not a place.', '', '"Ano" (what) asks about a thing, not a place.', '"Bakit" (why) asks about a reason, not a place.'], tip:'Isipin ang magiging sagot. Kung LUGAR ang sagot (hal. "sa paaralan"), ang tanong ay "Saan."', tipEn:'Think of the answer. If the answer is a PLACE (like "at school"), the question word is "Saan."'},
      {q:'Anong panghalip na pananong ang bagay?\n"___ ka pupunta bukas?"', qen:'Which question word fits in the blank?', options:['Sino','Saan','Ilan','Ano'], correct:1, explain:'"Saan ka pupunta bukas?" — lugar ang tinatanong, kaya "Saan."', en:'It asks about a place, so Saan (where).', why:['Ang "Sino" ay nagtatanong ng tao. Pero ang tinatanong dito ay kung saan pupunta — lugar iyan.', '', 'Ang "Ilan" ay nagtatanong ng bilang. Hindi bilang ang tinatanong dito.', 'Ang "Ano" ay nagtatanong ng bagay. Ang pupuntahan ay lugar, hindi bagay.'], whyEn:['"Sino" (who) asks about a person. But this question asks where you will go. That is a place.', '', '"Ilan" (how many) asks about a number. This question is not about a number.', '"Ano" (what) asks about a thing. Where you go is a place, not a thing.'], tip:'Basahin nang malakas ang tanong. Isipin ang posibleng sagot: "Sa palengke." — lugar iyan, kaya "Saan."', tipEn:'Read the question out loud. Think of a possible answer: "Sa palengke" (to the market). That is a place, so "Saan."'},
      {q:'Tama o Mali: Ang "tayo" ay Unang Panauhan.', qen:'True or False: "tayo" is 1st person.', options:['Tama','Mali'], correct:0, explain:'Tama — kasama ang nagsasalita sa "tayo," kaya Unang Panauhan.', en:'True. tayo (we) includes the speaker.', why:['', 'Pinili mo ang Mali, pero tama ito. Kasama ang nagsasalita sa "tayo," kaya Unang Panauhan nga ito.'], whyEn:['', 'You said False, but it is true. "tayo" (we) includes the speaker, so it really is 1st person.'], tip:'Itanong: kasama ba ako (ang nagsasalita) sa "tayo"? Oo → Una.', tipEn:'Ask: am I (the speaker) part of "tayo"? Yes → 1st.'},
      {q:'Alin ang Ikatlong Panauhan?\n"Ibinigay ko sa kanila ang regalo."', qen:'Which word is 3rd person?', options:['ko','kanila'], correct:1, explain:'"kanila" — ang pinag-uusapan. Ang "ko" ay Unang Panauhan.', en:'kanila (them) = 3rd person. ko (I/my) = 1st person.', why:['Ang "ko" ay ang nagsasalita — Unang Panauhan, hindi Ikatlo.', ''], whyEn:['"ko" is the speaker. That is 1st person, not 3rd.', ''], tip:'Hanapin ang salitang tumutukoy sa pinag-uusapan, hindi sa nagsasalita. Kanila, siya, sila → Ikatlo.', tipEn:'Find the word for the people being talked about, not the speaker. kanila, siya, sila → 3rd.'},
      {q:'Ilan ang uri ng panghalip panao (ayon sa panauhan)?', qen:'How many kinds of panghalip panao did we learn (by panauhan)?', options:['2','3','4','5'], correct:1, explain:'Tatlo: Una, Ikalawa, at Ikatlong Panauhan.', en:'Three: 1st, 2nd, and 3rd person.', why:['Kulang ang 2. May Una, Ikalawa, at Ikatlo — tatlo sila.', '', 'Sobra ang 4. Una, Ikalawa, at Ikatlo lang — tatlo.', 'Sobra ang 5. Una, Ikalawa, at Ikatlo lang — tatlo.'], whyEn:['2 is too few. There is 1st, 2nd, and 3rd. That is three.', '', '4 is too many. Only 1st, 2nd, and 3rd. That is three.', '5 is too many. Only 1st, 2nd, and 3rd. That is three.'], tip:'Bilangin sa daliri: nagsasalita (1), kinakausap (2), pinag-uusapan (3).', tipEn:'Count on your fingers: the speaker (1), the one you talk to (2), the one you talk about (3).'},
      {q:'Alin ang HINDI panghalip na pananong?', qen:'Which one is NOT a question word?', options:['Paano','Ilan','tayo','Kailan'], correct:2, explain:'"tayo" ay panghalip panao. Ang "Paano," "Ilan," at "Kailan" ay pananong.', en:'tayo (we) is not a question word.', why:['Ang "Paano" ay pananong (para sa paraan), kaya hindi ito ang sagot. Hanapin ang HINDI pananong.', 'Ang "Ilan" ay pananong (para sa bilang), kaya hindi ito ang sagot. Hanapin ang HINDI pananong.', '', 'Ang "Kailan" ay pananong (para sa araw o oras), kaya hindi ito ang sagot. Hanapin ang HINDI pananong.'], whyEn:['"Paano" (how) is a question word, so it is not the answer. We need the one that is NOT a question word.', '"Ilan" (how many) is a question word, so it is not the answer. We need the one that is NOT a question word.', '', '"Kailan" (when) is a question word, so it is not the answer. We need the one that is NOT a question word.'], tip:'Tandaan ang mga pananong: sino, ano, saan, kailan, ilan, bakit, paano. Ang salitang wala sa listahan ang sagot.', tipEn:'Remember the question words: sino, ano, saan, kailan, ilan, bakit, paano. The word that is not on this list is the answer.'},
      {q:'Anong panghalip na pananong ang bagay?\n"___ ang gusto mong laruin?"', qen:'Which question word fits in the blank?', options:['Ano','Saan','Kailan','Bakit'], correct:0, explain:'"Ano ang gusto mong laruin?" — bagay ang tinatanong, kaya "Ano."', en:'It asks about a thing, so Ano (what).', why:['', 'Ang "Saan" ay para sa lugar. Ang gustong laruin ay bagay, hindi lugar.', 'Ang "Kailan" ay para sa araw o oras. Hindi oras ang tinatanong dito.', 'Ang "Bakit" ay para sa dahilan. Hindi dahilan ang tinatanong dito.'], whyEn:['', '"Saan" (where) is for a place. What you want to play with is a thing, not a place.', '"Kailan" (when) is for a day or time. This question is not about time.', '"Bakit" (why) is for a reason. This question is not asking for a reason.'], tip:'Isipin ang posibleng sagot: "Bola." — bagay iyan, kaya "Ano."', tipEn:'Think of a possible answer: "Bola" (a ball). That is a thing, so "Ano."'},
      {q:'Tama o Mali: Ang panghalip na pananong ay pamalit sa pangalan ng tao.', qen:'True or False: A question word replaces the name of a person.', options:['Tama','Mali'], correct:1, explain:'Mali — iyan ang PANAO. Ang PANANONG ay para sa pagtatanong.', en:'False. That is Panao. Pananong is for asking questions.', why:['Pinili mo ang Tama, pero mali ito. Ang "pamalit sa pangalan ng tao" ay ang PANAO. Ang pananong ay para sa pagtatanong.', ''], whyEn:['You said True, but it is false. "Replaces the name of a person" is PANAO. Pananong is for asking questions.', ''], tip:'Tandaan ang dalawang salita: PANAO → tao. PANANONG → tanong.', tipEn:'Remember the two words: PANAO → person. PANANONG → question.'},
    ]
  },
  {
    id:'magkatugma', emoji:'🎵', title:'Salitang Magkatugma', subtitle:'Rhyming Words',
    flashcards:[
      {icon:'🎵', term:'Salitang Magkatugma', def:'Mga salitang PAREHO (o halos pareho) ang TUNOG SA DULO.', en:'Rhyming words: words that sound the same at the END.'},
      {icon:'🐶', term:'Mga Halimbawa', def:'aso – oso\naraw – ilaw\nbahay – anay\nilog – talbog\nbangin – hangin\nlata – binata', en:'Say each pair out loud. Listen to the end sound.'},
      {icon:'🐢', term:'Halimbawa mula sa Klase', def:'pagong – gulong\nmais – walis\npatatas – gatas\nsapatos – kubyertos\nmata – bata', en:'More rhyming pairs from class.'},
      {icon:'📖', term:'Saan Ginagamit?', def:'Sa TULA at AWIT — para masaya at maganda pakinggan.\nSa BUGTONG at SALAWIKAIN — para madaling tandaan.', en:'Poems and songs: to make them fun to hear.\nRiddles and sayings: to make them easy to remember.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'1. Sabihin nang MALAKAS ang salita.\n2. Pakinggan ang DULO.\n3. Hanapin ang salitang pareho ang tunog sa dulo.\n\nHal: pata-TAS → ga-TAS ✔', en:'Say the word out loud. Listen to the END.\nFind the word with the same ending sound.\npatatas and gatas both end in "-tas".'},
    ],
    quiz:[
      {q:'Alin ang katugma ng "pagong"?', qen:'Which word rhymes with "pagong"?', options:['bato','gulong','bilang','mesa'], correct:1, explain:'pa-GONG, gu-LONG — parehong "-ong" ang dulo.', en:'Both end with the "-ong" sound.', why:['Ang "bato" ay nagtatapos sa "-to." Ang "pagong" ay "-ong."', '', 'Ang "bilang" ay nagtatapos sa "-ang," hindi "-ong." Malapit, pero iba ang tunog.', 'Ang "mesa" ay nagtatapos sa "-sa." Ang "pagong" ay "-ong."'], whyEn:['"bato" ends in "-to." "pagong" ends in "-ong."', '', '"bilang" ends in "-ang," not "-ong." It is close, but the sound is different.', '"mesa" ends in "-sa." "pagong" ends in "-ong."'], tip:'Sabihin nang malakas: pa-GONG. Hanapin ang salitang "-ong" din ang dulo.', tipEn:'Say it out loud: pa-GONG. Find the word that also ends in "-ong."'},
      {q:'Alin ang katugma ng "bangin"?', qen:'Which word rhymes with "bangin"?', options:['bundok','hangin','ilog','dagat'], correct:1, explain:'ba-NGIN, ha-NGIN — parehong "-ngin" ang dulo.', en:'Both end with "-ngin".', why:['Ang "bundok" ay nagtatapos sa "-ok," hindi "-ngin."', '', 'Ang "ilog" ay nagtatapos sa "-og," hindi "-ngin."', 'Ang "dagat" ay nagtatapos sa "-at," hindi "-ngin."'], whyEn:['"bundok" ends in "-ok," not "-ngin."', '', '"ilog" ends in "-og," not "-ngin."', '"dagat" ends in "-at," not "-ngin."'], tip:'Sabihin ang huling pantig: ba-NGIN. Aling salita ang may "-ngin" din sa dulo?', tipEn:'Say the last part: ba-NGIN. Which word also has "-ngin" at the end?'},
      {q:'Alin ang katugma ng "araw"?', qen:'Which word rhymes with "araw"?', options:['puno','ilaw','bahay','tubig'], correct:1, explain:'a-RAW, i-LAW — parehong "-aw" ang dulo.', en:'Both end with "-aw".', why:['Ang "puno" ay nagtatapos sa "-no," hindi "-aw."', '', 'Ang "bahay" ay nagtatapos sa "-ay." Malapit, pero "-aw" ang dulo ng "araw."', 'Ang "tubig" ay nagtatapos sa "-ig," hindi "-aw."'], whyEn:['"puno" ends in "-no," not "-aw."', '', '"bahay" ends in "-ay." It is close, but "araw" ends in "-aw."', '"tubig" ends in "-ig," not "-aw."'], tip:'Pakinggan ang pinakahuling tunog ng "araw" at ng bawat pagpipilian. Dapat pareho ang dulo, hindi ang simula.', tipEn:'Listen to the very last sound of "araw" and of each choice. The endings must match, not the beginnings.'},
      {q:'Alin ang katugma ng "lata"?', qen:'Which word rhymes with "lata"?', options:['bakal','binata','yero','garapon'], correct:1, explain:'L-ATA, bin-ATA — parehong "-ata" ang dulo.', en:'Both end with "-ata".', why:['Kaugnay ng lata ang "bakal," pero "-al" ang dulo nito. Ang tugma ay tungkol sa tunog, hindi sa kahulugan.', '', 'Ang "yero" ay nagtatapos sa "-ro," hindi "-ata."', 'Ang "garapon" ay nagtatapos sa "-on," hindi "-ata."'], whyEn:['"bakal" (iron) goes with a can, but it ends in "-al." Rhyming is about sound, not meaning.', '', '"yero" ends in "-ro," not "-ata."', '"garapon" (jar) ends in "-on," not "-ata."'], tip:'Huwag tingnan ang kahulugan. Pakinggan lang ang tunog sa dulo ng bawat salita.', tipEn:'Do not think about the meaning. Just listen to the sound at the end of each word.'},
      {q:'Alin ang katugma ng "tubig"?', qen:'Which word rhymes with "tubig"?', options:['ilog','umiibig','karagatan','bundok'], correct:1, explain:'tu-BIG, umii-BIG — parehong "-ig" ang dulo.', en:'Both end with "-ig".', why:['May tubig ang ilog, pero "-og" ang dulo ng "ilog." Ang "tubig" ay "-ig."', '', 'Ang "karagatan" ay nagtatapos sa "-an," hindi "-ig."', 'Ang "bundok" ay nagtatapos sa "-ok," hindi "-ig."'], whyEn:['A river has water, but "ilog" ends in "-og." "tubig" ends in "-ig."', '', '"karagatan" (ocean) ends in "-an," not "-ig."', '"bundok" (mountain) ends in "-ok," not "-ig."'], tip:'Tunog ang hanapin, hindi kahulugan. Sabihin: tu-BIG. Anong salita ang "-ig" din ang dulo?', tipEn:'Look for the sound, not the meaning. Say: tu-BIG. Which word also ends in "-ig"?'},
      {q:'Alin ang HINDI katugma ng iba?\nbahay, anay, palay, kalabaw', qen:'Which word does NOT rhyme with the others?', options:['bahay','anay','palay','kalabaw'], correct:3, explain:'"-ay" ang dulo ng bahay, anay, at palay. Ang "kalabaw" ay "-aw" — iba ang tunog.', en:'kalabaw ends in "-aw". The others end in "-ay".', why:['Ang "bahay" ay "-ay," pareho ng anay at palay. Magkatugma sila, kaya hindi ito ang sagot.', 'Ang "anay" ay "-ay," pareho ng bahay at palay. Magkatugma sila, kaya hindi ito ang sagot.', 'Ang "palay" ay "-ay," pareho ng bahay at anay. Magkatugma sila, kaya hindi ito ang sagot.', ''], whyEn:['"bahay" ends in "-ay," like anay and palay. They rhyme, so it is not the answer.', '"anay" ends in "-ay," like bahay and palay. They rhyme, so it is not the answer.', '"palay" ends in "-ay," like bahay and anay. They rhyme, so it is not the answer.', ''], tip:'Sabihin nang malakas ang lahat. Tatlo ang pareho ang dulo. Ang iisang naiiba ang sagot.', tipEn:'Say all of them out loud. Three have the same ending. The one that is different is the answer.'},
      {q:'Alin ang HINDI katugma ng iba?\nilog, talbog, sunog, kahoy', qen:'Which word does NOT rhyme with the others?', options:['ilog','talbog','sunog','kahoy'], correct:3, explain:'"-og" ang dulo ng ilog, talbog, at sunog. Ang "kahoy" ay "-oy" — iba ang tunog.', en:'kahoy ends in "-oy". The others end in "-og".', why:['Ang "ilog" ay "-og," pareho ng talbog at sunog. Magkatugma sila, kaya hindi ito ang sagot.', 'Ang "talbog" ay "-og," pareho ng ilog at sunog. Magkatugma sila, kaya hindi ito ang sagot.', 'Ang "sunog" ay "-og," pareho ng ilog at talbog. Magkatugma sila, kaya hindi ito ang sagot.', ''], whyEn:['"ilog" ends in "-og," like talbog and sunog. They rhyme, so it is not the answer.', '"talbog" ends in "-og," like ilog and sunog. They rhyme, so it is not the answer.', '"sunog" ends in "-og," like ilog and talbog. They rhyme, so it is not the answer.', ''], tip:'Tingnan ang huling dalawang titik ng bawat salita: -og, -og, -og, -oy. Alin ang naiiba?', tipEn:'Look at the last two letters of each word: -og, -og, -og, -oy. Which one is different?'},
      {q:'Tama o Mali: Magkatugma ang "aso" at "oso" dahil magkatunog ang dulo nila.', qen:'True or False: "aso" and "oso" rhyme because their endings sound the same.', options:['Tama','Mali'], correct:0, explain:'Tama — parehong "-so" ang dulo.', en:'True. Both end with "-so".', why:['', 'Pinili mo ang Mali, pero tama ito. Pakinggan: a-SO, o-SO. Parehong "-so" ang dulo, kaya magkatugma sila.'], whyEn:['', 'You said False, but it is true. Listen: a-SO, o-SO. Both end in "-so," so they rhyme.'], tip:'Puwedeng magkaiba ang simula (a at o). Ang DULO lang ang tingnan.', tipEn:'The beginnings can be different (a and o). Only check the END.'},
      {q:'Saan karaniwang ginagamit ang mga salitang magkatugma?', qen:'Where are rhyming words usually used?', options:['Sa tula at awit','Sa listahan ng gamit','Sa talaan ng petsa','Sa mapa'], correct:0, explain:'Ginagamit ang tugma sa tula, awit, bugtong, at salawikain.', en:'In poems, songs, riddles, and sayings.', why:['', 'Pagtatala lang ng mga gamit ang listahan. Hindi ito kasama sa natutunan natin: tula, awit, bugtong, at salawikain.', 'Pagtatala lang ng mga petsa ang talaan. Hindi ito kasama sa natutunan natin: tula, awit, bugtong, at salawikain.', 'Ang mapa ay hindi kasama sa natutunan natin. Ginagamit ang tugma sa tula, awit, bugtong, at salawikain.'], whyEn:['', 'A list of things just writes things down. It is not one of the places we learned: poems, songs, riddles, and sayings.', 'A list of dates just writes dates down. It is not one of the places we learned: poems, songs, riddles, and sayings.', 'A map is not one of the places we learned. Rhymes are used in poems, songs, riddles, and sayings.'], tip:'Isipin kung saan masaya pakinggan ang mga salita: sa tula at awit!', tipEn:'Think of where words are fun to hear: in poems and songs!'},
      {q:'Bakit may tugma ang bugtong at salawikain?', qen:'Why do riddles and sayings use rhymes?', options:['Para madaling tandaan','Para mahirap unawain','Para humaba ang tula at awit','Para walang salita'], correct:0, explain:'Ang tugma ay nagpapadali sa pagtanda ng bugtong at salawikain.', en:'Rhymes make them easy to remember.', why:['', 'Kabaligtaran ito. Ang tugma ay nagpapadali, hindi nagpapahirap.', 'Hindi pampahaba ang tugma. Ginagamit ito para madaling tandaan ang bugtong at salawikain.', 'Kailangan ng salita para magkaroon ng tugma. Hindi ito ang dahilan.'], whyEn:['', 'This is the opposite. Rhymes make things easier, not harder.', 'Rhymes are not used to make things longer. They make riddles and sayings easy to remember.', 'You need words to make a rhyme. This is not the reason.'], tip:'Tandaan: tula at awit → masaya pakinggan. Bugtong at salawikain → madaling tandaan.', tipEn:'Remember: poems and songs → fun to hear. Riddles and sayings → easy to remember.'},
      {q:'Alin ang magkatugmang pares?', qen:'Which pair rhymes?', options:['patatas – gatas','patatas – mesa','patatas – bola','patatas – tubig'], correct:0, explain:'pata-TAS, ga-TAS — parehong "-tas" ang dulo.', en:'Both end with "-tas".', why:['', 'Ang "mesa" ay nagtatapos sa "-sa," hindi "-tas."', 'Ang "bola" ay nagtatapos sa "-la," hindi "-tas."', 'Ang "tubig" ay nagtatapos sa "-ig," hindi "-tas."'], whyEn:['', '"mesa" ends in "-sa," not "-tas."', '"bola" ends in "-la," not "-tas."', '"tubig" ends in "-ig," not "-tas."'], tip:'Sabihin ang dulo ng "patatas": "-tas." Hanapin ang kapares na "-tas" din ang dulo.', tipEn:'Say the end of "patatas": "-tas." Find the partner word that also ends in "-tas."'},
      {q:'Tama o Mali: Magkatugma ang dalawang salita kapag pareho ang UNANG pantig nila.', qen:'True or False: Two words rhyme when their FIRST syllable is the same.', options:['Tama','Mali'], correct:1, explain:'Mali — ang DULO ang dapat magkatunog, hindi ang simula.', en:'False. The END must sound the same, not the beginning.', why:['Pinili mo ang Tama, pero mali ito. Ang salitang "UNANG" ang mali. Ang DULO ang dapat magkatunog, hindi ang simula.', ''], whyEn:['You said True, but it is false. The word "FIRST" is wrong. The END must sound the same, not the beginning.', ''], tip:'Tandaan: tugma = tunog sa DULO. Gaya ng aso at oso — iba ang simula, pareho ang dulo.', tipEn:'Remember: rhyme = the sound at the END. Like aso and oso: different starts, same ending.'},
    ]
  },
  {
    id:'panguri', emoji:'🎨', title:'Pang-uri at Pangungusap na Paturol', subtitle:'Mga Salitang Naglalarawan',
    flashcards:[
      {icon:'🎨', term:'Pang-uri', def:'Salitang NAGLALARAWAN sa tao, hayop, bagay, o lugar.\nHal: "MATAMIS ang saging."', en:'Pang-uri = adjective. A describing word.'},
      {icon:'🌈', term:'Mga Uri ng Pang-uri (1)', def:'KULAY — pula, asul, dilaw, berde\nHUGIS — bilog, parisukat, tatsulok, pahaba\nLAKI — malaki, maliit, matangkad, pandak\nBILANG — isa, dalawa, tatlo, sampu', en:'Kulay = color. Hugis = shape. Laki = size. Bilang = number.'},
      {icon:'🍬', term:'Mga Uri ng Pang-uri (2)', def:'KATANGIAN — mabait, masipag, matalino, malinis\nLASA — matamis, maasim, maalat, mapait\nAMOY — mabango, mabaho', en:'Katangian = trait (how a person or thing is). Lasa = taste. Amoy = smell.'},
      {icon:'📝', term:'Pangungusap na Paturol', def:'NAGSASABI ng impormasyon o katotohanan.\nLaging nagtatapos sa TULDOK (.)\nHal: "Masarap ang mangga."', en:'A telling sentence. It gives information and ends with a period (.).'},
      {icon:'🚫', term:'HINDI Paturol', def:'"Saan ka pupunta?" — nagtatanong (?)\n"Isara mo ang bintana." — nag-uutos\n"Ang ganda!" — may (!)', en:'These are NOT paturol: asking a question, giving a command, or a sentence with (!).'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Uri ng pang-uri — itanong:\nAnong KULAY? HUGIS? LAKI? ILAN?\nAnong UGALI? LASA? AMOY?\n\nPaturol ba? Nagsasabi lang at may TULDOK (.)? → Paturol!', en:'Ask: What color? shape? size? how many? what trait? what taste? what smell?\nPaturol: it just tells something and ends with a period.'},
    ],
    quiz:[
      {q:'Anong uri ng pang-uri ang "Bilog"?\n"Bilog ang bola."', qen:'What kind of describing word is "Bilog" (round)?', options:['Kulay','Hugis','Laki','Bilang'], correct:1, explain:'"Bilog" — hugis iyan. Pang-uring Hugis.', en:'Round is a shape.', why:['Ang Kulay ay gaya ng pula, asul, at dilaw. Hindi kulay ang "bilog."', '', 'Ang Laki ay gaya ng malaki, maliit, at matangkad. Hindi sukat ang "bilog," kundi hugis.', 'Ang Bilang ay gaya ng isa, dalawa, at tatlo. Hindi bilang ang "bilog."'], whyEn:['Kulay (color) is like red, blue, and yellow. "bilog" (round) is not a color.', '', 'Laki (size) is like big, small, and tall. "bilog" is not a size. It is a shape.', 'Bilang (number) is like one, two, and three. "bilog" is not a number.'], tip:'Itanong ang bawat uri: Anong KULAY? Anong HUGIS? Kung ang sagot ay "bilog," hugis iyan.', tipEn:'Ask each kind: What COLOR? What SHAPE? If the answer is "round," it is a shape.'},
      {q:'Anong uri ng pang-uri ang "Matangkad"?\n"Matangkad ang puno sa likod-bahay."', qen:'What kind of describing word is "Matangkad" (tall)?', options:['Laki','Kulay','Lasa','Amoy'], correct:0, explain:'"Matangkad" — laki iyan. Pang-uring Laki.', en:'Tall is about size.', why:['', 'Ang Kulay ay gaya ng pula at dilaw. Hindi kulay ang "matangkad."', 'Ang Lasa ay natitikman, gaya ng matamis at maalat. Hindi natitikman ang pagiging matangkad.', 'Ang Amoy ay naaamoy, gaya ng mabango at mabaho. Hindi naaamoy ang pagiging matangkad.'], whyEn:['', 'Kulay (color) is like red and yellow. "matangkad" (tall) is not a color.', 'Lasa (taste) is something you taste, like sweet and salty. You cannot taste "tall."', 'Amoy (smell) is something you smell, like fragrant and smelly. You cannot smell "tall."'], tip:'Itanong: gaano kalaki o kataas? Kung tungkol sa taas o sukat, Laki iyan.', tipEn:'Ask: how big or how tall? If it is about height or size, it is Laki.'},
      {q:'Anong uri ng pang-uri ang "Maalat"?\n"Maalat ang sabaw ng sinigang."', qen:'What kind of describing word is "Maalat" (salty)?', options:['Amoy','Lasa','Katangian','Hugis'], correct:1, explain:'"Maalat" — lasa iyan. Pang-uring Lasa.', en:'Salty is a taste.', why:['Ang Amoy ay naaamoy ng ilong, gaya ng mabango. Ang "maalat" ay natitikman ng dila.', '', 'Ang Katangian ay ugali, gaya ng mabait at masipag. Hindi ugali ang "maalat."', 'Ang Hugis ay gaya ng bilog at tatsulok. Hindi hugis ang "maalat."'], whyEn:['Amoy (smell) is what your nose smells, like fragrant. "maalat" (salty) is what your tongue tastes.', '', 'Katangian (trait) is how a person is, like kind and hardworking. "maalat" is not a trait.', 'Hugis (shape) is like round and triangle. "maalat" is not a shape.'], tip:'Itanong: natitikman ba ito ng dila? Kung oo, Lasa iyan.', tipEn:'Ask: can your tongue taste it? If yes, it is Lasa.'},
      {q:'Anong uri ng pang-uri ang "Tatlong"?\n"Tatlong pusa ang natutulog sa sopa."', qen:'What kind of describing word is "Tatlong" (three)?', options:['Bilang','Laki','Kulay','Hugis'], correct:0, explain:'"Tatlong" — ilan? Tatlo. Pang-uring Bilang.', en:'Three is a number.', why:['', 'Ang Laki ay malaki o maliit. Ang "tatlo" ay nagsasabi kung ILAN, hindi kung gaano kalaki.', 'Ang Kulay ay gaya ng pula at asul. Hindi kulay ang "tatlo."', 'Ang Hugis ay gaya ng bilog at parisukat. Hindi hugis ang "tatlo."'], whyEn:['', 'Laki (size) is big or small. "tatlo" (three) tells HOW MANY, not how big.', 'Kulay (color) is like red and blue. "tatlo" is not a color.', 'Hugis (shape) is like round and square. "tatlo" is not a shape.'], tip:'Itanong: ILAN? Kung ang sagot ay isa, dalawa, o tatlo — Bilang iyan.', tipEn:'Ask: HOW MANY? If the answer is one, two, or three, it is Bilang.'},
      {q:'Anong uri ng pang-uri ang "Masipag"?\n"Masipag mag-aral ang mga estudyante."', qen:'What kind of describing word is "Masipag" (hardworking)?', options:['Katangian','Bilang','Lasa','Hugis'], correct:0, explain:'"Masipag" — ugali iyan. Pang-uring Katangian.', en:'Hardworking is a trait (how a person is).', why:['', 'Ang Bilang ay isa, dalawa, tatlo. Hindi bilang ang "masipag."', 'Ang Lasa ay natitikman, gaya ng matamis. Hindi natitikman ang pagiging masipag.', 'Ang Hugis ay gaya ng bilog at tatsulok. Hindi hugis ang "masipag."'], whyEn:['', 'Bilang (number) is one, two, three. "masipag" (hardworking) is not a number.', 'Lasa (taste) is something you taste, like sweet. You cannot taste "hardworking."', 'Hugis (shape) is like round and triangle. "masipag" is not a shape.'], tip:'Itanong: ugali ba ito ng tao, gaya ng mabait o matalino? Kung oo, Katangian iyan.', tipEn:'Ask: is it how a person is, like kind or smart? If yes, it is Katangian.'},
      {q:'Anong uri ng pang-uri ang "Mabaho"?\n"Mabaho ang basura sa labas."', qen:'What kind of describing word is "Mabaho" (smelly)?', options:['Amoy','Lasa','Kulay','Bilang'], correct:0, explain:'"Mabaho" — amoy iyan. Pang-uring Amoy.', en:'Smelly is about smell.', why:['', 'Ang Lasa ay natitikman ng dila. Ang "mabaho" ay naaamoy ng ilong.', 'Ang Kulay ay gaya ng pula at berde. Hindi kulay ang "mabaho."', 'Ang Bilang ay isa, dalawa, tatlo. Hindi bilang ang "mabaho."'], whyEn:['', 'Lasa (taste) is what your tongue tastes. "mabaho" (smelly) is what your nose smells.', 'Kulay (color) is like red and green. "mabaho" is not a color.', 'Bilang (number) is one, two, three. "mabaho" is not a number.'], tip:'Itanong: naaamoy ba ito ng ilong? Mabango o mabaho → Amoy.', tipEn:'Ask: can your nose smell it? Fragrant or smelly → Amoy.'},
      {q:'Alin ang pangungusap na PATUROL?', qen:'Which one is a TELLING sentence (paturol)?', options:['"Ilan ang bola mo?"','"Pakisara mo ang pinto ng silid."','"Malinis ang paaralan namin."','"Sino ang guro mo?"'], correct:2, explain:'"Malinis ang paaralan namin." — nagsasabi at may tuldok (.). Paturol!', en:'It tells information and ends with a period.', why:['Nagtatanong ito at may tandang pananong (?). Hindi ito paturol.', 'Nag-uutos ito — may ipinagagawa sa iyo. Hindi ito paturol.', '', 'Nagtatanong ito at may tandang pananong (?). Hindi ito paturol.'], whyEn:['It asks a question and has a question mark (?). It is not paturol.', 'It gives a command. It asks you to do something. It is not paturol.', '', 'It asks a question and has a question mark (?). It is not paturol.'], tip:'Tingnan ang dulo: may tuldok (.) ba? Tapos itanong: nagsasabi lang ba, o nag-uutos? Ang nagsasabi lang ang Paturol.', tipEn:'Look at the end: is there a period (.)? Then ask: does it just tell something, or give a command? Only the one that just tells is Paturol.'},
      {q:'Alin ang HINDI pangungusap na paturol?', qen:'Which one is NOT a telling sentence?', options:['"Maganda ang bulaklak."','"Nagluto si Nanay ng ulam."','"Saan ka nakatira?"','"Malamig ang tubig sa gripo."'], correct:2, explain:'"Saan ka nakatira?" ay nagtatanong (may ?), kaya hindi paturol.', en:'It asks a question, so it is not paturol.', why:['Nagsasabi ito at may tuldok (.) — paturol ito, kaya hindi ito ang sagot. Hanapin ang HINDI paturol.', 'Nagsasabi ito at may tuldok (.) — paturol ito, kaya hindi ito ang sagot. Hanapin ang HINDI paturol.', '', 'Nagsasabi ito at may tuldok (.) — paturol ito, kaya hindi ito ang sagot. Hanapin ang HINDI paturol.'], whyEn:['It tells something and ends with a period (.). It IS paturol, so it is not the answer. We need the one that is NOT.', 'It tells something and ends with a period (.). It IS paturol, so it is not the answer. We need the one that is NOT.', '', 'It tells something and ends with a period (.). It IS paturol, so it is not the answer. We need the one that is NOT.'], tip:'Tingnan ang dulo ng bawat pangungusap. Ang may tandang pananong (?) ay HINDI paturol.', tipEn:'Look at the end of each sentence. The one with a question mark (?) is NOT paturol.'},
      {q:'Anong uri ng pang-uri ang "Dilaw"?\n"Dilaw ang saging na hinog."', qen:'What kind of describing word is "Dilaw" (yellow)?', options:['Kulay','Hugis','Laki','Amoy'], correct:0, explain:'"Dilaw" — kulay iyan. Pang-uring Kulay.', en:'Yellow is a color.', why:['', 'Ang Hugis ay gaya ng bilog at tatsulok. Hindi hugis ang "dilaw."', 'Ang Laki ay gaya ng malaki at maliit. Hindi sukat ang "dilaw."', 'Ang Amoy ay gaya ng mabango at mabaho. Hindi naaamoy ang "dilaw."'], whyEn:['', 'Hugis (shape) is like round and triangle. "dilaw" (yellow) is not a shape.', 'Laki (size) is like big and small. "dilaw" is not a size.', 'Amoy (smell) is like fragrant and smelly. You cannot smell "yellow."'], tip:'Itanong: Anong KULAY? Kung ang sagot ay pula, asul, dilaw, o berde — Kulay iyan.', tipEn:'Ask: What COLOR? If the answer is red, blue, yellow, or green, it is Kulay.'},
      {q:'Tama o Mali: Ang pang-uri ay naglalarawan ng kulay, hugis, laki, bilang, katangian, lasa, at amoy.', qen:'True or False: A pang-uri can describe color, shape, size, number, trait, taste, and smell.', options:['Tama','Mali'], correct:0, explain:'Tama — pitong uri ang natutunan natin.', en:'True. We learned 7 kinds.', why:['', 'Pinili mo ang Mali, pero tama ito. Lahat ng pitong uri ay nasa pangungusap: kulay, hugis, laki, bilang, katangian, lasa, at amoy.'], whyEn:['', 'You said False, but it is true. All 7 kinds are in the sentence: color, shape, size, number, trait, taste, and smell.'], tip:'Bilangin sa daliri ang pitong uri: kulay, hugis, laki, bilang, katangian, lasa, amoy. Tingnan kung may kulang o sobra sa pangungusap.', tipEn:'Count the 7 kinds on your fingers: color, shape, size, number, trait, taste, smell. Check if the sentence has anything missing or extra.'},
      {q:'Alin ang pang-uri para sa HUGIS?\n"___ ang tela na binili ni Nanay."', qen:'Which describing word tells the SHAPE?', options:['Pahaba','Matamis','Pula','Isa'], correct:0, explain:'"Pahaba" — hugis iyan. Ang matamis ay lasa, pula ay kulay, isa ay bilang.', en:'Pahaba (long shape) is a shape.', why:['', 'Ang "matamis" ay lasa, hindi hugis.', 'Ang "pula" ay kulay, hindi hugis.', 'Ang "isa" ay bilang, hindi hugis.'], whyEn:['', '"matamis" (sweet) is a taste, not a shape.', '"pula" (red) is a color, not a shape.', '"isa" (one) is a number, not a shape.'], tip:'Basahin ang salitang HUGIS sa tanong. Tandaan ang mga hugis: bilog, parisukat, tatsulok, pahaba.', tipEn:'Read the word SHAPE in the question. Remember the shapes: round, square, triangle, long.'},
      {q:'Tama o Mali: Ang pangungusap na paturol ay nagtatapos sa tandang padamdam (!).', qen:'True or False: A telling sentence ends with an exclamation point (!).', options:['Tama','Mali'], correct:1, explain:'Mali — TULDOK (.) ang dulo ng paturol.', en:'False. It ends with a period (.).', why:['Pinili mo ang Tama, pero mali ito. Ang "tandang padamdam (!)" ang mali. Tuldok (.) ang dulo ng paturol.', ''], whyEn:['You said True, but it is false. The "exclamation point (!)" part is wrong. A paturol sentence ends with a period (.).', ''], tip:'Tandaan: Paturol = nagsasabi + tuldok (.). Ang may (!) ay hindi paturol.', tipEn:'Remember: Paturol = it tells + a period (.). A sentence with (!) is not paturol.'},
    ]
  },
  {
    id:'pandiwa', emoji:'🏃', title:'Pandiwa', subtitle:'Mga Salitang Kumikilos',
    flashcards:[
      {icon:'🏃', term:'Pandiwa', def:'Salitang nagsasabi ng KILOS o GALAW — ang GINAGAWA.\nSa Ingles: verb.', en:'Pandiwa = verb. An action word. It tells what someone is DOING.'},
      {icon:'🍽️', term:'Mga Halimbawa', def:'kumakain, tumatakbo, tumatalon, naglalakad, naglilinis', en:'eating, running, jumping, walking, cleaning'},
      {icon:'🏞️', term:'Sa Pangungusap', def:'"TUMATAKBO si Ben sa palaruan."\n"KUMAKAIN ng almusal ang mga bata."\n"NAGBABASA si Liza ng aklat."', en:'The word in BIG letters is the action word (pandiwa).'},
      {icon:'❓', term:'Tanong na Sinasagot', def:'Sinasagot ng pandiwa ang tanong:\n"ANO ANG GINAGAWA?"', en:'A verb answers the question: "What is someone doing?"'},
      {icon:'🔤', term:'Mga Panlapi', def:'Madalas may nag-, um-, ma-, o -in ang pandiwa.\nHal: NAG-lalaro, t-UM-atakbo', en:'Many verbs have these word parts: nag-, um-, ma-, -in.'},
      {icon:'🌧️', term:'Kilos, Galaw, o Estado', def:'Ang pandiwa ay nagsasabi ng kilos, galaw, o ESTADO — hindi lang kilos.', en:'A verb can tell an action, a movement, or a state (something happening).'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Laro ni Teacher: "Stand up, Sit down!"\nKaya mo bang GAWIN ang salita?\n\nOO → PANDIWA (kumakain, tumatakbo, umaawit)\nHINDI → hindi pandiwa (lapis, bola, ulam, kahon)', en:'Can you DO or act out the word?\nYes = verb. No = not a verb (pencil, ball, food, box).'},
    ],
    quiz:[
      {q:'Alin ang pandiwa?\n"Naglilinis si Ate ng bahay."', qen:'Which word is the verb (action word)?', options:['Ate','bahay','Naglilinis'], correct:2, explain:'"Naglilinis" — iyan ang ginagawa ni Ate. Pandiwa!', en:'Naglilinis (cleaning) is the action.', why:['Si Ate ay tao — siya ang gumagawa, pero hindi siya ang kilos.', 'Ang "bahay" ay bagay o lugar. Hindi mo ito magagawa, kaya hindi kilos.', ''], whyEn:['Ate is a person. She is the one doing it, but she is not the action.', '"bahay" (house) is a thing or place. You cannot do it, so it is not an action.', ''], tip:'Itanong: ANO ANG GINAGAWA ni Ate? Ang sagot ang pandiwa.', tipEn:'Ask: WHAT IS Ate DOING? The answer is the verb.'},
