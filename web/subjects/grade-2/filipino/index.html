      {q:'Alin ang pandiwa?\n"Sumasayaw ang mga bata sa entablado."', qen:'Which word is the verb (action word)?', options:['bata','Sumasayaw','entablado'], correct:1, explain:'"Sumasayaw" — iyan ang ginagawa ng mga bata.', en:'Sumasayaw (dancing) is the action.', why:['Ang "bata" ay tao, hindi kilos. Sila ang gumagawa ng kilos.', '', 'Ang "entablado" ay lugar kung saan sila sumasayaw. Hindi ito kilos.'], whyEn:['"bata" (children) are people, not an action. They are the ones doing the action.', '', '"entablado" (stage) is the place where they dance. It is not an action.'], tip:'Laro ni Teacher: kaya mo bang GAWIN ang salita? Subukan ang bawat pagpipilian.', tipEn:'Teacher&rsquo;s game: can you DO the word? Try each choice.'},
      {q:'Anong tanong ang sinasagot ng pandiwa?', qen:'What question does a verb answer?', options:['Sino?','Ano ang ginagawa?','Ilan?','Ano ang kulay nito?'], correct:1, explain:'Sinasagot ng pandiwa ang "Ano ang ginagawa?"', en:'"What is someone doing?"', why:['Ang "Sino?" ay para sa tao, hindi para sa kilos.', '', 'Ang "Ilan?" ay para sa bilang, hindi para sa kilos.', 'Ang "Ano ang kulay nito?" ay para sa pang-uring kulay, hindi para sa kilos.'], whyEn:['"Sino?" (Who?) is for a person, not for an action.', '', '"Ilan?" (How many?) is for a number, not for an action.', '"What color is it?" is for a color describing word, not for an action.'], tip:'Tandaan: pandiwa = kilos. Ang kilos ay sagot sa "Ano ang ginagawa?"', tipEn:'Remember: verb = action. An action answers "What is someone doing?"'},
      {q:'Alin ang pandiwa?', qen:'Which one is a verb?', options:['masaya','umiiyak','payong','maganda'], correct:1, explain:'"umiiyak" — kaya mong gawin iyan. Kilos, kaya pandiwa.', en:'umiiyak (crying) is an action.', why:['Ang "masaya" ay naglalarawan ng damdamin. Hindi ito kilos na ginagawa.', '', 'Ang "payong" ay bagay. Hindi mo ito magagawa.', 'Ang "maganda" ay naglalarawan. Hindi ito kilos.'], whyEn:['"masaya" (happy) describes a feeling. It is not an action you do.', '', '"payong" (umbrella) is a thing. You cannot do it.', '"maganda" (beautiful) is a describing word. It is not an action.'], tip:'Subukang umarte ang bawat salita. Ang kaya mong gawin ay pandiwa.', tipEn:'Try to act out each word. The one you can do is the verb.'},
      {q:'Alin ang HINDI pandiwa?', qen:'Which one is NOT a verb?', options:['lumalangoy','tumutugtog','aklat','sumusulat'], correct:2, explain:'"aklat" ay bagay (pangngalan). Hindi mo ito magagawa — hindi kilos.', en:'aklat (book) is a thing, not an action.', why:['Ang "lumalangoy" ay kilos — pandiwa ito, kaya hindi ito ang sagot. Hanapin ang HINDI pandiwa.', 'Ang "tumutugtog" ay kilos — pandiwa ito, kaya hindi ito ang sagot. Hanapin ang HINDI pandiwa.', '', 'Ang "sumusulat" ay kilos — pandiwa ito, kaya hindi ito ang sagot. Hanapin ang HINDI pandiwa.'], whyEn:['"lumalangoy" (swimming) is an action. It IS a verb, so it is not the answer. We need the one that is NOT.', '"tumutugtog" (playing music) is an action. It IS a verb, so it is not the answer. We need the one that is NOT.', '', '"sumusulat" (writing) is an action. It IS a verb, so it is not the answer. We need the one that is NOT.'], tip:'Hanapin ang salitang HINDI mo magagawa. Kadalasan, bagay iyon, gaya ng lapis o bola.', tipEn:'Find the word you CANNOT do. Usually it is a thing, like a pencil or a ball.'},
      {q:'Alin ang pandiwang bagay sa patlang?\n"___ ng tubig ang halaman tuwing umaga."', qen:'Which verb fits in the blank?', options:['Dinidiligan','Pinakamalago','Halaman','Umaga'], correct:0, explain:'"Dinidiligan" — iyan ang ginagawa sa halaman.', en:'Dinidiligan (watering) is the action.', why:['', 'Ang "Pinakamalago" ay naglalarawan, hindi kilos. Hindi ito ginagawa sa halaman.', 'Ang "Halaman" ay bagay na nasa pangungusap na. Hindi ito kilos.', 'Ang "Umaga" ay oras, hindi kilos.'], whyEn:['', '"Pinakamalago" (most lush) is a describing word, not an action. It is not something done to the plant.', '"Halaman" (plant) is a thing that is already in the sentence. It is not an action.', '"Umaga" (morning) is a time, not an action.'], tip:'Basahin ang pangungusap kasama ang bawat pagpipilian. Hanapin ang salitang GINAGAWA sa halaman.', tipEn:'Read the sentence with each choice. Find the word that tells what is DONE to the plant.'},
      {q:'Tama o Mali: Ang pandiwa ay maaari ring magsabi ng estado, hindi lang kilos.', qen:'True or False: A verb can also tell a state, not only an action.', options:['Tama','Mali'], correct:0, explain:'Tama — kilos, galaw, o estado.', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Ang pandiwa ay kilos, galaw, o ESTADO — hindi lang kilos.'], whyEn:['', 'You said False, but it is true. A verb can be an action, a movement, or a STATE. Not only an action.'], tip:'Tandaan ang tatlo: kilos, galaw, estado. Gaya ng "Umuulan" — nangyayari ito, at pandiwa pa rin.', tipEn:'Remember the three: action, movement, state. Like "Umuulan" (raining): it is happening, and it is still a verb.'},
      {q:'Aling panlapi ang MADALAS makita sa pandiwa?', qen:'Which word part is OFTEN found in verbs?', options:['taga-','nag-','pang-','ika-'], correct:1, explain:'"nag-" ay isa sa mga panlapi ng pandiwa (nag-, um-, ma-, -in). Hal: naglalaro.', en:'nag- is often in verbs, like naglalaro (playing).', why:['Hindi kasama ang "taga-" sa mga panlapi ng pandiwa na natutunan natin: nag-, um-, ma-, -in.', '', 'Hindi kasama ang "pang-" sa mga panlapi ng pandiwa na natutunan natin: nag-, um-, ma-, -in.', 'Hindi kasama ang "ika-" sa mga panlapi ng pandiwa na natutunan natin: nag-, um-, ma-, -in.'], whyEn:['"taga-" is not one of the verb parts we learned: nag-, um-, ma-, -in.', '', '"pang-" is not one of the verb parts we learned: nag-, um-, ma-, -in.', '"ika-" is not one of the verb parts we learned: nag-, um-, ma-, -in.'], tip:'Tandaan ang apat: nag-, um-, ma-, -in. Isipin: NAG-lalaro, t-UM-atakbo.', tipEn:'Remember the four: nag-, um-, ma-, -in. Think: NAG-lalaro, t-UM-atakbo.'},
      {q:'Alin ang pandiwa?\n"Umuulan nang malakas kagabi."', qen:'Which word is the verb?', options:['Umuulan','malakas','kagabi'], correct:0, explain:'"Umuulan" — iyan ang nangyayari. Pandiwa.', en:'Umuulan (raining) is what is happening.', why:['', 'Ang "malakas" ay naglalarawan kung paano umuulan. Hindi ito ang nangyayari.', 'Ang "kagabi" ay oras — kung kailan nangyari. Hindi ito kilos.'], whyEn:['', '"malakas" (hard) describes how it rains. It is not what is happening.', '"kagabi" (last night) is a time. It tells when. It is not an action.'], tip:'Itanong: ANO ANG NANGYAYARI? Ang sagot ang pandiwa, kahit estado ito gaya ng pag-ulan.', tipEn:'Ask: WHAT IS HAPPENING? The answer is the verb, even if it is a state like raining.'},
      {q:'Ilan ang pandiwa sa pangungusap?\n"Kumakain at umiinom ang mga bata."', qen:'How many verbs are in the sentence?', options:['1','2','3','0'], correct:1, explain:'Dalawa: "Kumakain" at "umiinom."', en:'Two: kumakain (eating) and umiinom (drinking).', why:['Isa lang ang nabilang mo. Baka "Kumakain" lang ang nakita mo. Kilos din ang "umiinom." 1 + 1 = 2.', '', 'Sobra ang 3. Baka binilang mo ang "bata." Tao ang bata, hindi kilos. Kumakain + umiinom = 2.', 'May pandiwa rito: "Kumakain" at "umiinom." Kaya mong gawin ang dalawa.'], whyEn:['You counted only one. Maybe you saw only "Kumakain." "umiinom" (drinking) is an action too. 1 + 1 = 2.', '', '3 is too many. Maybe you counted "bata." Children are people, not an action. Kumakain + umiinom = 2.', 'There are verbs here: "Kumakain" (eating) and "umiinom" (drinking). You can do both.'], tip:'Ituro ang bawat salita at itanong: kaya ko bang gawin ito? Bilangin ang mga OO.', tipEn:'Point at each word and ask: can I do this? Count the YES words.'},
      {q:'Alin ang pandiwang bubuo sa pangungusap?\n"___ si Tatay ng bagong sasakyan."', qen:'Which verb completes the sentence?', options:['Bumili','Malaki','Masaya','Sasakyan'], correct:0, explain:'"Bumili" — iyan ang ginawa ni Tatay.', en:'Bumili (bought) is the action.', why:['', 'Ang "Malaki" ay naglalarawan ng laki, hindi kilos.', 'Ang "Masaya" ay naglalarawan ng damdamin, hindi kilos.', 'Ang "Sasakyan" ay bagay, at nasa pangungusap na ito.'], whyEn:['', '"Malaki" (big) describes size. It is not an action.', '"Masaya" (happy) describes a feeling. It is not an action.', '"Sasakyan" (car) is a thing, and it is already in the sentence.'], tip:'Itanong: ANO ANG GINAWA ni Tatay? Basahin nang malakas kasama ang bawat pagpipilian.', tipEn:'Ask: WHAT DID Tatay DO? Read it out loud with each choice.'},
      {q:'Tama o Mali: Pandiwa lahat ang "tumatakbo," "kumakain," at "naglalaro."', qen:'True or False: "tumatakbo," "kumakain," and "naglalaro" are all verbs.', options:['Tama','Mali'], correct:0, explain:'Tama — lahat sila ay kilos.', en:'True. They are all actions.', why:['', 'Pinili mo ang Mali, pero tama ito. Kaya mong tumakbo, kumain, at maglaro — lahat sila ay kilos.'], whyEn:['', 'You said False, but it is true. You can run, eat, and play. They are all actions.'], tip:'Subukan ang bawat salita sa laro ni Teacher: kaya ko bang gawin? Kung OO lahat, Tama.', tipEn:'Try each word in Teacher&rsquo;s game: can I do it? If all are YES, it is True.'},
    ]
  },
  {
    id:'intonasyon', emoji:'🎤', title:'Wastong Intonasyon at Diin', subtitle:'Tinig, Bigkas, at Damdamin',
    flashcards:[
      {icon:'📈', term:'Intonasyon', def:'Ang PAGTAAS at PAGBABA ng boses kapag nagsasalita.\nIba ang tunog ng boses kapag nagtatanong, nagsasabi, o nag-uutos.', en:'Intonation = your voice going UP and DOWN when you talk.'},
      {icon:'🗣️', term:'Mga Halimbawa sa Klase', def:'"Magandang umaga!" → masigla, masaya\n"Ikaw ba ay kakain na?" → nagtatanong, PABABA ang boses sa dulo\n"Tumigil ka!" → galit, PATAAS ang boses', en:'Happy greeting = lively voice.\nAsking a question = voice goes DOWN at the end (as taught in class).\nAngry = voice goes UP.'},
      {icon:'🔊', term:'Diin', def:'Ang LAKAS o BIGAT sa pagbigkas ng isang pantig o salita.\nKapag mali ang diin, maaaring MAG-IBA ang kahulugan!', en:'Diin = stress. Saying one part of the word stronger.\nWrong stress can change the meaning!'},
      {icon:'🐢', term:'Malumay', def:'Dahan-dahan ang bigkas.\nWALANG tuldik.\nHal: bahay, aso, guro', en:'Pronounced slowly and gently. No accent mark.'},
      {icon:'⚡', term:'Mabilis', def:'Mabilis ang bigkas.\nMay tuldik na PAHILIS ( ´ )\nHal: banál, takbó', en:'Pronounced quickly, with an acute accent ( ´ ).'},
      {icon:'🌙', term:'Maragsa', def:'Mabilis ang bigkas at may IMPIT sa huling pantig.\nMay tuldik na PAKUPYA ( ˆ )\nHal: sabî', en:'Pronounced quickly with a glottal stop (a quick stop in the throat) on the last syllable.\nIt has a circumflex accent ( ˆ ), like a little roof.'},
      {icon:'😊', term:'Ekspresyon', def:'Pagpapakita ng DAMDAMIN:\ntuwa, lungkot, galit, takot', en:'Expression = showing feelings: happy, sad, angry, scared.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Tingnan ang tuldik:\nWalang tuldik → MALUMAY\n´ (pahilis) → MABILIS\nˆ (pakupya, parang bubong) → MARAGSA\n\nEkspresyon: Kung ikaw iyan, ano ang mararamdaman mo?', en:'No mark = Malumay. ´ = Mabilis. ˆ (like a roof) = Maragsa.\nFor feelings: imagine it happened to you. How would you feel?'},
    ],
    quiz:[
      {q:'Ayon sa aralin, ano ang boses sa dulo ng tanong na ito?\n"Ikaw ba ay kakain na?"', qen:'According to the lesson, what does the voice do at the end of this question?', options:['Pababa sa dulo','Pataas dahil galit','Walang tunog','Pabulong'], correct:0, explain:'Ayon sa aralin ni Teacher, kapag nagtatanong, PABABA ang boses sa dulo.', en:'In class: when asking a question, the voice goes DOWN at the end.', why:['', 'Ang pataas na boses ay para sa galit, gaya ng "Tumigil ka!" Hindi galit ang tanong na ito.', 'May boses kapag nagtatanong. Hindi ito walang tunog.', 'Hindi pabulong ang itinuro. Ayon sa aralin, pababa ang boses sa dulo ng tanong.'], whyEn:['', 'A rising voice is for anger, like "Tumigil ka!" (Stop it!). This question is not angry.', 'We use our voice when we ask. It is not silent.', 'Whispering is not what we learned. The lesson says the voice goes down at the end of a question.'], tip:'Tandaan ang itinuro ni Teacher: tanong → pababa ang boses sa dulo. Galit → pataas.', tipEn:'Remember what Teacher taught: question → voice goes down at the end. Angry → voice goes up.'},
      {q:'Anong bigkas ang may tuldik na pahilis ( ´ )?', qen:'Which kind has the ´ mark (pahilis)?', options:['Malumay','Mabilis','Maragsa','Ekspresyon'], correct:1, explain:'MABILIS — may tuldik na pahilis ( ´ ), gaya ng "takbó."', en:'Mabilis has the ´ mark.', why:['Ang Malumay ay walang tuldik.', '', 'Ang Maragsa ay may tuldik na pakupya ( ˆ ), parang bubong.', 'Ang Ekspresyon ay pagpapakita ng damdamin, hindi tuldik.'], whyEn:['Malumay has no accent mark.', '', 'Maragsa has the pakupya mark ( ˆ ), like a little roof.', 'Ekspresyon is showing feelings. It is not an accent mark.'], tip:'Tingnan ang hugis ng tuldik: ´ (pahilis) → Mabilis. ˆ (parang bubong) → Maragsa.', tipEn:'Look at the shape of the mark: ´ (slanted) → Mabilis. ˆ (like a roof) → Maragsa.'},
      {q:'Anong bigkas ang may impit sa huling pantig at tuldik na pakupya ( ˆ )?', qen:'Which kind has a glottal stop on the last syllable and the ˆ mark (pakupya)?', options:['Malumay','Mabilis','Maragsa','Ekspresyon'], correct:2, explain:'MARAGSA — may impit sa huling pantig at tuldik na pakupya ( ˆ ).', en:'Maragsa has the ˆ mark.', why:['Ang Malumay ay dahan-dahan at walang tuldik.', 'Ang Mabilis ay may pahilis ( ´ ), hindi pakupya.', '', 'Ang Ekspresyon ay pagpapakita ng damdamin, hindi tuldik.'], whyEn:['Malumay is said slowly and has no mark.', 'Mabilis has the slanted mark ( ´ ), not the roof mark.', '', 'Ekspresyon is showing feelings. It is not an accent mark.'], tip:'Hanapin ang clue na "impit" at "( ˆ )." Parang bubong ang ˆ — Maragsa iyan.', tipEn:'Look for the clues "glottal stop" and "( ˆ )." The ˆ looks like a roof. That is Maragsa.'},
      {q:'Anong boses ang karaniwang ginagamit dito?\n"Tumigil ka!"', qen:'What kind of voice is usually used here?', options:['Pataas dahil sa galit','Pababa at mahina','Walang tunog','Laging malumanay at pabulong'], correct:0, explain:'Galit ang "Tumigil ka!" kaya PATAAS ang boses.', en:'Angry = the voice goes up.', why:['', 'Galit ang "Tumigil ka!" kaya hindi mahina at hindi pababa ang boses.', 'Kailangang marinig ang utos na ito, kaya may boses.', 'Hindi malumanay ang galit. Pataas ang boses kapag galit.'], whyEn:['', '"Tumigil ka!" (Stop it!) is angry, so the voice is not soft and does not go down.', 'This command must be heard, so there is a voice.', 'Anger is not gentle. The voice goes up when angry.'], tip:'Isipin ang damdamin: galit ba? May (!) ba? Galit → pataas ang boses.', tipEn:'Think about the feeling: is it angry? Is there a (!)? Angry → the voice goes up.'},
      {q:'Aling salita ang binibigkas nang MABILIS (may ´)?', qen:'Which word is said the MABILIS way (has ´)?', options:['bahay','takbó','guro','aso'], correct:1, explain:'"takbó" — may ´, kaya Mabilis. Ang bahay, guro, at aso ay walang tuldik (Malumay).', en:'takbó has the ´ mark.', why:['Walang tuldik ang "bahay," kaya Malumay ito, hindi Mabilis.', '', 'Walang tuldik ang "guro," kaya Malumay ito, hindi Mabilis.', 'Walang tuldik ang "aso," kaya Malumay ito, hindi Mabilis.'], whyEn:['"bahay" has no mark, so it is Malumay, not Mabilis.', '', '"guro" has no mark, so it is Malumay, not Mabilis.', '"aso" has no mark, so it is Malumay, not Mabilis.'], tip:'Hanapin ang salitang may maliit na guhit ( ´ ) sa ibabaw ng titik.', tipEn:'Look for the word with a small slanted line ( ´ ) on top of a letter.'},
      {q:'Ano ang maaaring mangyari kapag mali ang diin?', qen:'What can happen if the stress (diin) is wrong?', options:['Wala itong anumang epekto sa salita','Maaaring mag-iba ang kahulugan','Lalakas ang boses','Bibilis ang pagbasa'], correct:1, explain:'Kapag mali ang diin, maaaring mag-iba ang kahulugan ng salita.', en:'The meaning of the word can change.', why:['May epekto ang diin. Kapag mali ito, maaaring mag-iba ang kahulugan.', '', 'Ang diin ay lakas sa isang pantig. Pero ang tanong ay kung ano ang nangyayari kapag MALI ito — maaaring mag-iba ang kahulugan.', 'Hindi ito ang itinuro. Kapag mali ang diin, maaaring mag-iba ang kahulugan.'], whyEn:['Stress does matter. When it is wrong, the meaning can change.', '', 'Stress is saying one part stronger. But the question asks what happens when it is WRONG: the meaning can change.', 'This is not what we learned. When the stress is wrong, the meaning can change.'], tip:'Tandaan ang babala sa flashcard: mali ang diin → maaaring mag-iba ang kahulugan!', tipEn:'Remember the warning on the flashcard: wrong stress → the meaning can change!'},
      {q:'Anong ekspresyon ang bagay?\n"Wala na ang aking alagang aso."', qen:'Which feeling fits?', options:['Tuwa','Lungkot','Galit','Takot'], correct:1, explain:'Nawala ang alagang aso — LUNGKOT.', en:'Losing a pet dog = sad.', why:['Masaya ang Tuwa. Hindi masaya ang mawalan ng alaga.', '', 'Walang nagalit dito. Nawala lang ang alagang aso.', 'Walang nakakatakot dito. Malungkot ang mawalan ng alaga.'], whyEn:['Tuwa is happy. Losing a pet is not happy.', '', 'Nobody is angry here. The pet dog is just gone.', 'Nothing scary is here. Losing a pet is sad.'], tip:'Isipin: kung ikaw ang nawalan ng alagang aso, ano ang mararamdaman mo?', tipEn:'Imagine: if you lost your pet dog, how would you feel?'},
      {q:'Anong ekspresyon ang bagay?\n"Binilhan ako ni ate ng bagong laruan."', qen:'Which feeling fits?', options:['Tuwa','Lungkot','Galit','Takot'], correct:0, explain:'May bagong laruan — TUWA.', en:'Getting a new toy = happy.', why:['', 'Walang nakalulungkot sa pagtanggap ng bagong laruan.', 'Walang dahilan para magalit — binilhan ka pa ng laruan.', 'Hindi nakakatakot ang bagong laruan.'], whyEn:['', 'Nothing is sad about getting a new toy.', 'There is no reason to be angry. Someone even bought you a toy.', 'A new toy is not scary.'], tip:'Isipin kung ikaw ang binilhan ng laruan. Ngingiti ka ba? Tuwa iyan!', tipEn:'Imagine someone bought YOU a toy. Would you smile? That is Tuwa!'},
      {q:'Tama o Mali: Ang ekspresyon ay ang pagbibigay-lakas sa isang pantig ng salita.', qen:'True or False: "Ekspresyon" means saying one part of a word stronger.', options:['Tama','Mali'], correct:1, explain:'Mali — iyan ang DIIN. Ang ekspresyon ay pagpapakita ng damdamin.', en:'False. That is diin (stress). Ekspresyon = showing feelings.', why:['Pinili mo ang Tama, pero mali ito. Ang pagbibigay-lakas sa isang pantig ay DIIN. Ang ekspresyon ay pagpapakita ng damdamin.', ''], whyEn:['You said True, but it is false. Saying one part stronger is DIIN (stress). Ekspresyon is showing feelings.', ''], tip:'Paghiwalayin ang dalawa: DIIN → lakas ng pantig. EKSPRESYON → damdamin (tuwa, lungkot, galit, takot).', tipEn:'Keep the two apart: DIIN → a stronger syllable. EKSPRESYON → feelings (happy, sad, angry, scared).'},
      {q:'Ano ang kahulugan ng "intonasyon"?', qen:'What does "intonasyon" mean?', options:['Pagtaas at pagbaba ng boses','Bilang ng mga pantig sa isang salita','Uri ng pangngalan','Kahulugan ng salita'], correct:0, explain:'Ang intonasyon ay ang pagtaas at pagbaba ng boses kapag nagsasalita.', en:'Your voice going up and down.', why:['', 'Hindi ito ang intonasyon. Ang intonasyon ay tungkol sa boses.', 'Ang uri ng pangngalan ay Pambalana at Pantangi — ibang aralin iyan.', 'Hindi kahulugan ng salita ang intonasyon. Tungkol ito sa pagtaas at pagbaba ng boses.'], whyEn:['', 'This is not intonation. Intonation is about your voice.', 'The kinds of nouns are Pambalana and Pantangi. That is a different lesson.', 'Intonation is not the meaning of a word. It is about your voice going up and down.'], tip:'Isipin ang boses mo kapag masaya, nagtatanong, o galit — nagbabago ang taas at baba nito. Iyan ang intonasyon.', tipEn:'Think of your voice when you are happy, asking, or angry. It goes up and down. That is intonation.'},
      {q:'Anong ekspresyon ang bagay?\n"Ay! May daga sa ilalim ng mesa!"', qen:'Which feeling fits?', options:['Tuwa','Lungkot','Galit','Takot'], correct:3, explain:'Biglang may daga — TAKOT.', en:'A sudden mouse = scared.', why:['Hindi masaya ang biglang makakita ng daga. May "Ay!" pa na parang nagulat.', 'Walang nawala o nasaktan dito. Nagulat at natakot ang nagsasalita.', 'Hindi galit ang "Ay!" dito. Biglang nakita ang daga, kaya takot.', ''], whyEn:['Seeing a mouse suddenly is not happy. The "Ay!" shows surprise.', 'Nothing was lost or hurt here. The speaker was surprised and scared.', 'The "Ay!" here is not angry. The mouse appeared suddenly, so it is fear.', ''], tip:'Hanapin ang clue: "Ay!" at biglang nangyari. Isipin kung ikaw iyan — matatakot ka ba?', tipEn:'Look for the clues: "Ay!" and something sudden. Imagine it is you. Would you be scared?'},
      {q:'Tama o Mali: Malumay ang salitang binibigkas nang dahan-dahan at walang tuldik.', qen:'True or False: Malumay is said slowly and has no accent mark.', options:['Tama','Mali'], correct:0, explain:'Tama — iyan ang Malumay. Hal: bahay, aso, guro.', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Dahan-dahan at walang tuldik ang Malumay, gaya ng bahay, aso, at guro.'], whyEn:['', 'You said False, but it is true. Malumay is said slowly and has no mark, like bahay, aso, and guro.'], tip:'Tandaan: walang tuldik → Malumay. May ´ → Mabilis. May ˆ → Maragsa.', tipEn:'Remember: no mark → Malumay. Has ´ → Mabilis. Has ˆ → Maragsa.'},
    ]
  },
  {
    id:'kwento', emoji:'📖', title:'Maikling Kwento at Tampok na Akda', subtitle:'Tauhan, Tagpuan, Pangyayari',
    flashcards:[
      {icon:'📖', term:'Maikling Kwento', def:'• Maikli at mabilis basahin\n• May SIMULA, GITNA, at WAKAS\n• May isang SULIRANIN (problema)\n• May mga TAUHAN', en:'A short story: it is short, has a beginning, middle, and end, one problem, and characters.'},
      {icon:'🧑', term:'Tauhan', def:'Ang mga GUMAGANAP sa kuwento. Sagot sa "SINO?"\n"Si Ana ay isang masipag at mabait na mag-aaral."\nTauhan: Si Ana', en:'Tauhan = characters. The people or animals in the story. Answers "Who?"'},
      {icon:'🗺️', term:'Tagpuan', def:'Kung SAAN at KAILAN nangyari ang kuwento.\n"Tuwing umaga, pumapasok si Ben sa paaralan."\nSaan? Sa paaralan. Kailan? Tuwing umaga.', en:'Tagpuan = setting. WHERE and WHEN the story happened.'},
      {icon:'🔁', term:'Simula, Gitna, Wakas', def:'SIMULA — makikilala ang tauhan at tagpuan.\n"Pumasok si Lito sa paaralan kasama ang ina."\nGITNA — ang suliranin.\n"Naiwan ni Lito ang baunan sa bahay."\nWAKAS — nalulutas ang suliranin.\n"Dinala ng ina ang baunan sa paaralan."', en:'Beginning = meet the characters and place.\nMiddle = the problem.\nEnd = the problem is solved.'},
      {icon:'🦁', term:'Ang Leon at ang Daga', def:'Tauhan: ang leon at ang daga.\nKinagat ng daga ang lubid para mapalaya ang leon.\nAral: Huwag maliitin ang iba — kahit maliit ay makatutulong.', en:'The mouse bit the rope to free the lion.\nLesson: do not look down on others. Even small ones can help.'},
      {icon:'📜', term:'Akda', def:'Isinulat o inisip ng isang tao. May kaisipan, pangyayari, o aral.\nMaaaring: ALAMAT, KUWENTO, o TULA.', en:'Akda = a written work. It can be a legend (alamat), a story (kuwento), or a poem (tula).'},
      {icon:'🌱', term:'Alamat', def:'Nagsasabi kung PAANO NAGSIMULA ang isang bagay, halaman, hayop, lugar, o pangalan.\nHal: Ang Alamat ng Pinya', en:'Alamat = legend. It tells HOW something began.'},
      {icon:'🍍', term:'Ang Alamat ng Pinya', def:'Laging nagpapahanap si Pina sa kaniyang ina. Nainis ang ina at nasabing sana magkaroon si Pina ng maraming mata. Nawala si Pina, at may lumitaw na halamang maraming "mata" — ang pinya.\nAral: Maging masipag at huwag agad umasa sa iba.', en:'Pina always asked her mother to find things. Her mother wished Pina had many eyes. The pineapple has many "eyes."\nLesson: work hard and do not depend on others right away.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Sa bawat kuwento, hanapin:\nSINO? → tauhan\nSAAN / KAILAN? → tagpuan\nANO ang problema? → gitna\nPAANO nalutas? → wakas\nANO ang natutunan? → aral', en:'For any story, ask: Who? Where and when? What is the problem? How was it solved? What is the lesson?'},
    ],
    quiz:[
      {q:'Sino-sino ang mga tauhan sa kuwento?', qen:'Who are the characters in the story?', options:['Ang langgam at ang tipaklong','Ang pagong at ang liyebre','Ang leon at ang daga','Ang magsasaka at ang kaniyang kalabaw'], correct:0, explain:'Ang mga tauhan ay ang langgam at ang tipaklong.', en:'The ant and the grasshopper.', passage:true, why:['', 'Wala ang pagong at ang liyebre sa kuwentong binasa. Basahin muli ang kuwento.', 'Ibang kuwento ang "Ang Leon at ang Daga." Hindi sila ang nasa kuwentong ito.', 'Walang magsasaka o kalabaw sa kuwentong binasa.'], whyEn:['', 'The turtle and the hare are not in this story. Read the story again.', '"The Lion and the Mouse" is a different story. They are not in this story.', 'There is no farmer or carabao in this story.'], tip:'Itanong: SINO ang nasa kuwento? Hanapin ang mga hayop na paulit-ulit na lumalabas sa kuwento.', tipEn:'Ask: WHO is in the story? Look for the animals that keep showing up in the story.'},
      {q:'Saan nangyari ang kuwento?', qen:'Where did the story happen?', options:['Sa ilalim ng punong-kahoy','Sa ilog','Sa loob ng isang malaking paaralan','Sa bahay'], correct:0, explain:'Nangyari ang kuwento sa ilalim ng punong-kahoy.', en:'Under a tree.', passage:true, why:['', 'Walang ilog sa kuwento. Basahin muli kung saan umaawit ang tipaklong.', 'Walang paaralan sa kuwentong ito.', 'Hindi bahay ang tagpuan. Basahin muli kung saan umaawit ang tipaklong.'], whyEn:['', 'There is no river in the story. Read again where the grasshopper was singing.', 'There is no school in this story.', 'The setting is not a house. Read again where the grasshopper was singing.'], tip:'Itanong: SAAN? Hanapin sa kuwento ang salitang "sa" na sinusundan ng lugar.', tipEn:'Ask: WHERE? Look in the story for the word "sa" followed by a place.'},
      {q:'Ano ang suliranin ng tipaklong nang dumating ang tag-ulan?', qen:'What problem did the grasshopper have when the rainy season came?', options:['Wala itong pagkain','Nawalan ito ng bahay','Nasaktan ito','Naligaw ito'], correct:0, explain:'Nang dumating ang tag-ulan, wala nang pagkain ang tipaklong.', en:'It had no food.', passage:true, why:['', 'Walang sinabing nawalan ng bahay ang tipaklong. Pagkain ang wala sa kaniya.', 'Hindi nasaktan ang tipaklong sa kuwento.', 'Hindi naligaw ang tipaklong. Pagkain ang kaniyang problema.'], whyEn:['', 'The story never says the grasshopper lost its home. It had no food.', 'The grasshopper did not get hurt in the story.', 'The grasshopper did not get lost. Food was its problem.'], tip:'Hanapin sa kuwento ang bahaging "Nang dumating ang tag-ulan." Doon makikita ang problema.', tipEn:'Find the part of the story that says "When the rainy season came." The problem is there.'},
      {q:'Paano nalutas ang suliranin sa wakas?', qen:'How was the problem solved at the end?', options:['Ibinahagi ng langgam ang pagkain sa tipaklong','Umalis ang tipaklong at naghanap ng ibang punong-kahoy','Umiyak ang langgam','Walang nangyari'], correct:0, explain:'Ibinahagi ng langgam ang kaniyang pagkain sa tipaklong.', en:'The ant shared its food.', passage:true, why:['', 'Hindi umalis ang tipaklong. Ang langgam ang tumulong sa kaniya.', 'Hindi umiyak ang langgam. Ibinahagi nito ang pagkain.', 'May nangyari sa wakas: tumulong ang langgam sa tipaklong.'], whyEn:['', 'The grasshopper did not leave. The ant helped it.', 'The ant did not cry. It shared its food.', 'Something did happen at the end: the ant helped the grasshopper.'], tip:'Itanong: PAANO nalutas ang problema? Basahin ang huling bahagi ng kuwento.', tipEn:'Ask: HOW was the problem solved? Read the last part of the story.'},
      {q:'Ano ang aral ng kuwento?', qen:'What is the lesson of the story?', options:['Mahalaga ang paghahanda at pagiging masipag','Huwag kumain nang marami','Laging matulog sa umaga','Huwag magtiwala sa sinumang kaibigan o kapitbahay'], correct:0, explain:'Natuto ang tipaklong na maging masipag. Mahalaga ang paghahanda at pagiging masipag.', en:'Be ready and work hard.', passage:true, why:['', 'Hindi tungkol sa pagkain nang marami ang kuwento. Tungkol ito sa paghahanda.', 'Walang natutulog sa kuwento. Hindi ito ang aral.', 'Kabaligtaran ito — tumulong pa ang langgam sa tipaklong.'], whyEn:['', 'The story is not about eating a lot. It is about getting ready.', 'Nobody sleeps in the story. This is not the lesson.', 'This is the opposite. The ant even helped the grasshopper.'], tip:'Itanong: ANO ang natutunan ng tauhan sa wakas? Doon makikita ang aral.', tipEn:'Ask: WHAT did the character learn at the end? That is where the lesson is.'},
      {q:'Anong bahagi ng kuwento ito?\n"Napansin ni Lito na naiwan niya ang kaniyang baunan sa bahay."', qen:'Which part of the story is this?', options:['Simula','Gitna','Wakas'], correct:1, explain:'Ito ang suliranin (problema), kaya GITNA.', en:'This is the problem, so it is the Middle.', why:['Sa Simula, makikilala pa lang ang tauhan at tagpuan. Pero dito, may problema na — naiwan ang baunan.', '', 'Sa Wakas, nalulutas ang problema. Hindi pa ito nalulutas dito — naiwan pa ang baunan.'], whyEn:['At the Beginning, we just meet the characters and the place. But here there is already a problem: the lunchbox was left behind.', '', 'At the End, the problem is solved. It is not solved yet here. The lunchbox is still at home.'], tip:'Itanong: may PROBLEMA ba? Problema → Gitna. Nalutas na → Wakas.', tipEn:'Ask: is there a PROBLEM? Problem → Middle. Already solved → End.'},
      {q:'Anong bahagi ng kuwento ito?\n"Dinala ng kaniyang ina ang baunan niya sa paaralan."', qen:'Which part of the story is this?', options:['Simula','Gitna','Wakas'], correct:2, explain:'Nalutas na ang problema, kaya WAKAS.', en:'The problem is solved, so it is the End.', why:['Sa Simula, ipinakikilala pa lang si Lito. Dito, nalutas na ang problema.', 'Ang Gitna ay ang problema. Dito, nalutas na ang problema dahil dinala ng ina ang baunan.', ''], whyEn:['At the Beginning, we just meet Lito. Here, the problem is already solved.', 'The Middle is the problem. Here the problem is already solved, because his mother brought the lunchbox.', ''], tip:'Itanong: nalutas na ba ang problema? Kung oo, Wakas iyan.', tipEn:'Ask: is the problem solved now? If yes, it is the End.'},
      {q:'Tama o Mali: Sa SIMULA ng kuwento, ipinakikilala ang mga tauhan at tagpuan.', qen:'True or False: At the BEGINNING, we meet the characters and the setting.', options:['Tama','Mali'], correct:0, explain:'Tama — sa Simula makikilala ang tauhan at tagpuan.', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Sa Simula talaga ipinakikilala ang tauhan at tagpuan, gaya ni Lito na pumasok sa paaralan.'], whyEn:['', 'You said False, but it is true. The Beginning really is where we meet the characters and the setting, like Lito going to school.'], tip:'Tandaan ang ayos: Simula → tauhan at tagpuan. Gitna → problema. Wakas → nalutas.', tipEn:'Remember the order: Beginning → characters and setting. Middle → problem. End → solved.'},
      {q:'Sa "Ang Leon at ang Daga," ano ang ginawa ng daga para matulungan ang leon?', qen:'In "The Lion and the Mouse," what did the mouse do to help the lion?', options:['Kinagat ang lubid','Tumakbo palayo','Umawit','Natulog sa tabi ng leon buong araw'], correct:0, explain:'Kinagat ng daga ang lubid para mapalaya ang leon.', en:'The mouse bit the rope to free the lion.', why:['', 'Hindi tumakbo palayo ang daga. Tumulong siya sa leon.', 'Hindi umawit ang daga. Kinagat niya ang lubid.', 'Hindi natulog ang daga. Kinagat niya ang lubid para mapalaya ang leon.'], whyEn:['', 'The mouse did not run away. It helped the lion.', 'The mouse did not sing. It bit the rope.', 'The mouse did not sleep. It bit the rope to free the lion.'], tip:'Isipin ang problema ng leon: kailangan niyang mapalaya. Ano ang ginawa ng daga para mangyari iyon?', tipEn:'Think about the lion&rsquo;s problem: it needed to be set free. What did the mouse do to make that happen?'},
      {q:'Ano ang aral ng "Ang Leon at ang Daga"?', qen:'What is the lesson of "The Lion and the Mouse"?', options:['Huwag maliitin ang iba — kahit maliit ay makatutulong','Laging matulog nang maaga','Huwag tumulong sa iba','Ang malalaki at malalakas lang ang may kakayahang tumulong'], correct:0, explain:'Huwag maliitin ang iba, dahil kahit maliit ay maaaring makatulong.', en:'Do not look down on others. Even small ones can help.', why:['', 'Walang tungkol sa pagtulog sa kuwento.', 'Kabaligtaran ito — tumulong ang daga sa leon.', 'Kabaligtaran ito. Maliit ang daga, pero nakatulong siya.'], whyEn:['', 'The story is not about sleeping.', 'This is the opposite. The mouse helped the lion.', 'This is the opposite. The mouse is small, but it helped.'], tip:'Isipin kung sino ang maliit at sino ang malaki sa kuwento. Sino ang tumulong? Doon ang aral.', tipEn:'Think about who is small and who is big in the story. Who helped? That is the lesson.'},
      {q:'Sa "Alamat ng Pinya," bakit marami raw "mata" ang pinya?', qen:'In "The Legend of the Pineapple," why does the pineapple have many "eyes"?', options:['Dahil ito ang naging bunga ng sinabi ng ina ni Pina','Dahil mahilig itong tumingin sa lahat ng dumaraan sa hardin','Dahil ito ay puno','Dahil kulay dilaw ito'], correct:0, explain:'Nasabi ng ina na sana magkaroon si Pina ng maraming mata — at ito ang naging pinya.', en:'Her mother wished Pina had many eyes.', why:['', 'Hindi ito ang dahilan sa kuwento. Galing ang mga mata sa nasabi ng ina ni Pina.', 'Hindi ito ang dahilan. Ang mga mata ay galing sa nasabi ng ina ni Pina.', 'Walang sinabi ang kuwento tungkol sa kulay. Ang mga mata ay galing sa nasabi ng ina.'], whyEn:['', 'This is not the reason in the story. The eyes came from what Pina&rsquo;s mother said.', 'This is not the reason. The eyes came from what Pina&rsquo;s mother said.', 'The story says nothing about color. The eyes came from what her mother said.'], tip:'Alalahanin ang nangyari sa kuwento: ano ang nasabi ng ina kay Pina? Doon nanggaling ang mga mata.', tipEn:'Remember what happened in the story: what did the mother say about Pina? That is where the eyes came from.'},
      {q:'Ano ang aral ng "Alamat ng Pinya"?', qen:'What is the lesson of "The Legend of the Pineapple"?', options:['Maging masipag at huwag agad umasa sa iba','Laging magpahanap ng mga nawawalang gamit sa nanay','Huwag kumain ng prutas','Matulog nang maaga'], correct:0, explain:'Maging masipag at huwag agad umasa sa iba.', en:'Work hard and do not depend on others right away.', why:['', 'Iyan ang ginagawa ni Pina na hindi mabuti. Ang aral ay huwag agad umasa sa iba.', 'Walang sinabi ang kuwento tungkol sa hindi pagkain ng prutas.', 'Walang tungkol sa pagtulog sa kuwento.'], whyEn:['', 'That is what Pina did, and it was not good. The lesson is not to depend on others right away.', 'The story does not say anything about not eating fruit.', 'The story is not about sleeping.'], tip:'Isipin ang maling ginawa ni Pina. Ang aral ay ang kabaligtaran nito.', tipEn:'Think about what Pina did wrong. The lesson is the opposite of that.'},
      {q:'Ano ang katangian ng maikling kwento?', qen:'What is a feature of a short story?', options:['Napakahaba','May simula, gitna, at wakas','Walang tauhan','Walang suliranin at walang nangyayari sa kuwento'], correct:1, explain:'Ang maikling kwento ay may simula, gitna, at wakas, may suliranin, at may tauhan.', en:'It has a beginning, middle, and end.', why:['Maikli ang maikling kwento — mabilis itong basahin, hindi napakahaba.', '', 'May mga tauhan ang maikling kwento.', 'May isang suliranin (problema) ang maikling kwento.'], whyEn:['A short story is short. It is quick to read, not very long.', '', 'A short story has characters.', 'A short story has one problem.'], tip:'Basahin ang pangalan: MAIKLING kwento. Tandaan: may simula-gitna-wakas, tauhan, at problema.', tipEn:'Read the name: SHORT story. Remember: it has a beginning-middle-end, characters, and a problem.'},
      {q:'Tama o Mali: Ang alamat ay nagsasabi kung paano nagsimula ang isang bagay, hayop, o lugar.', qen:'True or False: A legend (alamat) tells how something, an animal, or a place began.', options:['Tama','Mali'], correct:0, explain:'Tama — iyan ang alamat. Hal: Alamat ng Pinya.', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Ang alamat ay nagsasabi kung paano nagsimula ang isang bagay, gaya ng pinya sa Alamat ng Pinya.'], whyEn:['', 'You said False, but it is true. A legend tells how something began, like the pineapple in the Legend of the Pineapple.'], tip:'Tandaan: alamat → PAANO NAGSIMULA. Isipin ang Alamat ng Pinya.', tipEn:'Remember: legend → HOW IT BEGAN. Think of the Legend of the Pineapple.'},
    ]
  },
  {
    id:'kayarian', emoji:'🧩', title:'Kayarian ng Pang-uri', subtitle:'Payak at Maylapi',
    flashcards:[
      {icon:'🎨', term:'Pang-uri', def:'Salitang NAGLALARAWAN sa tao, hayop, bagay, o lugar.\n"BUSILAK ang kalooban ng bata."\n"MALUSOG ang pangangatawan ng atleta."', en:'Pang-uri = a describing word.\nbusilak = pure (heart). malusog = healthy.'},
      {icon:'✌️', term:'Dalawang Kayarian', def:'Dalawa ang kayarian ng pang-uri:\n1. PAYAK\n2. MAYLAPI', en:'A describing word can be built 2 ways: Payak or Maylapi.'},
      {icon:'🌱', term:'Payak', def:'SALITANG-UGAT LANG. Isang salita lang, walang dagdag.\nHal: luma, itim, bulok, hinog\n"ITIM ang kulay ng kaniyang buhok."\n"LUMA ang aking sapatos."', en:'Payak = just the root word. Nothing is added.\nold, black, rotten, ripe.'},
      {icon:'🔗', term:'Panlapi', def:'Letra o mga letrang IKINAKABIT sa salitang-ugat.\nHal: ma- (maganda), maka- (makakalikasan)', en:'Panlapi = a word part we attach to the root word, like ma- or maka-.'},
      {icon:'➕', term:'Maylapi', def:'SALITANG-UGAT + PANLAPI\nma + ganda = maganda\nma + laki = malaki\nma + ulap = maulap', en:'Maylapi = root word + added part.\nma + ganda = maganda (beautiful).'},
      {icon:'🌸', term:'Iba pang Maylapi', def:'madami, marunong, mabango, magaling, maasim, malinis, malamig, makakalikasan (maka + kalikasan)', en:'All of these have an added part (ma- or maka-).'},
      {icon:'📘', term:'Pagsasanay sa Aklat (p. 99)', def:'"Bumili siya ng hinog na mangga." (hinog — payak)\n"Libre ang matrikula sa kanilang paaralan." (libre — payak)\n"Pinaghanda niya ng malamig na inumin ang panauhin." (malamig — maylapi)\n"Maulap ang kalangitan." (maulap — maylapi)', en:'Practice from your book, page 99.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Tingnan ang SIMULA ng salita.\nMay "ma-" o "maka-" na ikinabit? → MAYLAPI\nSalitang-ugat lang? → PAYAK\n\nSubukang tanggalin ang "ma-":\nmaganda → ganda ✔ kaya MAYLAPI', en:'Look at the start of the word. Is ma- or maka- added? Maylapi. Only the root word? Payak.\nTry taking off ma-: maganda becomes ganda.'},
    ],
    quiz:[
      {q:'Ano ang pang-uri?', qen:'What is a pang-uri?', options:['Salitang naglalarawan','Salitang nagsasabi ng kilos o galaw','Pangalan ng tao','Salitang pananong'], correct:0, explain:'Ang pang-uri ay salitang naglalarawan.', en:'A describing word.', why:['', 'Ang salitang nagsasabi ng kilos o galaw ay PANDIWA, hindi pang-uri.', 'Ang pangalan ng tao ay PANGNGALAN, hindi pang-uri.', 'Ang salitang pananong ay gaya ng sino at ano. Hindi ito pang-uri.'], whyEn:['', 'A word that tells an action or movement is a PANDIWA (verb), not a pang-uri.', 'The name of a person is a PANGNGALAN (noun), not a pang-uri.', 'Question words are like sino and ano. They are not pang-uri.'], tip:'Tandaan: pang-uri → NAGLALARAWAN. Itanong: ano ang itsura, kulay, o ugali?', tipEn:'Remember: pang-uri → it DESCRIBES. Ask: how does it look? What color? What is it like?'},
      {q:'Alin ang pang-uri?\n"Itim ang kulay ng kaniyang buhok."', qen:'Which word is the describing word?', options:['kulay','Itim','buhok'], correct:1, explain:'"Itim" ang naglalarawan sa kulay ng buhok.', en:'Itim (black) describes the hair.', why:['Ang "kulay" ay pangngalan. Ang "itim" ang nagsasabi kung ANONG kulay, kaya iyon ang pang-uri.', '', 'Ang "buhok" ang inilalarawan, hindi ang naglalarawan.'], whyEn:['"kulay" (color) is a noun. "itim" (black) tells WHICH color, so that is the pang-uri.', '', '"buhok" (hair) is the thing being described, not the describing word.'], tip:'Itanong: anong salita ang nagsasabi kung ANO ang itsura ng buhok? Iyon ang pang-uri.', tipEn:'Ask: which word tells WHAT the hair looks like? That is the pang-uri.'},
      {q:'Ano ang inilalarawan ng "busilak"?\n"Busilak ang kalooban ng bata."', qen:'What does "busilak" describe?', options:['bata','kalooban','ang'], correct:1, explain:'Ang "busilak" ay naglalarawan sa kalooban ng bata.', en:'busilak (pure) describes the kalooban (heart).', why:['Malapit, pero ang kalooban ng bata ang busilak, hindi ang buong bata.', '', 'Ang "ang" ay maliit na pantulong na salita. Hindi ito ang inilalarawan.'], whyEn:['Close, but it is the child&rsquo;s heart (kalooban) that is pure, not the whole child.', '', '"ang" is a small helper word. It is not the thing being described.'], tip:'Basahin: "Busilak ang ___." Ang salitang kasunod ng "ang" ang inilalarawan.', tipEn:'Read: "Busilak ang ___." The word right after "ang" is the thing being described.'},
      {q:'Payak o maylapi?\n"maganda"', qen:'Payak (root word only) or maylapi (has an added part)?', options:['Payak','Maylapi'], correct:1, explain:'Maylapi — ma + ganda = maganda.', en:'ma + ganda. It has an added part.', why:['Hindi salitang-ugat lang ang "maganda." May ikinabit na "ma-": ma + ganda.', ''], whyEn:['"maganda" is not just a root word. "ma-" was added: ma + ganda.', ''], tip:'Subukang tanggalin ang "ma-": maganda → ganda. May natirang salita? Maylapi iyan.', tipEn:'Try taking off "ma-": maganda → ganda. Is a word left? Then it is Maylapi.'},
      {q:'Payak o maylapi?\n"luma"', qen:'Payak (root word only) or maylapi (has an added part)?', options:['Payak','Maylapi'], correct:0, explain:'Payak — salitang-ugat lang ang "luma."', en:'luma is only the root word.', why:['', 'Walang ikinabit na panlapi sa "luma." Salitang-ugat lang ito, kaya Payak.'], whyEn:['', 'Nothing was added to "luma." It is only the root word, so it is Payak.'], tip:'Tingnan ang simula: may "ma-" o "maka-" ba? Ang "luma" ay nagsisimula sa "lu-," kaya walang panlapi.', tipEn:'Look at the start: is there "ma-" or "maka-"? "luma" starts with "lu-," so nothing was added.'},
      {q:'Payak o maylapi?\n"bulok"', qen:'Payak (root word only) or maylapi (has an added part)?', options:['Payak','Maylapi'], correct:0, explain:'Payak — salitang-ugat lang ang "bulok."', en:'bulok is only the root word.', why:['', 'Walang ikinabit na panlapi sa "bulok." Salitang-ugat lang ito, kaya Payak.'], whyEn:['', 'Nothing was added to "bulok." It is only the root word, so it is Payak.'], tip:'Hanapin ang "ma-" o "maka-" sa simula ng "bulok." Wala? Payak iyan.', tipEn:'Look for "ma-" or "maka-" at the start of "bulok." None? Then it is Payak.'},
      {q:'Payak o maylapi?\n"malaki"', qen:'Payak (root word only) or maylapi (has an added part)?', options:['Payak','Maylapi'], correct:1, explain:'Maylapi — ma + laki = malaki.', en:'ma + laki. It has an added part.', why:['May "ma-" sa simula ng "malaki": ma + laki. Kaya hindi ito Payak.', ''], whyEn:['"malaki" has "ma-" at the start: ma + laki. So it is not Payak.', ''], tip:'Takpan ng daliri ang "ma-": malaki → laki. Kung may salitang natira, Maylapi iyan.', tipEn:'Cover "ma-" with your finger: malaki → laki. If a word is left, it is Maylapi.'},
      {q:'Ano ang salitang-ugat ng "maulap"?', qen:'What is the root word of "maulap"?', options:['ma','ulap','maul','lap'], correct:1, explain:'ma + ulap = maulap. Ang salitang-ugat ay "ulap."', en:'Take off ma- and you get ulap (cloud).', why:['Ang "ma" ay ang panlapi, hindi ang salitang-ugat.', '', 'Hindi salita ang "maul." Mali ang pagkahati ng salita.', 'Kulang ang "lap." Ang salitang-ugat ay "ulap": ma + ulap.'], whyEn:['"ma" is the added part, not the root word.', '', '"maul" is not a word. The word was split in the wrong place.', '"lap" is missing letters. The root word is "ulap": ma + ulap.'], tip:'Tanggalin ang "ma-" sa simula. Ang natira ang salitang-ugat.', tipEn:'Take off "ma-" at the start. What is left is the root word.'},
      {q:'Ano ang panlapi sa "mabango"?', qen:'What is the added part in "mabango"?', options:['ma-','bango','-go','ban-'], correct:0, explain:'ma + bango = mabango. Ang "ma-" ang panlapi.', en:'ma- is the added part.', why:['', 'Ang "bango" ang salitang-ugat, hindi ang panlapi.', 'Bahagi ng "bango" ang "-go." Hindi ito ikinabit.', 'Bahagi ng "bango" ang "ban-." Ang panlapi ay nasa simula: "ma-."'], whyEn:['', '"bango" is the root word, not the added part.', '"-go" is part of "bango." It was not added.', '"ban-" is part of "bango." The added part is at the start: "ma-."'], tip:'Hanapin ang "ma-" o "maka-" sa simula ng salita. Iyon ang panlapi na ikinabit.', tipEn:'Look for "ma-" or "maka-" at the start of the word. That is the added part.'},
      {q:'Anong salita ang mabubuo?\nma + linis = ?', qen:'What word do you get?', options:['linisin','malinis','linis','naglinis'], correct:1, explain:'ma + linis = malinis.', en:'ma + linis = malinis (clean).', why:['Hindi "ma-" ang ikinabit sa "linisin." Ang hinihingi ay ma + linis.', '', 'Ang "linis" ay salitang-ugat lang. Kulang pa ang "ma-."', 'May "nag-" ang "naglinis," hindi "ma-."'], whyEn:['"linisin" does not have "ma-" added. The question asks for ma + linis.', '', '"linis" is only the root word. The "ma-" is still missing.', '"naglinis" has "nag-," not "ma-."'], tip:'Idikit lang ang "ma" sa unahan ng "linis." Basahin nang sabay: ma-linis.', tipEn:'Just stick "ma" in front of "linis." Read them together: ma-linis.'},
      {q:'Alin ang PAYAK na pang-uri?', qen:'Which describing word is PAYAK (root word only)?', options:['marunong','hinog','maasim','magaling'], correct:1, explain:'"hinog" ay salitang-ugat lang, kaya payak. Ang iba ay may "ma-."', en:'hinog has nothing added. The others start with ma-.', why:['May "ma-" ang "marunong," kaya Maylapi ito, hindi Payak.', '', 'May "ma-" ang "maasim," kaya Maylapi ito, hindi Payak.', 'May "ma-" ang "magaling," kaya Maylapi ito, hindi Payak.'], whyEn:['"marunong" has "ma-," so it is Maylapi, not Payak.', '', '"maasim" has "ma-," so it is Maylapi, not Payak.', '"magaling" has "ma-," so it is Maylapi, not Payak.'], tip:'Hanapin ang salitang WALANG "ma-" sa simula. Iyon ang Payak.', tipEn:'Find the word with NO "ma-" at the start. That is Payak.'},
      {q:'Alin ang MAYLAPING pang-uri?', qen:'Which describing word is MAYLAPI (has an added part)?', options:['itim','luma','magaling','bulok'], correct:2, explain:'"magaling" ay may "ma-," kaya maylapi. Ang iba ay payak.', en:'magaling has ma- added.', why:['Ang "itim" ay salitang-ugat lang — Payak, hindi Maylapi.', 'Ang "luma" ay salitang-ugat lang — Payak, hindi Maylapi.', '', 'Ang "bulok" ay salitang-ugat lang — Payak, hindi Maylapi.'], whyEn:['"itim" is only the root word. It is Payak, not Maylapi.', '"luma" is only the root word. It is Payak, not Maylapi.', '', '"bulok" is only the root word. It is Payak, not Maylapi.'], tip:'Hanapin ang salitang may "ma-" sa simula. Subukan: magaling → galing.', tipEn:'Find the word with "ma-" at the start. Try it: magaling → galing.'},
      {q:'Tama o Mali: Ang payak na pang-uri ay binubuo ng salitang-ugat at panlapi.', qen:'True or False: A payak word is made of a root word + an added part.', options:['Tama','Mali'], correct:1, explain:'Mali — ang payak ay salitang-ugat LANG. Ang maylapi ang may panlapi.', en:'False. Payak is the root word only. Maylapi has the added part.', why:['Pinili mo ang Tama, pero mali ito. Ang "at panlapi" ang mali. Ang Payak ay salitang-ugat LANG. Ang Maylapi ang may panlapi.', ''], whyEn:['You said True, but it is false. The "+ an added part" is wrong. Payak is the root word ONLY. Maylapi is the one with the added part.', ''], tip:'Isipin ang pangalan: MAY-LAPI → may panlapi. Payak → wala.', tipEn:'Think of the name: MAY-LAPI → "has an added part." Payak → nothing added.'},
      {q:'Tama o Mali: Ang panlapi ay letra o mga letrang ikinakabit sa salitang-ugat.', qen:'True or False: A panlapi is a letter or letters attached to the root word.', options:['Tama','Mali'], correct:0, explain:'Tama — iyan ang panlapi.', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Ang panlapi ay letra o mga letrang ikinakabit, gaya ng "ma-" sa "maganda."'], whyEn:['', 'You said False, but it is true. A panlapi is a letter or letters we attach, like "ma-" in "maganda."'], tip:'Isipin ang halimbawa: ma + ganda. Ang "ma-" ay ikinabit sa salitang-ugat — iyan ang panlapi.', tipEn:'Think of the example: ma + ganda. The "ma-" is attached to the root word. That is the panlapi.'},
      {q:'Payak o maylapi?\n"makakalikasan"', qen:'Payak (root word only) or maylapi (has an added part)?', options:['Payak','Maylapi'], correct:1, explain:'Maylapi — maka + kalikasan = makakalikasan.', en:'maka + kalikasan. It has an added part.', why:['Hindi salitang-ugat lang ang "makakalikasan." May ikinabit na "maka-": maka + kalikasan.', ''], whyEn:['"makakalikasan" is not just a root word. "maka-" was added: maka + kalikasan.', ''], tip:'Tandaan: panlapi rin ang "maka-." Tanggalin ito: makakalikasan → kalikasan.', tipEn:'Remember: "maka-" is an added part too. Take it off: makakalikasan → kalikasan.'},
      {q:'Ano ang pang-uri at ang kayarian nito?\n"Bumili siya ng hinog na mangga."', qen:'What is the describing word, and is it payak or maylapi?', options:['hinog — payak','hinog — maylapi','mangga — payak','Bumili — maylapi'], correct:0, explain:'"hinog" ang naglalarawan sa mangga. Salitang-ugat lang, kaya payak.', en:'hinog (ripe) describes the mango. Nothing added, so payak.', why:['', 'Tama ang "hinog," pero walang panlapi ito. Payak ito, hindi Maylapi.', 'Ang "mangga" ang inilalarawan, hindi ang naglalarawan.', 'Ang "Bumili" ay kilos (pandiwa), hindi pang-uri.'], whyEn:['', '"hinog" is the right word, but nothing is added to it. It is Payak, not Maylapi.', '"mangga" (mango) is the thing being described, not the describing word.', '"Bumili" (bought) is an action (verb), not a pang-uri.'], tip:'Dalawang hakbang: (1) Hanapin ang salitang naglalarawan. (2) Tingnan kung may "ma-" o wala.', tipEn:'Two steps: (1) Find the describing word. (2) Check if it has "ma-" or not.'},
      {q:'Ano ang pang-uri at ang kayarian nito?\n"Pinaghanda niya ng malamig na inumin ang panauhin."', qen:'What is the describing word, and is it payak or maylapi?', options:['inumin — payak','malamig — payak','malamig — maylapi','panauhin — maylapi'], correct:2, explain:'"malamig" ang naglalarawan sa inumin. ma + lamig, kaya maylapi.', en:'malamig (cold) describes the drink. ma + lamig, so maylapi.', why:['Ang "inumin" ang inilalarawan, hindi ang pang-uri.', 'Tama ang "malamig," pero may "ma-" ito: ma + lamig. Maylapi ito, hindi Payak.', '', 'Ang "panauhin" ay ang taong binigyan ng inumin. Hindi ito naglalarawan.'], whyEn:['"inumin" (drink) is the thing being described, not the pang-uri.', '"malamig" is the right word, but it has "ma-": ma + lamig. It is Maylapi, not Payak.', '', '"panauhin" (guest) is the person who got the drink. It does not describe anything.'], tip:'Itanong: ANONG klaseng inumin? Kapag nahanap mo na, tanggalin ang "ma-" para makita kung Maylapi.', tipEn:'Ask: WHAT KIND of drink? When you find it, take off "ma-" to check if it is Maylapi.'},
      {q:'Ano ang pang-uri at ang kayarian nito?\n"Libre ang matrikula sa kanilang paaralan."', qen:'What is the describing word, and is it payak or maylapi?', options:['Libre — maylapi','matrikula — payak','paaralan — maylapi','Libre — payak'], correct:3, explain:'"Libre" ang naglalarawan sa matrikula. Salitang-ugat lang, kaya payak.', en:'Libre (free) describes the tuition. Nothing added, so payak.', why:['Tama ang "Libre," pero walang panlapi ito. Payak ito, hindi Maylapi.', 'Ang "matrikula" ang inilalarawan, hindi ang pang-uri.', 'Ang "paaralan" ay lugar. Hindi ito ang naglalarawan sa matrikula.', ''], whyEn:['"Libre" is the right word, but nothing is added to it. It is Payak, not Maylapi.', '"matrikula" (tuition) is the thing being described, not the pang-uri.', '"paaralan" (school) is a place. It does not describe the tuition.', ''], tip:'Hanapin muna ang naglalarawan: ANONG klaseng matrikula? Pagkatapos, tingnan kung may "ma-" o "maka-" ang salitang iyon.', tipEn:'First find the describing word: WHAT KIND of tuition? Then check if that word has "ma-" or "maka-."'},
      {q:'Ano ang pang-uri at ang kayarian nito?\n"Maulap ang kalangitan."', qen:'What is the describing word, and is it payak or maylapi?', options:['Maulap — maylapi','Maulap — payak','kalangitan — payak','kalangitan — maylapi'], correct:0, explain:'"Maulap" ang naglalarawan sa kalangitan. ma + ulap, kaya maylapi.', en:'Maulap (cloudy) describes the sky. ma + ulap, so maylapi.', why:['', 'Tama ang "Maulap," pero may "ma-" ito: ma + ulap. Maylapi ito, hindi Payak.', 'Ang "kalangitan" ang inilalarawan, hindi ang pang-uri.', 'Ang "kalangitan" ang inilalarawan, hindi ang pang-uri.'], whyEn:['', '"Maulap" is the right word, but it has "ma-": ma + ulap. It is Maylapi, not Payak.', '"kalangitan" (sky) is the thing being described, not the pang-uri.', '"kalangitan" (sky) is the thing being described, not the pang-uri.'], tip:'Itanong: ANO ang itsura ng kalangitan? Hanapin ang sagot, tapos tingnan kung may "ma-."', tipEn:'Ask: WHAT does the sky look like? Find that word, then check if it has "ma-."'},
    ]
