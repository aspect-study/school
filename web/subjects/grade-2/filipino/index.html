  {
    id:'reaksyon', emoji:'💬', title:'Payak na Pangungusap sa Reaksyon', subtitle:'Ano ang Naramdaman Mo sa Tauhan?',
    flashcards:[
      {icon:'💭', term:'Reaksiyon', def:'Ang NARARAMDAMAN mo tungkol sa nabasa o narinig mo.\nHal: saya, lungkot, awa, galak, paghanga', en:'Reaction = how you FEEL about what you read or heard.'},
      {icon:'📝', term:'Payak na Pangungusap', def:'Pangungusap na may ISANG buong kaisipan.', en:'A simple sentence with ONE complete idea.'},
      {icon:'🗣️', term:'Mga Halimbawa', def:'"Naaawa ako sa bata."\n"Natutuwa ako kay Ana."\n"Humahanga ako kay Pedro."', en:'I feel sorry for the child.\nI am happy for Ana.\nI admire Pedro.'},
      {icon:'😊', term:'Mga Panimulang Salita', def:'Ako ay...\nnatutuwa\nnalulungkot\nnaaawa\nhumahanga\nnaiinis', en:'natutuwa = happy\nnalulungkot = sad\nnaaawa = feel sorry for\nhumahanga = admire\nnaiinis = annoyed'},
      {icon:'❓', term:'Gabay na Tanong', def:'1. Sino ang tauhan?\n2. Ano ang nangyari sa tauhan?\n3. Ano ang naramdaman mo?\n4. Ano ang iyong reaksiyon sa tauhan?\n5. Paano mo ito sasabihin sa isang payak na pangungusap?', en:'1. Who is the character? 2. What happened? 3. How did you feel? 4. What is your reaction? 5. Say it in one simple sentence.'},
      {icon:'🍍', term:'Ang Alamat ng Pinya', def:'"Si Pinang ay hindi nakinig sa payo ng kanyang ina."\n"Hinahanap ni Nanay ang kanyang anak."\nAno ang reaksiyon mo sa mga tauhan?', en:'Practice from class: what is your reaction to the characters?'},
      {icon:'🎯', term:'Tandaan', def:'Gumamit ng ANGKOP na salita para malinaw ang iyong damdamin.', en:'Use the RIGHT feeling word so your feeling is clear.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Itanong: MABUTI ba o HINDI MABUTI ang nangyari?\n\nMagaling o mabuting ginawa → HUMAHANGA\nMagandang balita → NATUTUWA\nMalungkot na nangyari → NAAAWA o NALULUNGKOT\nMaling ginawa → NAIINIS', en:'Good deed = admire (humahanga). Good news = happy (natutuwa).\nSad thing happened = feel sorry or sad. Bad behavior = annoyed (naiinis).'},
    ],
    quiz:[
      {q:'Ano ang reaksiyon?', qen:'What is a reaction (reaksiyon)?', options:['Damdamin o saloobin tungkol sa nabasa o narinig','Pangalan ng tauhan sa kuwento','Lugar at oras kung saan at kailan nangyari ang kuwento','Pamagat ng isang aklat'], correct:0, explain:'Ang reaksiyon ay ang nararamdaman natin tungkol sa nabasa o narinig.', en:'It is how you feel about what you read or heard.', why:['', 'Ang pangalan ng tauhan ay ang TAUHAN, hindi reaksiyon.', 'Ang lugar at oras ng kuwento ay ang TAGPUAN, hindi reaksiyon.', 'Ang pamagat ay pangalan ng aklat, hindi damdamin.'], whyEn:['', 'The name of a character is the TAUHAN, not a reaction.', 'The place and time of a story is the TAGPUAN (setting), not a reaction.', 'A title is the name of a book, not a feeling.'], tip:'Tandaan: reaksiyon = nararamdaman MO. Hanapin ang sagot na may salitang damdamin.', tipEn:'Remember: reaction = how YOU feel. Find the answer that talks about feelings.'},
      {q:'Ano ang ipinahahayag ng payak na pangungusap?', qen:'What does a simple sentence (payak na pangungusap) tell?', options:['Maraming magkakaibang kaisipan','Iisang buong kaisipan','Isang tanong lamang','Pangalan lamang'], correct:1, explain:'Ang payak na pangungusap ay may iisang buong kaisipan.', en:'One complete idea.', why:['Kabaligtaran ito. ISA lang ang kaisipan ng payak na pangungusap.', '', 'Hindi kailangang tanong ang payak na pangungusap. Isang buong kaisipan ito.', 'Hindi buong kaisipan ang isang pangalan lang.'], whyEn:['This is the opposite. A simple sentence has only ONE idea.', '', 'A simple sentence does not have to be a question. It is one complete idea.', 'Just a name is not a complete idea.'], tip:'Tandaan: PAYAK = simple, ISANG buong kaisipan. Gaya ng "Naaawa ako sa bata."', tipEn:'Remember: PAYAK = simple, ONE complete idea. Like "Naaawa ako sa bata."'},
      {q:'Alin ang nagpapahayag ng REAKSIYON sa tauhan?', qen:'Which sentence shows a REACTION (feeling) about the character?', options:['Si Pedro ay may bag.','Saan pupunta si Pedro?','Humahanga ako kay Pedro.','Si Pedro ay nasa paaralan.'], correct:2, explain:'"Humahanga ako kay Pedro." — may damdamin (paghanga).', en:'"I admire Pedro" shows a feeling.', why:['Nagsasabi lang ito na may bag si Pedro. Walang damdamin dito.', 'Tanong ito, hindi damdamin.', '', 'Nagsasabi lang ito kung nasaan si Pedro. Walang damdamin dito.'], whyEn:['It only tells that Pedro has a bag. There is no feeling.', 'It is a question, not a feeling.', '', 'It only tells where Pedro is. There is no feeling.'], tip:'Hanapin ang salitang damdamin: natutuwa, naaawa, humahanga, nalulungkot, o naiinis.', tipEn:'Look for a feeling word: natutuwa, naaawa, humahanga, nalulungkot, or naiinis.'},
      {q:'Anong damdamin ito?\n"Naaawa ako sa bata."', qen:'What feeling is this?', options:['awa','galak','inis','paghanga'], correct:0, explain:'"Naaawa" → awa.', en:'Naaawa = feeling sorry for someone.', why:['', 'Ang galak ay saya. Ang "naaawa" ay galing sa awa.', 'Ang inis ay galing sa "naiinis," hindi sa "naaawa."', 'Ang paghanga ay galing sa "humahanga," hindi sa "naaawa."'], whyEn:['', 'galak means joy. "naaawa" comes from awa (pity).', 'inis comes from "naiinis" (annoyed), not "naaawa."', 'paghanga comes from "humahanga" (admire), not "naaawa."'], tip:'Hanapin ang salitang nakatago sa loob: na-AWA-awa → awa.', tipEn:'Find the word hiding inside: na-AWA-awa → awa.'},
      {q:'Sino ang tauhan dito?\n"Natutuwa ako kay Ana."', qen:'Who is the character here?', options:['ako','Ana','bata','Pedro'], correct:1, explain:'Si Ana ang tauhan. "Ako" ang nagsasabi ng reaksiyon.', en:'Ana is the character. "ako" is the one reacting.', why:['Ang "ako" ang nagsasabi ng reaksiyon, hindi ang tauhan.', '', 'Walang "bata" sa pangungusap.', 'Walang "Pedro" sa pangungusap.'], whyEn:['"ako" (I) is the one saying the reaction, not the character.', '', 'There is no "bata" in the sentence.', 'There is no "Pedro" in the sentence.'], tip:'Hanapin ang pangalan pagkatapos ng "kay." Iyon ang tauhan.', tipEn:'Look for the name after "kay." That is the character.'},
      {q:'Alin ang angkop na reaksiyon?\nTinulungan ni Pedro ang matandang tumawid sa kalsada.', qen:'Which reaction fits?', options:['Naiinis ako kay Pedro.','Humahanga ako kay Pedro.','Nalulungkot ako kay Pedro.','Naaawa ako kay Pedro.'], correct:1, explain:'Mabuti ang ginawa ni Pedro — HUMAHANGA tayo.', en:'Pedro did a good deed, so we admire him.', why:['Ang naiinis ay para sa maling ginawa. Mabuti ang ginawa ni Pedro.', '', 'Walang malungkot na nangyari. Mabuti ang ginawa ni Pedro.', 'Ang naaawa ay para sa may malungkot na nangyari. Walang malungkot na nangyari kay Pedro.'], whyEn:['Naiinis (annoyed) is for bad behavior. Pedro did something good.', '', 'Nothing sad happened. Pedro did something good.', 'Naaawa (feel sorry) is for when something sad happens. Nothing sad happened to Pedro.'], tip:'Itanong: mabuti ba ang ginawa? Mabuting gawa → Humahanga.', tipEn:'Ask: was it a good deed? Good deed → Humahanga (admire).'},
      {q:'Alin ang angkop na reaksiyon?\nNawala ang aso ni Lito kaya siya ay umiiyak.', qen:'Which reaction fits?', options:['Naaawa ako kay Lito.','Natutuwa ako kay Lito.','Humahanga ako kay Lito.','Naiinis ako kay Lito.'], correct:0, explain:'Malungkot ang nangyari kay Lito — NAAAWA tayo.', en:'Something sad happened to Lito, so we feel sorry for him.', why:['', 'Hindi magandang balita ang mawalan ng aso. Hindi tayo natutuwa rito.', 'Para sa mabuting ginawa ang paghanga. Walang mabuting ginawa rito — may malungkot na nangyari.', 'Walang maling ginawa si Lito. Malungkot ang nangyari sa kaniya.'], whyEn:['', 'Losing a dog is not good news. We are not happy about it.', 'Admiring is for a good deed. No good deed happened here. Something sad happened.', 'Lito did nothing wrong. Something sad happened to him.'], tip:'Itanong: malungkot ba ang nangyari sa tauhan? Kung oo → Naaawa o Nalulungkot.', tipEn:'Ask: did something sad happen to the character? If yes → Naaawa or Nalulungkot.'},
      {q:'Alin ang angkop na reaksiyon?\nNanalo si Ana sa paligsahan sa pagbasa.', qen:'Which reaction fits?', options:['Naaawa ako kay Ana.','Naiinis ako kay Ana.','Natutuwa ako kay Ana.','Nalulungkot ako kay Ana.'], correct:2, explain:'Magandang balita — NATUTUWA tayo.', en:'Good news, so we are happy for Ana.', why:['Hindi malungkot ang nangyari. Nanalo si Ana!', 'Walang maling ginawa si Ana. Hindi tayo naiinis.', '', 'Masaya ang manalo, hindi malungkot.'], whyEn:['Nothing sad happened. Ana won!', 'Ana did nothing wrong. We are not annoyed.', '', 'Winning is happy, not sad.'], tip:'Itanong: magandang balita ba? Kung oo → Natutuwa.', tipEn:'Ask: is it good news? If yes → Natutuwa (happy).'},
      {q:'Alin ang angkop na salita?\n"______ ako kay Pedro dahil matapang siya."', qen:'Which word fits in the blank?', options:['Naiinis','Humahanga','Naaawa','Nalulungkot'], correct:1, explain:'Magandang katangian ang pagiging matapang — HUMAHANGA tayo.', en:'Being brave is good, so we admire him.', why:['Hindi masama ang pagiging matapang. Hindi tayo naiinis dito.', '', 'Walang malungkot na nangyari kay Pedro. Hindi ito para sa awa.', 'Walang malungkot na nangyari kay Pedro. Hindi tayo nalulungkot.'], whyEn:['Being brave is not bad. We are not annoyed by it.', '', 'Nothing sad happened to Pedro. This is not about feeling sorry.', 'Nothing sad happened to Pedro. We are not sad.'], tip:'Hanapin ang clue pagkatapos ng "dahil": matapang. Magandang katangian → Humahanga.', tipEn:'Find the clue after "dahil" (because): matapang (brave). A good trait → Humahanga.'},
      {q:'Alin ang HINDI panimulang salita ng reaksiyon?', qen:'Which one is NOT a feeling word for a reaction?', options:['natutuwa','naaawa','naglalaro','humahanga'], correct:2, explain:'"naglalaro" ay kilos, hindi damdamin.', en:'naglalaro (playing) is an action, not a feeling.', why:['Ang "natutuwa" ay salitang damdamin, kaya hindi ito ang sagot. Hanapin ang HINDI damdamin.', 'Ang "naaawa" ay salitang damdamin, kaya hindi ito ang sagot. Hanapin ang HINDI damdamin.', '', 'Ang "humahanga" ay salitang damdamin, kaya hindi ito ang sagot. Hanapin ang HINDI damdamin.'], whyEn:['"natutuwa" (happy) IS a feeling word, so it is not the answer. We need the one that is NOT.', '"naaawa" (feel sorry) IS a feeling word, so it is not the answer. We need the one that is NOT.', '', '"humahanga" (admire) IS a feeling word, so it is not the answer. We need the one that is NOT.'], tip:'Itanong sa bawat salita: nararamdaman ba ito, o ginagawa? Ang ginagawa (kilos) ang HINDI salitang damdamin.', tipEn:'Ask for each word: is it something you feel, or something you do? The one you DO (an action) is not a feeling word.'},
      {q:'Sa gabay na tanong, ano ang UNANG itinatanong?', qen:'In the guide questions, what do we ask FIRST?', options:['Sino ang tauhan?','Ano ang pamagat?','Ilan ang pahina?','Saan ka nakatira?'], correct:0, explain:'Una: "Sino ang tauhan?" Saka ang nangyari sa kaniya.', en:'First: Who is the character?', why:['', 'Wala sa gabay na tanong ang pamagat.', 'Wala sa gabay na tanong ang bilang ng pahina.', 'Hindi ito tungkol sa kuwento. Wala ito sa gabay na tanong.'], whyEn:['', 'The title is not one of the guide questions.', 'The number of pages is not one of the guide questions.', 'This is not about the story. It is not one of the guide questions.'], tip:'Tandaan ang ayos: Sino ang tauhan → Ano ang nangyari → Ano ang naramdaman mo. Tauhan muna!', tipEn:'Remember the order: Who is the character → What happened → How did you feel. Character first!'},
      {q:'Tama o Mali: Maaari tayong gumamit ng payak na pangungusap para sabihin ang ating reaksiyon sa tauhan.', qen:'True or False: We can use a simple sentence to say our reaction to a character.', options:['Tama','Mali'], correct:0, explain:'Tama — hal: "Natutuwa ako kay Ana."', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Puwede tayong gumamit ng payak na pangungusap, gaya ng "Natutuwa ako kay Ana."'], whyEn:['', 'You said False, but it is true. We can use a simple sentence, like "Natutuwa ako kay Ana."'], tip:'Isipin ang mga halimbawa sa aralin: "Naaawa ako sa bata." Maikli at isang kaisipan lang — payak!', tipEn:'Think of the examples from the lesson: "Naaawa ako sa bata." Short and one idea: payak!'},
      {q:'Tama o Mali: Hindi mahalaga ang paggamit ng angkop na salita sa pagpapahayag ng damdamin.', qen:'True or False: Using the right word for our feeling is NOT important.', options:['Tama','Mali'], correct:1, explain:'Mali — mahalaga ang angkop na salita para malinaw ang damdamin.', en:'False. The right word makes our feeling clear.', why:['Pinili mo ang Tama, pero mali ito. Ang "Hindi mahalaga" ang mali. Mahalaga ang angkop na salita para malinaw ang damdamin.', ''], whyEn:['You said True, but it is false. The words "NOT important" are wrong. The right word makes our feeling clear.', ''], tip:'Mag-ingat sa salitang "Hindi" sa pangungusap. Baka baligtad ito sa itinuro ng aralin.', tipEn:'Watch out for the word "Hindi" (not) in the sentence. It may say the opposite of what the lesson taught.'},
    ]
  },
  {
    id:'antas', emoji:'📊', title:'Antas ng Paglalarawan', subtitle:'Lantay, Pahambing, Pasukdol',
    flashcards:[
      {icon:'🪜', term:'Tatlong Antas', def:'LANTAY — isa lamang\nPAHAMBING — dalawa\nPASUKDOL — pinakamatindi', en:'3 levels of describing: one thing, comparing two, and the most.'},
      {icon:'1️⃣', term:'Lantay', def:'ISA lang ang inilalarawan. Walang inihahambing.\n"Mabait ang batang tumutulong sa kaniyang kapuwa."', en:'Lantay = describing ONE only. No comparing.'},
      {icon:'2️⃣', term:'Pahambing', def:'DALAWA ang inihahambing.\nMay dalawang uri: MAGKATULAD at HINDI MAGKATULAD.', en:'Pahambing = comparing TWO. Two kinds: the same, or not the same.'},
      {icon:'🟰', term:'Pahambing: Magkatulad', def:'PAREHO ang katangian.\nMga salita: sing-, magsing-, magkasing-, kapuwa, pareho, tulad, gaya\n"Magsingbait sina Ana at Mia." (Pareho silang mabait.)', en:'Magkatulad = the SAME.'},
      {icon:'⚖️', term:'Pahambing: Hindi Magkatulad', def:'HINDI PAREHO ang katangian.\nMga salita: mas, higit, lalo, kaysa, hindi gaano\n"Mas mabilis tumulong si Ana kaysa kay Ben."', en:'Hindi Magkatulad = NOT the same. One is more.'},
      {icon:'🏆', term:'Pasukdol', def:'PINAKAMATAAS o PINAKAMATINDI (higit sa dalawa).\nMga salita: pinaka-, napaka-, pagka-, walang katulad, walang kaparis\n"Si Ana ang pinakamabait sa magkakaibigan."', en:'Pasukdol = the MOST. The highest of all.'},
      {icon:'✏️', term:'Mga Titik sa Pagtataya', def:'L = Lantay\nPM = Pahambing-Magkatulad\nPHM = Pahambing-Hindi Magkatulad\nP = Pasukdol', en:'The letters you write in the test.'},
      {icon:'🎒', term:'Halimbawa: Bag at Lapis', def:'Lantay: Malaki ang aking bag.\nMagkatulad: Magkasinghaba ang dalawang lapis.\nHindi Magkatulad: Mas mahaba ang lapis ni Ana kaysa sa lapis ni Ben.\nPasukdol: Ang bag ni Ana ang pinakamalaki sa aming lahat.', en:'One example for each level.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Hanapin ang PANTULONG NA SALITA:\nmas / kaysa → Hindi Magkatulad (PHM)\nsing- / magsing- / magkasing- / pareho → Magkatulad (PM)\npinaka- / napaka- → Pasukdol (P)\nWala sa mga ito at isa lang? → Lantay (L)', en:'Find the helper word.\nmas or kaysa = not the same (PHM).\nsing-, magsing-, magkasing-, pareho = the same (PM).\npinaka- or napaka- = the most (P).\nNone of these, only one thing = Lantay (L).'},
    ],
    quiz:[
      {q:'Anong antas ng paglalarawan?\n"Mabango ang rosas."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:0, explain:'Lantay — isa lang (ang rosas) at walang inihahambing.', en:'Only one thing, no comparing.', why:['', 'Ang Magkatulad ay dalawang bagay na pareho. Isa lang ang rosas dito.', 'Ang Hindi Magkatulad ay may "mas" o "kaysa." Wala ito rito.', 'Ang Pasukdol ay may "pinaka-" o "napaka-." Wala ito rito.'], whyEn:['', 'Magkatulad is two things that are the same. There is only one rose here.', 'Hindi Magkatulad has "mas" or "kaysa." There is none here.', 'Pasukdol has "pinaka-" or "napaka-." There is none here.'], tip:'Hanapin muna ang pantulong na salita (mas, sing-, pinaka-). Kung wala at isa lang ang inilalarawan → Lantay.', tipEn:'First look for a helper word (mas, sing-, pinaka-). If there is none and only one thing is described → Lantay.'},
      {q:'Anong antas ng paglalarawan?\n"Magkasingganda ang dalawang bulaklak."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:1, explain:'May "magkasing-" — pareho ang ganda. Pahambing - Magkatulad.', en:'magkasing- means the same.', why:['Dalawa ang bulaklak at inihahambing sila, kaya hindi ito Lantay.', '', 'Walang "mas" o "kaysa." Pareho ang ganda nila, kaya hindi ito Hindi Magkatulad.', 'Walang "pinaka-" o "napaka-." Pareho lang ang ganda nila.'], whyEn:['There are two flowers being compared, so it is not Lantay.', '', 'There is no "mas" or "kaysa." They are equally pretty, so it is not Hindi Magkatulad.', 'There is no "pinaka-" or "napaka-." They are just equally pretty.'], tip:'Hanapin ang "magkasing-" sa simula ng salita. Ibig sabihin nito ay PAREHO → PM.', tipEn:'Look for "magkasing-" at the start of the word. It means THE SAME → PM.'},
      {q:'Anong antas ng paglalarawan?\n"Mas mabango ang rosas kaysa sa sampaguita."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:2, explain:'May "mas" at "kaysa" — hindi pareho. Pahambing - Hindi Magkatulad.', en:'mas and kaysa mean NOT the same.', why:['Dalawa ang bulaklak dito — rosas at sampaguita — kaya hindi ito Lantay.', 'Hindi pareho ang bango nila. Ang "mas" ay nagsasabing mas mabango ang isa.', '', 'Walang "pinaka-." Dalawa lang ang inihahambing.'], whyEn:['There are two flowers here, the rose and the sampaguita, so it is not Lantay.', 'They do not smell the same. "mas" says one smells better.', '', 'There is no "pinaka-." Only two things are compared.'], tip:'May "mas" at "kaysa" ba? Kung oo, hindi pareho → PHM.', tipEn:'Is there "mas" and "kaysa"? If yes, they are not the same → PHM.'},
      {q:'Anong antas ng paglalarawan?\n"Pinakamabango ang rosas sa lahat ng bulaklak."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:3, explain:'May "pinaka-" — pinakamatindi. Pasukdol.', en:'pinaka- means the most.', why:['May "pinaka-" at inihahambing sa lahat ng bulaklak, kaya hindi ito Lantay.', 'Walang "sing-" o "pareho." Ang rosas ang pinaka sa lahat.', 'Walang "mas" o "kaysa." Pinaka ang rosas sa LAHAT, hindi lang sa isa.', ''], whyEn:['It has "pinaka-" and compares with all flowers, so it is not Lantay.', 'There is no "sing-" or "pareho." The rose is the most of all.', 'There is no "mas" or "kaysa." The rose is the most of ALL, not just more than one.', ''], tip:'Hanapin ang "pinaka-" sa simula ng salita. Pinaka → Pasukdol.', tipEn:'Look for "pinaka-" at the start of the word. Pinaka → Pasukdol.'},
      {q:'Anong antas ng paglalarawan?\n"Magsinglaki ang dalawang lobo."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:1, explain:'May "magsing-" — pareho ang laki. Pahambing - Magkatulad.', en:'magsing- means the same.', why:['Dalawa ang lobo at inihahambing sila, kaya hindi ito Lantay.', '', 'Walang "mas" o "kaysa." Pareho ang laki ng dalawa.', 'Walang "pinaka-" o "napaka-" dito.'], whyEn:['There are two balloons being compared, so it is not Lantay.', '', 'There is no "mas" or "kaysa." Both are the same size.', 'There is no "pinaka-" or "napaka-" here.'], tip:'Kapatid ng "magkasing-" ang "magsing-." Pareho silang nangangahulugang PAREHO → PM.', tipEn:'"magsing-" is like "magkasing-." Both mean THE SAME → PM.'},
      {q:'Anong antas ng paglalarawan?\n"Parehong malinis ang dalawang silid-aralan."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:1, explain:'May "pareho" — Pahambing - Magkatulad.', en:'pareho means the same.', why:['Dalawa ang silid-aralan na inihahambing, kaya hindi ito Lantay.', '', 'Ang "pareho" ay nagsasabing magkatulad sila, hindi magkaiba.', 'Walang "pinaka-" o "napaka-" dito.'], whyEn:['Two classrooms are being compared, so it is not Lantay.', '', '"pareho" says they are the same, not different.', 'There is no "pinaka-" or "napaka-" here.'], tip:'Basahin nang dahan-dahan ang unang salita: PAREHO-ng. Pareho → Magkatulad.', tipEn:'Read the first word slowly: PAREHO-ng. Pareho (same) → Magkatulad.'},
      {q:'Anong antas ng paglalarawan?\n"Napakaganda ng hardin ng aming paaralan."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:3, explain:'May "napaka-" — Pasukdol.', en:'napaka- means the most.', why:['Isa lang ang hardin, pero may "napaka-." Ayon sa aralin, napaka- → Pasukdol, hindi Lantay.', 'Walang dalawang bagay na pareho rito.', 'Walang "mas" o "kaysa" dito.', ''], whyEn:['There is only one garden, but it has "napaka-." The lesson says napaka- → Pasukdol, not Lantay.', 'There are not two things that are the same here.', 'There is no "mas" or "kaysa" here.', ''], tip:'Tandaan: kapatid ng "pinaka-" ang "napaka-." Kahit isa lang ang nasa pangungusap, ang napaka- ay Pasukdol.', tipEn:'Remember: "napaka-" is like "pinaka-." Even if only one thing is in the sentence, napaka- is Pasukdol.'},
      {q:'Anong antas ng paglalarawan?\n"Mas mabilis tumakbo si Carlo kaysa kay Ben."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:2, explain:'May "mas" at "kaysa" — hindi pareho ang bilis. Pahambing - Hindi Magkatulad.', en:'mas and kaysa mean NOT the same.', why:['Dalawa ang tao — sina Carlo at Ben — kaya hindi ito Lantay.', 'Hindi pareho ang bilis nila. Mas mabilis si Carlo.', '', 'Walang "pinaka-." Dalawa lang ang inihahambing.'], whyEn:['There are two people, Carlo and Ben, so it is not Lantay.', 'They are not equally fast. Carlo is faster.', '', 'There is no "pinaka-." Only two are compared.'], tip:'Bilangin ang inihahambing: dalawa. Tapos hanapin ang "mas" at "kaysa" → PHM.', tipEn:'Count what is compared: two. Then look for "mas" and "kaysa" → PHM.'},
      {q:'Alin ang angkop na salita?\n"______ bait sina Ana at Mia."', qen:'Which word fits in the blank?', options:['Mas','Magsing','Pinaka','Napaka'], correct:1, explain:'"Magsingbait sina Ana at Mia." — pareho silang mabait.', en:'They are the same, so magsing-.', why:['Ang "Mas" ay kasama ng "kaysa" at para sa hindi pareho. Walang "kaysa" dito, at pareho silang mabait.', '', 'Ang "Pinaka" ay para sa pinaka sa lahat. Dalawa lang sina Ana at Mia, at pareho sila.', 'Ang "Napaka" ay Pasukdol. Dito, dalawa ang inihahambing at pareho sila.'], whyEn:['"Mas" goes with "kaysa" and is for not the same. There is no "kaysa" here, and both are equally kind.', '', '"Pinaka" is for the most of all. There are only two, Ana and Mia, and they are the same.', '"Napaka" is Pasukdol. Here, two are compared and they are the same.'], tip:'Bilangin ang tauhan: sina Ana AT Mia — dalawa. Walang "kaysa," kaya pareho sila → Magsing.', tipEn:'Count the people: Ana AND Mia, that is two. There is no "kaysa," so they are the same → Magsing.'},
      {q:'Alin ang angkop na salita?\n"______ mabait si Carlo kaysa kay Ben."', qen:'Which word fits in the blank?', options:['Mas','Magsing','Pinaka','Napaka'], correct:0, explain:'May "kaysa," kaya "Mas." — "Mas mabait si Carlo kaysa kay Ben."', en:'kaysa goes with mas.', why:['', 'Ang "magsing-" ay para sa pareho. Pero may "kaysa" — hindi sila pareho.', 'Ang "Pinaka" ay para sa pinaka sa lahat. May "kaysa" dito, kaya dalawa lang ang inihahambing.', 'Ang "Napaka" ay Pasukdol. May "kaysa" dito, kaya dalawa ang inihahambing at hindi pareho.'], whyEn:['', '"magsing-" is for the same. But there is "kaysa," so they are not the same.', '"Pinaka" is for the most of all. There is "kaysa," so only two are compared.', '"Napaka" is Pasukdol. There is "kaysa," so two are compared and they are not the same.'], tip:'Hanapin ang "kaysa" sa pangungusap. Laging magkasama ang "mas" at "kaysa."', tipEn:'Look for "kaysa" in the sentence. "mas" and "kaysa" always go together.'},
      {q:'Alin ang angkop na salita?\n"Si Liza ang ______ mabait sa magkakaibigan."', qen:'Which word fits in the blank?', options:['mas','magsing','pinaka','magkasing'], correct:2, explain:'Siya ang pinakamabait sa lahat — "pinaka."', en:'She is the kindest of all, so pinaka-.', why:['Walang "kaysa" dito. Si Liza ang pinaka sa lahat ng magkakaibigan.', 'Ang "magsing-" ay para sa dalawang pareho. Si Liza lang ang pinakamabait dito.', '', 'Ang "magkasing-" ay para sa dalawang pareho. Si Liza lang ang pinakamabait dito.'], whyEn:['There is no "kaysa" here. Liza is the most of all the friends.', '"magsing-" is for two that are the same. Here only Liza is the kindest.', '', '"magkasing-" is for two that are the same. Here only Liza is the kindest.'], tip:'Hanapin ang clue na "sa magkakaibigan" — maraming tao. Ang pinaka sa marami → pinaka.', tipEn:'Find the clue "sa magkakaibigan" (among the friends): many people. The most among many → pinaka.'},
      {q:'Alin ang pantulong na salita?\n"Mas mabait si Liza kaysa kay Ana."', qen:'Which is the helper word that shows the level?', options:['mabait','Liza','mas','Ana'], correct:2, explain:'Ang "mas" (kasama ang "kaysa") ang nagsasabing Hindi Magkatulad ito.', en:'mas is the helper word.', why:['Ang "mabait" ay ang pang-uri, hindi ang pantulong na salita.', 'Si Liza ay tauhan na inilalarawan. Hindi siya pantulong na salita.', '', 'Si Ana ay tauhan na pinaghahambingan. Hindi siya pantulong na salita.'], whyEn:['"mabait" (kind) is the describing word, not the helper word.', 'Liza is the person being described. She is not a helper word.', '', 'Ana is the person being compared with. She is not a helper word.'], tip:'Ang pantulong na salita ay nasa listahan: mas, kaysa, sing-, pareho, pinaka-, napaka-. Hanapin ito sa pangungusap.', tipEn:'The helper words are on the list: mas, kaysa, sing-, pareho, pinaka-, napaka-. Find one in the sentence.'},
      {q:'Ilan ang inilalarawan sa LANTAY?', qen:'How many things are described in LANTAY?', options:['Isa lamang','Dalawa','Tatlo o higit pa','Wala'], correct:0, explain:'Lantay = isa lamang.', en:'Only one.', why:['', 'Ang dalawa ay para sa Pahambing, hindi Lantay.', 'Ang higit sa dalawa ay para sa Pasukdol, hindi Lantay.', 'Kailangang may inilalarawan. Isa lamang ang sa Lantay.'], whyEn:['', 'Two is for Pahambing, not Lantay.', 'More than two is for Pasukdol, not Lantay.', 'There must be something described. Lantay has only one.'], tip:'Tandaan ang hagdan: Lantay = isa, Pahambing = dalawa, Pasukdol = pinaka.', tipEn:'Remember the steps: Lantay = one, Pahambing = two, Pasukdol = the most.'},
      {q:'Tama o Mali: May dalawang uri ang pahambing — magkatulad at hindi magkatulad.', qen:'True or False: Pahambing has two kinds: the same, and not the same.', options:['Tama','Mali'], correct:0, explain:'Tama — Magkatulad (pareho) at Hindi Magkatulad (hindi pareho).', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Dalawa talaga ang uri ng pahambing: Magkatulad (pareho) at Hindi Magkatulad (hindi pareho).'], whyEn:['', 'You said False, but it is true. Pahambing really has two kinds: Magkatulad (the same) and Hindi Magkatulad (not the same).'], tip:'Isipin ang PM at PHM sa pagtataya — dalawang titik para sa dalawang uri ng pahambing.', tipEn:'Think of PM and PHM in the test: two codes for the two kinds of pahambing.'},
      {q:'Anong antas ng paglalarawan?\n"Mabait si Ana sa kaniyang mga kaibigan."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:0, explain:'Lantay — si Ana lang ang inilalarawan. Walang inihahambing.', en:'Only Ana is described. No comparing.', why:['', 'Walang "sing-" o "pareho." Si Ana lang ang inilalarawan.', 'Walang "mas" o "kaysa." Hindi inihahambing si Ana.', 'Walang "pinaka-" o "napaka-" dito.'], whyEn:['', 'There is no "sing-" or "pareho." Only Ana is described.', 'There is no "mas" or "kaysa." Ana is not being compared.', 'There is no "pinaka-" or "napaka-" here.'], tip:'Mag-ingat: may "mga kaibigan," pero si Ana LANG ang mabait sa pangungusap. Walang pantulong na salita → Lantay.', tipEn:'Be careful: there are "friends," but ONLY Ana is described as kind. No helper word → Lantay.'},
      {q:'Anong antas ng paglalarawan?\n"Si Maria ang pinakamasipag sa kanilang pangkat."', qen:'Which level of describing is this?', options:['Lantay','Pahambing - Magkatulad','Pahambing - Hindi Magkatulad','Pasukdol'], correct:3, explain:'May "pinaka-" — Pasukdol.', en:'pinaka- means the most.', why:['May "pinaka-," kaya hindi ito Lantay.', 'Walang "sing-" o "pareho" dito.', 'Walang "mas" o "kaysa" dito.', ''], whyEn:['It has "pinaka-," so it is not Lantay.', 'There is no "sing-" or "pareho" here.', 'There is no "mas" or "kaysa" here.', ''], tip:'Tingnan ang simula ng pang-uri: PINAKA-masipag. Pinaka → P.', tipEn:'Look at the start of the describing word: PINAKA-masipag. Pinaka → P.'},
      {q:'Alin ang angkop na salita?\n"______ bait ng batang tumutulong sa kaniyang kapuwa."', qen:'Which word fits in the blank?', options:['Mas','Magsing','Pinaka','Napaka'], correct:3, explain:'"Napakabait ng batang tumutulong sa kaniyang kapuwa." — napaka- (pasukdol).', en:'napaka- fits here.', why:['Walang "kaysa" at walang inihahambing, kaya hindi "Mas."', 'Isa lang ang bata. Kailangan ng dalawang pareho para sa "magsing-."', 'Ginagamit ang "pinaka" kapag may pinaghahambingan, gaya ng "sa lahat" o "sa magkakaibigan." Walang ganito sa pangungusap.', ''], whyEn:['There is no "kaysa" and nothing is compared, so not "Mas."', 'There is only one child. "magsing-" needs two that are the same.', '"pinaka" is used when there is a group to compare with, like "sa lahat" (of all) or "sa magkakaibigan" (among friends). This sentence has none.', ''], tip:'Basahin nang malakas ang pangungusap kasama ang bawat pagpipilian. Walang "kaysa" at walang "sa lahat," kaya Napaka ang bagay.', tipEn:'Read the sentence out loud with each choice. There is no "kaysa" and no "sa lahat," so Napaka fits.'},
      {q:'Sa Pagtataya, anong titik ang isusulat para sa Pahambing-Hindi Magkatulad?', qen:'In the test, which letters do you write for Pahambing-Hindi Magkatulad?', options:['L','PM','PHM','P'], correct:2, explain:'PHM = Pahambing-Hindi Magkatulad.', en:'PHM.', why:['Ang L ay para sa Lantay.', 'Ang PM ay para sa Pahambing-Magkatulad. Kulang ang H para sa "Hindi."', '', 'Ang P ay para sa Pasukdol.'], whyEn:['L is for Lantay.', 'PM is for Pahambing-Magkatulad. It is missing the H for "Hindi."', '', 'P is for Pasukdol.'], tip:'Kunin ang unang titik ng bawat salita: Pahambing-Hindi-Magkatulad → P-H-M.', tipEn:'Take the first letter of each word: Pahambing-Hindi-Magkatulad → P-H-M.'},
      {q:'Alin ang pantulong na salita ng PASUKDOL?', qen:'Which helper word is used for PASUKDOL (the most)?', options:['kaysa','walang katulad','magkasing-','pareho'], correct:1, explain:'"walang katulad" ay pang-pasukdol, kasama ang pinaka-, napaka-, pagka-, at walang kaparis.', en:'walang katulad means "nothing like it", so it is the most.', why:['Ang "kaysa" ay para sa Hindi Magkatulad (PHM), hindi Pasukdol.', '', 'Ang "magkasing-" ay para sa Magkatulad (PM), hindi Pasukdol.', 'Ang "pareho" ay para sa Magkatulad (PM), hindi Pasukdol.'], whyEn:['"kaysa" is for Hindi Magkatulad (PHM), not Pasukdol.', '', '"magkasing-" is for Magkatulad (PM), not Pasukdol.', '"pareho" is for Magkatulad (PM), not Pasukdol.'], tip:'Isipin: "walang katulad" = wala nang kapareho. Iyan ang pinaka → Pasukdol.', tipEn:'Think: "walang katulad" = nothing else is like it. That is the most → Pasukdol.'},
      {q:'Alin ang pantulong na salita ng Pahambing - MAGKATULAD?', qen:'Which helper word is used for MAGKATULAD (the same)?', options:['kapuwa','higit','lalo','pinaka-'], correct:0, explain:'"kapuwa" ay pang-magkatulad, kasama ang sing-, magsing-, magkasing-, pareho, tulad, at gaya.', en:'kapuwa means both are the same.', why:['', 'Ang "higit" ay para sa Hindi Magkatulad, hindi Magkatulad.', 'Ang "lalo" ay para sa Hindi Magkatulad, hindi Magkatulad.', 'Ang "pinaka-" ay para sa Pasukdol, hindi Magkatulad.'], whyEn:['', '"higit" is for Hindi Magkatulad, not Magkatulad.', '"lalo" is for Hindi Magkatulad, not Magkatulad.', '"pinaka-" is for Pasukdol, not Magkatulad.'], tip:'Tandaan ang pang-magkatulad: sing-, magsing-, magkasing-, kapuwa, pareho, tulad, gaya. Lahat ay nangangahulugang PAREHO.', tipEn:'Remember the Magkatulad helpers: sing-, magsing-, magkasing-, kapuwa, pareho, tulad, gaya. They all mean THE SAME.'},
      {q:'Ano ang ipinakikita ng pasukdol?', qen:'What does pasukdol show?', options:['Karaniwang katangian ng iisa','Magkaparehong katangian ng dalawang tao o bagay','Pinakamatindi o pinakamataas na katangian','Walang katangian'], correct:2, explain:'Ang pasukdol ay pinakamatindi o pinakamataas na katangian.', en:'The most, or the highest.', why:['Iyan ang Lantay — isa lang at walang inihahambing.', 'Iyan ang Pahambing - Magkatulad.', '', 'Laging may katangian kapag naglalarawan. Ang pasukdol ay ang pinakamataas na katangian.'], whyEn:['That is Lantay: only one, with no comparing.', 'That is Pahambing - Magkatulad.', '', 'Describing always has a trait. Pasukdol is the highest trait.'], tip:'Pasukdol = pinaka. Hanapin ang sagot na may salitang "pinaka."', tipEn:'Pasukdol = the most. Find the answer with the word "pinaka."'},
      {q:'Tama o Mali: Ginagamit ang lantay kapag dalawa ang inihahambing.', qen:'True or False: Lantay is used when comparing two things.', options:['Tama','Mali'], correct:1, explain:'Mali — ang lantay ay para sa isa lang. Pahambing ang para sa dalawa.', en:'False. Lantay is for one only.', why:['Pinili mo ang Tama, pero mali ito. Ang "dalawa" ang mali. Isa lang ang sa Lantay. Ang Pahambing ang para sa dalawa.', ''], whyEn:['You said True, but it is false. The word "two" is wrong. Lantay is for one only. Pahambing is for two.', ''], tip:'Tandaan ang bilang: Lantay = isa, Pahambing = dalawa.', tipEn:'Remember the numbers: Lantay = one, Pahambing = two.'},
    ]
  },
  {
    id:'sightwords', emoji:'👀', title:'Sight Words sa Filipino', subtitle:'Mga Salitang Nakikita Agad',
    flashcards:[
      {icon:'👀', term:'Sight Words', def:'Mga salitang MADALAS makita sa babasahin, tulad ng maikling kuwento.\nPagkakita mo, BASA MO NA AGAD!', en:'Sight words = words you see a lot when reading. You can read them right away.'},
      {icon:'🧠', term:'Ibang Tawag', def:'"Mga salitang nakikita agad"\n"Mga salitang dapat kabisado"', en:'Other names: "words you see right away" and "words to memorize."'},
      {icon:'⚡', term:'Bakit Mahalaga?', def:'Hindi na kailangang baybayin o isipin nang matagal.\nKaya MABILIS kang makabasa!', en:'You do not need to spell them out, so you read faster.'},
      {icon:'🔤', term:'Mga Halimbawa (1)', def:'sa, kayo, ko, mo, si', en:'Read them out loud.'},
      {icon:'🔡', term:'Mga Halimbawa (2)', def:'ano, sino, may, at, nang', en:'Read them out loud.'},
      {icon:'🆕', term:'Mga Halimbawa (3)', def:'bago, tayo, maganda, ng', en:'Read them out loud.'},
      {icon:'📚', term:'Tandaan', def:'Magbasa ARAW-ARAW para mas makilala ang mga salitang ito.\nAng sight words ay unang hakbang sa pagiging mahusay na mambabasa.', en:'Read every day. Sight words are the first step to becoming a good reader.'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Sa "Punan ang patlang":\nBasahin nang MALAKAS ang pangungusap kasama ang bawat pagpipilian.\nAlin ang TUNOG TAMA? Iyon ang sagot!', en:'For fill in the blank: read the sentence out loud with each choice. Which one sounds right? That is the answer.'},
    ],
    quiz:[
      {q:'Ano ang sight words?', qen:'What are sight words?', options:['Mga salitang madalas mabasa sa babasahin','Mga salitang napakahaba at mahirap basahin ng mga bata','Mga pangalan ng tao at lugar','Mga salitang galing sa ibang bansa'], correct:0, explain:'Ang sight words ay mga salitang madalas mabasa sa babasahin, tulad ng maikling kuwento.', en:'Words you see a lot when reading.', why:['', 'Kabaligtaran ito. Madaling basahin ang sight words — nababasa agad.', 'Ang mga pangalan ng tao at lugar ay Pantangi, hindi sight words.', 'Hindi ito ang sight words. Ang sight words ay mga salitang madalas makita sa babasahin.'], whyEn:['', 'This is the opposite. Sight words are easy. You can read them right away.', 'Names of people and places are Pantangi, not sight words.', 'That is not what sight words are. Sight words are words you see a lot when reading.'], tip:'Isipin ang pangalan: SIGHT = nakikita. Mga salitang nakikita at nababasa agad dahil madalas lumabas.', tipEn:'Think of the name: SIGHT = seeing. Words you see and read right away because they show up a lot.'},
      {q:'Bakit mahalagang kabisaduhin ang sight words?', qen:'Why is it important to memorize sight words?', options:['Para bumagal ang pagbasa','Para mabilis mabasa ang teksto','Para hindi na kailangang magbasa ng aklat','Para humaba ang kuwento'], correct:1, explain:'Nakatutulong ang sight words para mabilis mabasa ang teksto.', en:'So you can read faster.', why:['Kabaligtaran — pinabibilis ng sight words ang pagbasa, hindi pinababagal.', '', 'Kailangan pa ring magbasa. Tumutulong lang ang sight words para mabilis ka.', 'Walang kinalaman ang sight words sa haba ng kuwento.'], whyEn:['The opposite. Sight words make reading faster, not slower.', '', 'You still need to read. Sight words just help you read fast.', 'Sight words have nothing to do with how long a story is.'], tip:'Tandaan: sight words → MABILIS magbasa. Hanapin ang sagot na may "mabilis."', tipEn:'Remember: sight words → read FAST. Find the answer with "mabilis" (fast).'},
      {q:'Ano pa ang ibang tawag sa sight words?', qen:'What is another name for sight words?', options:['Mga salitang nakikita agad','Mga salitang magkatugma ang tunog sa dulo','Mga salitang kumikilos','Mga salitang pananong'], correct:0, explain:'Tinatawag din itong "mga salitang nakikita agad" o "mga salitang dapat kabisado."', en:'"Words you see right away."', why:['', 'Iyan ang salitang magkatugma — ibang aralin iyan.', 'Iyan ang pandiwa — ibang aralin iyan.', 'Iyan ang panghalip na pananong — ibang aralin iyan.'], whyEn:['', 'That is rhyming words. It is a different lesson.', 'That is pandiwa (verbs). It is a different lesson.', 'That is question words. It is a different lesson.'], tip:'Alalahanin ang dalawang ibang tawag: "nakikita agad" at "dapat kabisado."', tipEn:'Remember the two other names: "seen right away" and "must memorize."'},
      {q:'Alin ang isa sa mga halimbawa ng sight words sa aralin?', qen:'Which one is a sight word from the lesson?', options:['sampaguita','kayo','pangangatawan','silid-aralan'], correct:1, explain:'Ang "kayo" ay sight word: sa, kayo, ko, mo, si.', en:'kayo is a sight word. It is short and used a lot.', why:['Mahaba ang "sampaguita" at wala ito sa listahan ng sight words sa aralin.', '', 'Mahaba ang "pangangatawan" at wala ito sa listahan ng sight words sa aralin.', 'Mahaba ang "silid-aralan" at wala ito sa listahan ng sight words sa aralin.'], whyEn:['"sampaguita" is long, and it is not on the sight word list in the lesson.', '', '"pangangatawan" is long, and it is not on the sight word list in the lesson.', '"silid-aralan" is long, and it is not on the sight word list in the lesson.'], tip:'Maiikli at madalas makita ang sight words sa aralin: sa, kayo, ko, mo, si. Hanapin ang maikli.', tipEn:'The sight words in the lesson are short and seen a lot: sa, kayo, ko, mo, si. Look for the short one.'},
      {q:'Alin ang grupo ng sight words?', qen:'Which group is made of sight words?', options:['rosas, lobo, lapis','sa, ko, mo','hardin, puno, bulaklak','atleta, guro, nanay'], correct:1, explain:'"sa, ko, mo" ay mga sight words mula sa aralin.', en:'sa, ko, mo are sight words from the lesson.', why:['Mga pangalan ng bagay ito. Wala sila sa listahan ng sight words sa aralin.', '', 'Mga pangalan ng bagay at lugar ito. Wala sila sa listahan ng sight words sa aralin.', 'Mga pangalan ng tao ito. Wala sila sa listahan ng sight words sa aralin.'], whyEn:['These are names of things. They are not on the sight word list in the lesson.', '', 'These are names of things and places. They are not on the sight word list in the lesson.', 'These are names of people. They are not on the sight word list in the lesson.'], tip:'Hanapin ang grupong puro maiikling salita na madalas mong makita, gaya ng sa, ko, mo.', tipEn:'Find the group of short words you see all the time, like sa, ko, mo.'},
      {q:'Punan ang patlang ng wastong sight word.\n"______ ay masaya."', qen:'Fill in the blank with the correct sight word.', options:['Ako','ng','bagong','magandang'], correct:0, explain:'"Ako ay masaya."', en:'"Ako ay masaya" = I am happy.', why:['', 'Basahin: "Ng ay masaya." Hindi ito tunog tama.', 'Basahin: "Bagong ay masaya." Hindi ito tunog tama. Kailangan ng salitang pamalit sa tao.', 'Basahin: "Magandang ay masaya." Hindi ito tunog tama. Kailangan ng salitang pamalit sa tao.'], whyEn:['', 'Read it: "Ng ay masaya." It does not sound right.', 'Read it: "Bagong ay masaya." It does not sound right. We need a word for a person.', 'Read it: "Magandang ay masaya." It does not sound right. We need a word for a person.'], tip:'Itanong: SINO ang masaya? Kailangan ng salitang pamalit sa tao sa patlang.', tipEn:'Ask: WHO is happy? The blank needs a word that stands for a person.'},
      {q:'Punan ang patlang ng wastong sight word.\n"Si Ana ay may ______ bag."', qen:'Fill in the blank with the correct sight word.', options:['tayo','ng','magandang','ako'], correct:2, explain:'"Si Ana ay may magandang bag."', en:'Ana has a beautiful bag.', why:['Basahin: "may tayo bag." Hindi ito tunog tama.', 'Basahin: "may ng bag." Hindi ito tunog tama.', '', 'Basahin: "may ako bag." Hindi ito tunog tama.'], whyEn:['Read it: "may tayo bag." It does not sound right.', 'Read it: "may ng bag." It does not sound right.', '', 'Read it: "may ako bag." It does not sound right.'], tip:'Itanong: ANONG klaseng bag? Kailangan ng salitang naglalarawan sa bag.', tipEn:'Ask: WHAT KIND of bag? The blank needs a word that describes the bag.'},
      {q:'Punan ang patlang ng wastong sight word.\n"Gusto ko ng ______ laruan."', qen:'Fill in the blank with the correct sight word.', options:['bagong','tayo','ng','ako'], correct:0, explain:'"Gusto ko ng bagong laruan."', en:'I want a new toy.', why:['', 'Basahin: "Gusto ko ng tayo laruan." Hindi ito tunog tama.', 'Basahin: "Gusto ko ng ng laruan." Dalawang "ng" — hindi ito tunog tama.', 'Basahin: "Gusto ko ng ako laruan." Hindi ito tunog tama.'], whyEn:['', 'Read it: "Gusto ko ng tayo laruan." It does not sound right.', 'Read it: "Gusto ko ng ng laruan." Two "ng" words. It does not sound right.', 'Read it: "Gusto ko ng ako laruan." It does not sound right.'], tip:'Itanong: ANONG klaseng laruan? Ang naglalarawan sa laruan ang bagay sa patlang.', tipEn:'Ask: WHAT KIND of toy? The word that describes the toy fits in the blank.'},
      {q:'Punan ang patlang ng wastong sight word.\n"Pupunta ______ sa paaralan."', qen:'Fill in the blank with the correct sight word.', options:['ng','tayo','bagong','magandang'], correct:1, explain:'"Pupunta tayo sa paaralan."', en:'We will go to school.', why:['Basahin: "Pupunta ng sa paaralan." Hindi ito tunog tama.', '', 'Basahin: "Pupunta bagong sa paaralan." Hindi ito tunog tama. Walang nagsasabi kung sino ang pupunta.', 'Basahin: "Pupunta magandang sa paaralan." Hindi ito tunog tama. Walang nagsasabi kung sino ang pupunta.'], whyEn:['Read it: "Pupunta ng sa paaralan." It does not sound right.', '', 'Read it: "Pupunta bagong sa paaralan." It does not sound right. Nothing tells who is going.', 'Read it: "Pupunta magandang sa paaralan." It does not sound right. Nothing tells who is going.'], tip:'Itanong: SINO ang pupunta? Kailangan ng salitang pamalit sa tao, gaya ng "tayo."', tipEn:'Ask: WHO is going? The blank needs a word that stands for people, like "tayo."'},
      {q:'Punan ang patlang ng wastong sight word.\n"Wala ______ tubig sa baso."', qen:'Fill in the blank with the correct sight word.', options:['tayo','ako','ng','bagong'], correct:2, explain:'"Wala ng tubig sa baso." — "ng" ang sagot ayon sa aralin.', en:'There is no more water in the glass.', why:['Basahin: "Wala tayo tubig sa baso." Hindi ito tunog tama.', 'Basahin: "Wala ako tubig sa baso." Hindi ito tunog tama.', '', 'Basahin: "Wala bagong tubig sa baso." Hindi ito tunog tama.'], whyEn:['Read it: "Wala tayo tubig sa baso." It does not sound right.', 'Read it: "Wala ako tubig sa baso." It does not sound right.', '', 'Read it: "Wala bagong tubig sa baso." It does not sound right.'], tip:'Basahin nang malakas ang pangungusap kasama ang bawat pagpipilian. Ang maikling salitang dumudugtong sa "tubig" ang sagot.', tipEn:'Read the sentence out loud with each choice. The short word that joins to "tubig" is the answer.'},
      {q:'Ano ang dapat gawin para mas makilala ang sight words?', qen:'What should you do to know sight words better?', options:['Magbasa araw-araw','Huwag nang magbasa','Magbasa isang beses sa isang taon','Kabisaduhin lang ang mahahabang salita'], correct:0, explain:'Magbasa araw-araw para mas makilala ang mga salitang ito.', en:'Read every day.', why:['', 'Kabaligtaran ito — kailangang magbasa para makilala ang sight words.', 'Masyadong madalang iyan. Araw-araw ang sabi ng aralin.', 'Maiikli ang sight words, gaya ng sa, ko, at mo. Hindi mahahabang salita.'], whyEn:['', 'This is the opposite. You need to read to get to know sight words.', 'That is too rare. The lesson says every day.', 'Sight words are short, like sa, ko, and mo. They are not long words.'], tip:'Tandaan: kapag madalas mong makita ang salita, mas mabilis mo itong mababasa. Kaya araw-araw!', tipEn:'Remember: the more often you see a word, the faster you read it. So read every day!'},
      {q:'Tama o Mali: Kailangang baybayin nang matagal ang sight words bago ito mabasa.', qen:'True or False: You need to spell out sight words slowly before you can read them.', options:['Tama','Mali'], correct:1, explain:'Mali — nakikita agad at nababasa agad ang sight words.', en:'False. You can read them right away.', why:['Pinili mo ang Tama, pero mali ito. Ang "kailangang baybayin nang matagal" ang mali. Nababasa agad ang sight words.', ''], whyEn:['You said True, but it is false. The part "need to spell out slowly" is wrong. You can read sight words right away.', ''], tip:'Isipin ang ibang tawag: "nakikita AGAD." Kung agad, hindi na matagal.', tipEn:'Think of the other name: "seen RIGHT AWAY." If it is right away, it is not slow.'},
      {q:'Tama o Mali: Ang pagkatuto ng sight words ay unang hakbang sa pagiging mahusay na mambabasa.', qen:'True or False: Learning sight words is the first step to becoming a good reader.', options:['Tama','Mali'], correct:0, explain:'Tama — iyan ang sabi ng aralin.', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Sabi ng aralin: ang sight words ay unang hakbang sa pagiging mahusay na mambabasa.'], whyEn:['', 'You said False, but it is true. The lesson says: sight words are the first step to becoming a good reader.'], tip:'Alalahanin ang flashcard na "Tandaan": sight words → unang hakbang sa mahusay na pagbasa.', tipEn:'Remember the "Tandaan" flashcard: sight words → the first step to reading well.'},
    ]
  },
  {
    id:'kongkreto', emoji:'✋', title:'Kongkreto at Di-Kongkretong Pangngalan', subtitle:'Nahahawakan o Nadarama Lang?',
    flashcards:[
      {icon:'🏷️', term:'Pangngalan', def:'Salitang tumutukoy sa ngalan ng tao, bagay, hayop, lugar, at pangyayari.\nMaaari itong KONGKRETO o DI-KONGKRETO.', en:'A noun names a person, thing, animal, place, or event. It can be concrete or not concrete.'},
      {icon:'✋', term:'Kongkreto (K)', def:'Ngalan na NAKIKITA, NAHAHAWAKAN, o nadarama.\nHalimbawa: sukli, pera, pitaka', en:'Concrete = you can SEE it and TOUCH it.\nExamples: change (money), money, wallet.'},
      {icon:'💭', term:'Di-Kongkreto (DK)', def:'HINDI NAHAHAWAKAN, pero nadarama, naiisip, o nauunawaan.\nHalimbawa: tulong, pag-ibig, gutom', en:'Not concrete = you CANNOT touch it, but you can feel it, think it, or understand it.\nExamples: help, love, hunger.'},
      {icon:'📋', term:'Halimbawa', def:'KONGKRETO → DI-KONGKRETO\nsukli → tulong\npera → pag-ibig\npitaka → gutom', en:'The left side you can touch. The right side you cannot touch.'},
      {icon:'✏️', term:'Pagsasanay', def:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\nguro — K\ndyip — K\ngalit — DK\ntakot — DK\ngulay — K', en:'Teacher, jeepney, vegetables = K (you can touch them).\nAnger, fear = DK (you only feel them).'},
      {icon:'🔑', tip:true, term:'Paano Sagutin?', def:'Itanong: MAHAHAWAKAN ko ba ito?\nOo → K (Kongkreto)\nHindi, nadarama o naiisip lang → DK (Di-Kongkreto)', en:'Ask: Can I TOUCH it?\nYes → K.\nNo, I can only feel it or think it → DK.'},
    ],
    quiz:[
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"guro"', qen:'Is it concrete (K) or not concrete (DK)? "guro" = teacher', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:0, explain:'Kongkreto — tao ang guro. Nakikita at nahahawakan natin siya.', en:'A teacher is a person you can see and touch.', why:['', 'Hindi ito DK. Tao ang guro — nakikita at nahahawakan mo siya.'], whyEn:['', 'It is not DK. A teacher is a person. You can see and touch them.'], tip:'Itanong: Mahahawakan ko ba ang guro? Oo → K.', tipEn:'Ask: Can I touch a teacher? Yes → K.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"dyip"', qen:'Is it concrete (K) or not concrete (DK)? "dyip" = jeepney', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:0, explain:'Kongkreto — sasakyan ang dyip. Nakikita at nahahawakan ito.', en:'A jeepney is a vehicle you can see and touch.', why:['', 'Hindi ito DK. Sasakyan ang dyip — nakikita at nasasakyan mo ito.'], whyEn:['', 'It is not DK. A jeepney is a vehicle. You can see it and ride it.'], tip:'Bagay ba ito na nakikita mo sa daan? Oo → K.', tipEn:'Is it a thing you can see on the road? Yes → K.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"galit"', qen:'Is it concrete (K) or not concrete (DK)? "galit" = anger', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:1, explain:'Di-kongkreto — nadarama natin ang galit, pero hindi ito nahahawakan.', en:'You feel anger, but you cannot touch it.', why:['Hindi ito K. Hindi mo mahahawakan ang galit. Nadarama mo lang ito.', ''], whyEn:['It is not K. You cannot touch anger. You only feel it.', ''], tip:'Damdamin ba ito? Ang damdamin ay nadarama pero hindi nahahawakan → DK.', tipEn:'Is it a feeling? A feeling is felt but not touched → DK.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"takot"', qen:'Is it concrete (K) or not concrete (DK)? "takot" = fear', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:1, explain:'Di-kongkreto — nadarama natin ang takot, pero hindi ito nahahawakan.', en:'You feel fear, but you cannot touch it.', why:['Hindi ito K. Hindi mo mahahawakan ang takot. Nadarama mo lang ito.', ''], whyEn:['It is not K. You cannot touch fear. You only feel it.', ''], tip:'Kapatid ng "galit" ang "takot" — pareho silang damdamin → DK.', tipEn:'"takot" is like "galit." Both are feelings → DK.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"gulay"', qen:'Is it concrete (K) or not concrete (DK)? "gulay" = vegetables', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:0, explain:'Kongkreto — nakikita, nahahawakan, at nakakain natin ang gulay.', en:'You can see, touch, and eat vegetables.', why:['', 'Hindi ito DK. Nahahawakan at nakakain mo ang gulay.'], whyEn:['', 'It is not DK. You can touch and eat vegetables.'], tip:'Mahahawakan mo ba ang gulay sa palengke? Oo → K.', tipEn:'Can you hold vegetables at the market? Yes → K.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"sukli"', qen:'Is it concrete (K) or not concrete (DK)? "sukli" = change (money given back)', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:0, explain:'Kongkreto — pera ang sukli. Nahahawakan mo ito.', en:'Change is money. You can hold it.', why:['', 'Hindi ito DK. Pera ang sukli — hawak mo ito sa kamay.'], whyEn:['', 'It is not DK. Change is money. You hold it in your hand.'], tip:'Ang sukli ay perang ibinabalik sa iyo. Mahahawakan → K.', tipEn:'Change is money given back to you. You can touch it → K.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"pitaka"', qen:'Is it concrete (K) or not concrete (DK)? "pitaka" = wallet', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:0, explain:'Kongkreto — bagay ang pitaka. Nahahawakan mo ito.', en:'A wallet is a thing you can hold.', why:['', 'Hindi ito DK. Bagay ang pitaka — dito mo inilalagay ang pera.'], whyEn:['', 'It is not DK. A wallet is a thing. You put money in it.'], tip:'Bagay ba ito na mailalagay mo sa bulsa? Oo → K.', tipEn:'Is it a thing you can put in your pocket? Yes → K.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"tulong"', qen:'Is it concrete (K) or not concrete (DK)? "tulong" = help', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:1, explain:'Di-kongkreto — nauunawaan natin ang tulong, pero hindi ito nahahawakan.', en:'You understand help, but you cannot touch it.', why:['Hindi ito K. Hindi mo mahahawakan ang tulong mismo. Nauunawaan at nadarama mo lang ito.', ''], whyEn:['It is not K. You cannot touch help itself. You only understand and feel it.', ''], tip:'Sa aralin, nasa hanay ng DI-KONGKRETO ang "tulong." Hindi ito bagay na mahahawakan.', tipEn:'In the lesson, "tulong" is in the NOT CONCRETE column. It is not a thing you can touch.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"pag-ibig"', qen:'Is it concrete (K) or not concrete (DK)? "pag-ibig" = love', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:1, explain:'Di-kongkreto — nadarama natin ang pag-ibig, pero hindi ito nahahawakan.', en:'You feel love, but you cannot touch it.', why:['Hindi ito K. Hindi mo mahahawakan ang pag-ibig. Nadarama mo lang ito.', ''], whyEn:['It is not K. You cannot touch love. You only feel it.', ''], tip:'Damdamin ang pag-ibig. Nadarama pero hindi nahahawakan → DK.', tipEn:'Love is a feeling. Felt but not touched → DK.'},
      {q:'Isulat ang K kung kongkreto at DK kung di-kongkreto.\n"gutom"', qen:'Is it concrete (K) or not concrete (DK)? "gutom" = hunger', options:['Kongkreto (K)','Di-Kongkreto (DK)'], correct:1, explain:'Di-kongkreto — nadarama natin ang gutom, pero hindi ito nahahawakan.', en:'You feel hunger, but you cannot touch it.', why:['Hindi ito K. Nadarama mo ang gutom sa tiyan, pero hindi mo ito mahahawakan.', ''], whyEn:['It is not K. You feel hunger in your tummy, but you cannot touch it.', ''], tip:'Mag-ingat: nahahawakan ang pagkain (K), pero ang GUTOM ay nadarama lang → DK.', tipEn:'Be careful: food can be touched (K), but HUNGER is only felt → DK.'},
      {q:'Alin ang pangngalang KONGKRETO?', qen:'Which noun is CONCRETE (you can touch it)?', options:['pera','galit','takot','pag-ibig'], correct:0, explain:'Ang "pera" ay nakikita at nahahawakan — kongkreto.', en:'Money can be seen and touched.', why:['', 'Ang "galit" ay damdamin. Hindi ito nahahawakan, kaya DK.', 'Ang "takot" ay damdamin. Hindi ito nahahawakan, kaya DK.', 'Ang "pag-ibig" ay damdamin. Hindi ito nahahawakan, kaya DK.'], whyEn:['', '"galit" (anger) is a feeling. You cannot touch it, so it is DK.', '"takot" (fear) is a feeling. You cannot touch it, so it is DK.', '"pag-ibig" (love) is a feeling. You cannot touch it, so it is DK.'], tip:'Hanapin ang BAGAY. Ang tatlong iba ay pare-parehong damdamin.', tipEn:'Look for the THING. The other three are all feelings.'},
      {q:'Alin ang pangngalang DI-KONGKRETO?', qen:'Which noun is NOT CONCRETE (you cannot touch it)?', options:['pitaka','dyip','gutom','gulay'], correct:2, explain:'Ang "gutom" ay nadarama pero hindi nahahawakan — di-kongkreto.', en:'Hunger is felt, not touched.', why:['Ang "pitaka" ay bagay na nahahawakan, kaya K.', 'Ang "dyip" ay sasakyang nahahawakan, kaya K.', '', 'Ang "gulay" ay pagkaing nahahawakan, kaya K.'], whyEn:['"pitaka" (wallet) is a thing you can touch, so it is K.', '"dyip" (jeepney) is a vehicle you can touch, so it is K.', '', '"gulay" (vegetables) is food you can touch, so it is K.'], tip:'Isa-isahin: mahahawakan ko ba ito? Ang HINDI mo mahahawakan ang sagot.', tipEn:'Check one by one: can I touch it? The one you CANNOT touch is the answer.'},
      {q:'Ano ang pangngalang KONGKRETO?', qen:'What is a CONCRETE noun?', options:['Ngalan na nakikita at nahahawakan','Ngalan na hindi nahahawakan pero nadarama o naiisip','Salitang kilos','Salitang naglalarawan'], correct:0, explain:'Ang kongkreto ay ngalang nakikita, nahahawakan, o nadarama.', en:'A concrete noun can be seen and touched.', why:['', 'Iyan ang di-kongkreto — hindi nahahawakan.', 'Iyan ang pandiwa — ibang aralin iyan.', 'Iyan ang pang-uri — ibang aralin iyan.'], whyEn:['', 'That is not concrete (DK): it cannot be touched.', 'That is pandiwa (verbs). It is a different lesson.', 'That is pang-uri (adjectives). It is a different lesson.'], tip:'Kongkreto = nahahawakan. Hanapin ang sagot na may "nahahawakan."', tipEn:'Concrete = can be touched. Find the answer with "nahahawakan" (can be touched).'},
      {q:'Ano ang pangngalang DI-KONGKRETO?', qen:'What is a NOT CONCRETE noun?', options:['Ngalan na nakikita at nahahawakan','Ngalan na hindi nahahawakan pero nadarama, naiisip, o nauunawaan','Ngalan ng tao lamang','Salitang pananong'], correct:1, explain:'Ang di-kongkreto ay hindi nahahawakan ngunit nadarama, naiisip, o nauunawaan.', en:'Not concrete: cannot be touched, but can be felt, thought, or understood.', why:['Iyan ang kongkreto — nahahawakan.', '', 'Hindi lang tao. Ang di-kongkreto ay hindi nahahawakan, gaya ng galit at pag-ibig.', 'Iyan ang panghalip na pananong — ibang aralin iyan.'], whyEn:['That is concrete (K): it can be touched.', '', 'Not only people. Not concrete means it cannot be touched, like anger and love.', 'That is question words. It is a different lesson.'], tip:'"DI" = hindi. Di-kongkreto = HINDI nahahawakan.', tipEn:'"DI" means not. Di-kongkreto = CANNOT be touched.'},
      {q:'Tama o Mali: Ang "pera" ay pangngalang di-kongkreto.', qen:'True or False: "pera" (money) is a not concrete noun.', options:['Tama','Mali'], correct:1, explain:'Mali — nakikita at nahahawakan ang pera, kaya kongkreto ito.', en:'False. Money can be touched, so it is concrete.', why:['Pinili mo ang Tama, pero mali ito. Hawak mo ang pera sa kamay, kaya kongkreto (K) ito.', ''], whyEn:['You said True, but it is false. You hold money in your hand, so it is concrete (K).', ''], tip:'Isipin: mahahawakan ko ba ang pera? Oo → K, hindi DK.', tipEn:'Think: can I touch money? Yes → K, not DK.'},
      {q:'Tama o Mali: Hindi nahahawakan ang pangngalang di-kongkreto.', qen:'True or False: A not concrete noun cannot be touched.', options:['Tama','Mali'], correct:0, explain:'Tama — hindi ito nahahawakan, pero nadarama, naiisip, o nauunawaan.', en:'True.', why:['', 'Pinili mo ang Mali, pero tama ito. Ayon sa aralin, ang di-kongkreto ay HINDI nahahawakan.'], whyEn:['', 'You said False, but it is true. The lesson says not concrete nouns CANNOT be touched.'], tip:'Tandaan: DI = hindi. Di-kongkreto → hindi nahahawakan.', tipEn:'Remember: DI = not. Di-kongkreto → cannot be touched.'},
    ]
  },

    quiz:[
      {q:'Isulat ang P kung pangungusap. Ekisan (✗) kung hindi.\n"mataong palengke"', qen:'Write P if it is a sentence. Write X if it is not. "mataong palengke" = crowded market', options:['Pangungusap (P)','Parirala (✗)'], correct:1, explain:'Parirala — hindi buo ang diwa. Ano ang tungkol sa mataong palengke?', en:'It is a phrase. It does not tell a complete thought.', why:['Hindi ito pangungusap. Wala itong malaking titik at tuldok, at kulang ang sinasabi.', ''], whyEn:['It is not a sentence. It has no capital letter and no period, and the thought is not complete.', ''], tip:'Itanong: Ano ang nangyari sa mataong palengke? Kung may kulang → ✗.', tipEn:'Ask: What happened at the crowded market? If something is missing → X.'},

      {q:'Isulat ang P kung pangungusap. Ekisan (✗) kung hindi.\n"Marami silang bentang isda at karne."', qen:'Write P if it is a sentence. Write X if it is not. = They sell a lot of fish and meat.', options:['Pangungusap (P)','Parirala (✗)'], correct:0, explain:'Pangungusap — buo ang diwa, may malaking titik at tuldok.', en:'It is a complete sentence.', why:['', 'Hindi ito parirala. Buo ang sinasabi: marami silang bentang isda at karne.'], whyEn:['', 'It is not a phrase. The thought is complete: they sell a lot of fish and meat.'], tip:'May malaking titik sa simula at tuldok sa dulo, at buo ang sinasabi → P.', tipEn:'Capital letter at the start, period at the end, and a complete thought → P.'},
      {q:'Isulat ang P kung pangungusap. Ekisan (✗) kung hindi.\n"sariwang alimango"', qen:'Write P if it is a sentence. Write X if it is not. "sariwang alimango" = fresh crab', options:['Pangungusap (P)','Parirala (✗)'], correct:1, explain:'Parirala — pangngalan at paglalarawan lang. Hindi buo ang diwa.', en:'It is a phrase. It only names and describes.', why:['Hindi ito pangungusap. Wala itong malaking titik at tuldok, at kulang ang sinasabi.', ''], whyEn:['It is not a sentence. It has no capital letter and no period, and the thought is not complete.', ''], tip:'Itanong: Ano ang tungkol sa sariwang alimango? Kulang pa → ✗.', tipEn:'Ask: What about the fresh crab? Still missing something → X.'},
      {q:'Isulat ang P kung pangungusap. Ekisan (✗) kung hindi.\n"magandang dyip"', qen:'Write P if it is a sentence. Write X if it is not. "magandang dyip" = beautiful jeepney', options:['Pangungusap (P)','Parirala (✗)'], correct:1, explain:'Parirala — pangngalan at paglalarawan lang. Hindi buo ang diwa.', en:'It is a phrase. It only names and describes.', why:['Hindi ito pangungusap. Wala itong malaking titik at tuldok, at kulang ang sinasabi.', ''], whyEn:['It is not a sentence. It has no capital letter and no period, and the thought is not complete.', ''], tip:'Dalawang salita lang ito na walang tuldok. Kulang ang sinasabi → ✗.', tipEn:'It is only two words with no period. The thought is not complete → X.'},
      {q:'Isulat ang P kung pangungusap. Ekisan (✗) kung hindi.\n"ang sukli"', qen:'Write P if it is a sentence. Write X if it is not. "ang sukli" = the change (money)', options:['Pangungusap (P)','Parirala (✗)'], correct:1, explain:'Parirala — nasa Hanay A ito ng aralin. Hindi buo ang diwa.', en:'It is a phrase from Column A of the lesson.', why:['Hindi ito pangungusap. Ano ang tungkol sa sukli? Kulang pa ang sinasabi.', ''], whyEn:['It is not a sentence. What about the change? The thought is not complete.', ''], tip:'Ihambing sa Hanay B: "Ang sukling ibinigay niya ay tama." Iyan ang buo. Ang "ang sukli" ay kulang → ✗.', tipEn:'Compare with Column B: "Ang sukling ibinigay niya ay tama." That one is complete. "ang sukli" is missing something → X.'},
      {q:'Isulat ang P kung pangungusap. Ekisan (✗) kung hindi.\n"Ang sukling ibinigay niya ay tama."', qen:'Write P if it is a sentence. Write X if it is not. = The change he/she gave is correct.', options:['Pangungusap (P)','Parirala (✗)'], correct:0, explain:'Pangungusap — nasa Hanay B ito ng aralin. Buo ang diwa.', en:'It is a sentence from Column B of the lesson.', why:['', 'Hindi ito parirala. Buo ang sinasabi: tama ang sukli na ibinigay niya.'], whyEn:['', 'It is not a phrase. The thought is complete: the change given was correct.'], tip:'Malaking A sa simula, tuldok sa dulo, at buo ang sinasabi → P.', tipEn:'Capital A at the start, a period at the end, and a complete thought → P.'},
      {q:'Isulat ang P kung pangungusap. Ekisan (✗) kung hindi.\n"tulong na ibinigay"', qen:'Write P if it is a sentence. Write X if it is not. "tulong na ibinigay" = help that was given', options:['Pangungusap (P)','Parirala (✗)'], correct:1, explain:'Parirala — nasa Hanay A ito ng aralin. Hindi buo ang diwa.', en:'It is a phrase from Column A of the lesson.', why:['Hindi ito pangungusap. Sino ang nagbigay? Ano ang tungkol dito? Kulang pa.', ''], whyEn:['It is not a sentence. Who gave it? What about it? Something is missing.', ''], tip:'Walang malaking titik at walang tuldok. Kulang pa ang sinasabi → ✗.', tipEn:'No capital letter and no period. The thought is not complete → X.'},

      {q:'Alin ang PARIRALA?', qen:'Which one is a PHRASE (not a complete sentence)?', options:['Mabait ang guro.','Sumakay kami sa dyip.','sariwang isda','Takot ang bata sa aso.'], correct:2, explain:'"sariwang isda" — pangngalan at paglalarawan lang. Hindi buo ang diwa.', en:'"fresh fish" is a phrase.', why:['Pangungusap ito. Buo ang sinasabi at may tuldok.', 'Pangungusap ito. Buo ang sinasabi at may tuldok.', '', 'Pangungusap ito. Buo ang sinasabi at may tuldok.'], whyEn:['This is a sentence. The thought is complete and it has a period.', 'This is a sentence. The thought is complete and it has a period.', '', 'This is a sentence. The thought is complete and it has a period.'], tip:'Hanapin ang WALANG tuldok at kulang ang sinasabi.', tipEn:'Find the one with NO period and a thought that is not complete.'},
      {q:'Ano ang tawag sa grupo ng mga salita na buo ang diwa?', qen:'What do you call a group of words that is a complete thought?', options:['Pangungusap','Parirala','Pangngalan','Pang-uri'], correct:0, explain:'Pangungusap — buo ang diwa.', en:'A sentence.', why:['', 'Ang parirala ay grupo ng salita na HINDI buo ang diwa.', 'Ang pangngalan ay isang salita na ngalan ng tao, bagay, hayop, lugar, o pangyayari.', 'Ang pang-uri ay salitang naglalarawan. Ibang aralin iyan.'], whyEn:['', 'A phrase is a group of words that is NOT a complete thought.', 'A noun is one word that names a person, thing, animal, place, or event.', 'Pang-uri is a describing word. It is a different lesson.'], tip:'Buo = Pangungusap. Kulang = Parirala.', tipEn:'Complete = sentence (pangungusap). Missing something = phrase (parirala).'},
      {q:'Tama o Mali: Ang parirala ay nagsisimula sa malaking titik at nagtatapos sa tuldok.', qen:'True or False: A phrase starts with a capital letter and ends with a period.', options:['Tama','Mali'], correct:1, explain:'Mali — ang PANGUNGUSAP ang may malaking titik at tuldok.', en:'False. The SENTENCE has the capital letter and period.', why:['Pinili mo ang Tama, pero mali ito. Tingnan ang Hanay A: "ang sukli," "ipong pera" — walang malaking titik at tuldok. Ang pangungusap ang mayroon nito.', ''], whyEn:['You said True, but it is false. Look at Column A: "ang sukli," "ipong pera" have no capital letter and no period. The sentence has them.', ''], tip:'Alalahanin ang Hanay B — lahat ay may malaking titik at tuldok. Iyon ang mga pangungusap.', tipEn:'Remember Column B: all have a capital letter and a period. Those are the sentences.'},
      {q:'Sa Pagsasanay, ano ang isusulat kung ang grupo ng salita ay HINDI pangungusap?', qen:'In the exercise, what do you write if the group of words is NOT a sentence?', options:['P','✗ (ekis)','K','DK'], correct:1, explain:'Ekisan (✗) ang patlang kung hindi pangungusap.', en:'Write an X if it is not a sentence.', why:['Ang P ay para sa pangungusap.', '', 'Ang K ay para sa kongkretong pangngalan — ibang pagsasanay iyan.', 'Ang DK ay para sa di-kongkretong pangngalan — ibang pagsasanay iyan.'], whyEn:['P is for a sentence.', '', 'K is for concrete nouns. It is a different exercise.', 'DK is for not concrete nouns. It is a different exercise.'], tip:'P = Pangungusap. Kung hindi → ekis (✗).', tipEn:'P = sentence. If not → X.'},

function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();
const STARS_DAY_KEY = STORAGE_KEY + '_day';
const starsToday = (function(d){ return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); })(new Date());
let starsDay = null;
try{ starsDay = localStorage.getItem(STARS_DAY_KEY); }catch(e){}
if (starsDay !== starsToday){
  progress = {};
  saveProgress(progress);
  try{ localStorage.setItem(STARS_DAY_KEY, starsToday); }catch(e){}
}
if (/(^|[?&])reset=1(&|$)/.test(location.search)){
  SH && SH.appOpened(SH_APP, SH_TITLE);
  if (window.history && window.history.replaceState) history.replaceState(null, '', location.pathname + location.hash);
}

const POINTS_KEY = 'kuwentista_points_v1';
function loadTotalPoints(){ try{ return parseInt(localStorage.getItem(POINTS_KEY), 10) || 0; }catch(e){ return 0; } }
function saveTotalPoints(n){ try{ localStorage.setItem(POINTS_KEY, String(n)); }catch(e){} if(window.Wallet && Wallet.renderCoins) Wallet.renderCoins(); }
let totalPoints = loadTotalPoints();

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Recall decides whether this question pays, shows a typing box, and offers power-ups.
function offerQuestion(pu){
  if (window.Recall) Recall.ask(pu, SH_APP, typeof TYPE_IT === 'undefined' ? null : TYPE_IT);
  else if (window.PowerUps) PowerUps.offer(pu);
}
function prepareQuestion(q){
  const order = shuffle(q.options.map((_,i)=>i));
  const options = order.map(i=>q.options[i]);
  const correct = order.indexOf(q.correct);
  const why = q.why ? order.map(i=>q.why[i]) : [];
  const whyEn = q.whyEn ? order.map(i=>q.whyEn[i]) : [];
  return { q:q.q, qen:q.qen, options, correct, explain:q.explain, en:q.en, passage:q.passage, why, whyEn, tip:q.tip, tipEn:q.tipEn };
}
